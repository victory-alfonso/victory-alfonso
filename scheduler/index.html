                  {(ev.ministries || []).map((block) => {
                    const team = teams.find((t) => t.id === block.teamId);
                    return (
                      <div key={block.id} style={cardBox}>
                        <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
                          <input value={block.title || ""} onChange={(e) => updateMinistry(block.id, (b) => ({ ...b, title: e.target.value }))} style={{ ...dInput, fontWeight: 700 }} />
                          <button onClick={() => removeMinistry(block.id)} style={{ ...styles.smallBtn, background: "var(--bA6402F)" }} aria-label="Remove ministry">✕</button>
                        </div>
                        {team && (team.roles || []).length > 0 && (
                          <div style={{ display: "flex", flexWrap: "wrap", gap: 12, marginBottom: 8 }}>
                            {team.roles.map((teamRole) => (
                              <label key={teamRole.id} style={{ fontSize: 12.5, display: "flex", alignItems: "center", gap: 4, cursor: "pointer" }}>
                                <input type="checkbox" checked={(block.roles || []).some((r) => r.roleId === teamRole.id)} onChange={() => toggleTeamRole(block, teamRole)} />
                                {teamRole.name}
                              </label>
                            ))}
                          </div>
                        )}
                        {(block.roles || []).map((r) => {
                          const v = eventVolunteer(ev, blockRoleKey(block, r));
                          return (
                            <div key={r.id} style={{ display: "flex", gap: 6, marginBottom: 6, alignItems: "center" }}>
                              <input value={r.label || ""} onChange={(e) => setMinistryRole(block, r.id, "label", e.target.value)} placeholder="Role" style={{ ...dInput, flex: "1 1 120px", width: "auto" }} />
                              <div style={{ fontSize: 12, flex: "0 1 120px", minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", opacity: norm(v) ? 0.95 : 0.5 }}>{norm(v) ? v : "— open —"}</div>
                              <button onClick={() => removeMinistryRole(block, r.id)} style={{ ...styles.smallBtn, background: "var(--bA6402F)" }} aria-label="Remove role">✕</button>
                            </div>
                          );
                        })}
                        <button onClick={() => addCustomRole(block)} style={ghostBtn}>+ Custom role</button>
                      </div>
                    );
                  })}
                  <select value="" onChange={(e) => e.target.value && addMinistry(e.target.value)} style={{ ...dInput, maxWidth: 260 }}>
                    <option value="" style={{ background: "#1F3864" }}>+ Add ministry…</option>
                    {teams.filter((t) => !(ev.ministries || []).some((b) => b.teamId === t.id)).map((t) => <option key={t.id} value={t.id} style={{ background: "#1F3864" }}>{t.name}</option>)}
                  </select>

                  <div style={rightLabel}>Announcements (optional)</div>
                  <textarea value={ev.announcements || ""} onChange={(e) => setField("announcements", e.target.value)} rows={3}
                    style={{ ...dInput, resize: "vertical" }} />
                  <label style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 12, fontSize: 13, cursor: "pointer" }}>
                    <input type="checkbox" checked={!!ev.showHeadCount} onChange={(e) => setField("showHeadCount", e.target.checked)} />
                    Include head count box on the sheet
                  </label>
                </div>
              ) : (
                <div>
                  {ministries.length > 0 && (
                    <div>
                      <div style={rightLabel}>Ministries</div>
                      {ministries.map((b) => (
                        <div key={b.id} style={cardBox}>
                          <div style={{ fontWeight: 700, fontSize: 13.5, color: "#FFFFFF", marginBottom: 4 }}>{b.title}</div>
                          {(b.roles || []).map((r) => {
                            const v = eventVolunteer(ev, blockRoleKey(b, r));
                            return (
                              <div key={r.id} style={{ fontSize: 12.5 }}>
                                <span style={{ opacity: 0.7 }}>{r.label}: </span>{norm(v) ? <b style={{ fontWeight: 600 }}>{v}</b> : <span style={{ opacity: 0.5 }}>— open —</span>}
                              </div>
                            );
                          })}
                        </div>
                      ))}
                    </div>
                  )}
                  {norm(ev.announcements) && (
                    <div>
                      <div style={rightLabel}>Announcements</div>
                      <div style={{ ...cardBox, fontSize: 12.5, whiteSpace: "pre-wrap" }}>{ev.announcements}</div>
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      </div>,
      document.body
    );
  };

  // ministries: a block per team, with only the roles picked for this event
  const teams = config.teams || [];
  const addMinistry = (teamId) => {
    const team = teams.find((t) => t.id === teamId);
    if (!team) return;
    updateEvent(openId, (e) => ({
      ...e,
      ministries: [...(e.ministries || []), {
        id: uid(), teamId, title: team.name,
        roles: (team.roles || []).map((r) => ({ id: uid(), roleId: r.id, label: r.name, value: "" })),
      }],
    }));
  };
  const updateMinistry = (blockId, updater) => updateEvent(openId, (e) => ({
    ...e, ministries: (e.ministries || []).map((b) => (b.id === blockId ? updater(b) : b)),
  }));
  const removeMinistry = (blockId) => updateEvent(openId, (e) => ({ ...e, ministries: (e.ministries || []).filter((b) => b.id !== blockId) }));
  const toggleTeamRole = (block, teamRole) => updateMinistry(block.id, (b) => {
    const current = b.roles || [];
    if (current.some((r) => r.roleId === teamRole.id)) return { ...b, roles: current.filter((r) => r.roleId !== teamRole.id) };
    return { ...b, roles: [...current, { id: uid(), roleId: teamRole.id, label: teamRole.name, value: "" }] };
  });
  const setMinistryRole = (block, roleRowId, field, value) => updateMinistry(block.id, (b) => ({
    ...b, roles: (b.roles || []).map((r) => (r.id === roleRowId ? { ...r, [field]: value } : r)),
  }));
  const addCustomRole = (block) => updateMinistry(block.id, (b) => ({ ...b, roles: [...(b.roles || []), { id: uid(), roleId: null, label: "", value: "" }] }));
  const removeMinistryRole = (block, roleRowId) => updateMinistry(block.id, (b) => ({ ...b, roles: (b.roles || []).filter((r) => r.id !== roleRowId) }));

  const createEvent = () => {
    const created = blankEvent();
    updateConfig((prev) => ({ ...prev, events: [...(prev.events || []), created] }));
    setOpenId(created.id);
    setMode("detail");
  };
  const duplicateEvent = (source) => {
    const copy = { ...source, id: uid(), title: `${source.title} (copy)`, date: "", assignments: {}, verses: {}, rows: source.rows.map((r) => ({ ...r, id: uid() })),
      ministries: (source.ministries || []).map((b) => ({ ...b, id: uid(), roles: (b.roles || []).map((r) => ({ ...r, id: uid() })) })) };
    updateConfig((prev) => ({ ...prev, events: [...(prev.events || []), copy] }));
    setOpenId(copy.id);
    setMode("detail");
  };
  // series: events created from one repeating event share a seriesId
  const cloneJson = (v) => JSON.parse(JSON.stringify(v));
  const laterInSeries = (e) => (e.seriesId ? events.filter((x) => x.seriesId === e.seriesId && x.id !== e.id && x.date && x.date > (e.date || "")) : []);
  // ---- Month/year picker + the dates of the repeat, shown on the event card when "Repeats" is chosen ----
  const renderRepeatDates = (ev, dLabel) => {
    const rec = resolveRecurrence(ev);
    const mates = events.filter((x) => x.id === ev.id || (ev.seriesId && x.seriesId === ev.seriesId));
    const byDate = {};
    mates.forEach((x) => { if (x.date) byDate[x.date] = x; });
    const anchor = Object.keys(byDate).sort()[0];
    if (!anchor) return null;
    const yearly = rec.freq === "yearly";
    const [ay, am] = (ev.date || anchor).split("-").map((n) => parseInt(n, 10));
    const cur = repPick && repPick.id === ev.id ? repPick : { year: ay, month: am };
    const single = rec.freq === "monthly" || rec.freq === "yearly"; // one date per month / per year
    // open the event on `iso`, making it first (a copy of this one) if it does not exist yet
    const openOrCreate = (iso) => {
      if (byDate[iso]) { if (byDate[iso].id !== ev.id) { setRepPick(null); setOpenId(byDate[iso].id); } return; }
      const id = createOccurrences(ev, [iso], true);
      if (id) { setRepPick(null); setOpenId(id); }
    };
    const go = (delta) => {
      let y = cur.year, m = cur.month;
      if (yearly) y += delta;
      else { m += delta; while (m > 12) { m -= 12; y += 1; } while (m < 1) { m += 12; y -= 1; } }
      if (single) {
        const pre = yearly ? `${y}-` : `${y}-${padTwo(m)}`;
        const iso = Object.keys(byDate).sort().find((d) => d.startsWith(pre)) || repeatDateIn(rec, y, m, anchor);
        if (iso) { openOrCreate(iso); return; }
      }
      setRepPick({ id: ev.id, year: y, month: m });
    };
    const prefix = yearly ? `${cur.year}-` : `${cur.year}-${padTwo(cur.month)}`;
    const endISO = yearly ? `${cur.year}-12-31` : isoOf(new Date(cur.year, cur.month, 0));
    const set = new Set(recurrenceDates(rec, anchor, endISO).filter((d) => d.startsWith(prefix)));
    Object.keys(byDate).filter((d) => d.startsWith(prefix)).forEach((d) => set.add(d));
    const dates = Array.from(set).sort();
    const navBtn = { background: "transparent", border: "none", color: "#1F3864", fontSize: 20, cursor: "pointer", padding: "0 14px", lineHeight: 1 };
    const openDate = (iso) => openOrCreate(iso);
    return (
      <div>
        <div style={dLabel}>{yearly ? "Year" : "Month & year"}</div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: "#F6F1E4", border: "1px solid #E4DCC6", borderRadius: 12, padding: "6px 4px" }}>
          <button onClick={() => go(-1)} style={navBtn} aria-label={yearly ? "Previous year" : "Previous month"}>‹</button>
          <div style={{ flex: 1, textAlign: "center", fontFamily: "system-ui, sans-serif", fontWeight: 700, fontSize: 15, color: "#1F3864" }}>{yearly ? cur.year : monthLabel(cur.year, cur.month)}</div>
          <button onClick={() => go(1)} style={navBtn} aria-label={yearly ? "Next year" : "Next month"}>›</button>
        </div>
        {single && (() => {
          const patIso = repeatDateIn(rec, cur.year, cur.month, anchor);
          const madeIso = Object.keys(byDate).sort().find((d) => d.startsWith(prefix));
          const showIso = madeIso || patIso;
          const when = (iso) => { const [y, m, d] = iso.split("-").map((n) => parseInt(n, 10)); return `${WEEKDAY_NAMES[new Date(y, m - 1, d).getDay()]}, ${eventDateLabel(iso)}`; };
          const smallBtn = { ...styles.smallBtn, background: "var(--bA9782F)", padding: "7px 12px", marginTop: 8 };
          if (!showIso) return <div style={{ fontSize: 12.5, opacity: 0.8, marginTop: 8 }}>The repeat has ended — no date in {yearly ? cur.year : monthLabel(cur.year, cur.month)}.</div>;
          const isCurrent = madeIso && byDate[madeIso].id === ev.id;
          return (
            <div style={{ marginTop: 8 }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: "#FFFFFF" }}>{when(showIso)}</div>
              <div style={{ fontSize: 11.5, opacity: 0.75, marginTop: 2 }}>{isCurrent ? "This event" : "Not open"}</div>
              {madeIso && isCurrent && patIso && madeIso !== patIso && (
                <div style={{ marginTop: 6 }}>
                  <div style={{ fontSize: 12, color: "#FFD9A0", lineHeight: 1.4 }}>⚠ The repeat falls on {when(patIso)}, not on this date.</div>
                  <button onClick={() => setField("date", patIso)} style={smallBtn}>Move to {eventDateLabel(patIso)}</button>
                </div>
              )}
            </div>
          );
        })()}
        {!single && (<div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 8 }}>
          {dates.length === 0 && <div style={{ fontSize: 12.5, opacity: 0.8 }}>No repeat dates in {yearly ? cur.year : monthLabel(cur.year, cur.month)}.</div>}
          {dates.map((iso) => {
            const [y, m, d] = iso.split("-").map((n) => parseInt(n, 10));
            const active = ev.date === iso;
            const made = !!byDate[iso];
            return (
              <button key={iso} onClick={() => openDate(iso)} aria-label={eventDateLabel(iso)}
                style={{
                  width: yearly ? 74 : 52, height: 48, borderRadius: 10, cursor: "pointer", padding: 0, fontFamily: "system-ui, sans-serif",
                  display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 1,
                  border: active ? "2px solid #FFFFFF" : made ? "1px solid rgba(229,164,48,0.8)" : "1.5px dashed rgba(229,164,48,0.8)",
                  background: active ? "#FFFFFF" : "rgba(255,255,255,0.08)",
                }}>
                <span style={{ fontSize: 8.5, fontWeight: 600, letterSpacing: "0.08em", color: active ? "#7A6E4E" : "rgba(255,255,255,0.7)" }}>{(yearly ? MONTH_NAMES[m - 1].slice(0, 3) : WEEKDAY_NAMES[new Date(y, m - 1, d).getDay()].slice(0, 3)).toUpperCase()}</span>
                <span style={{ fontSize: 16, fontWeight: 700, color: active ? "#1F3864" : "#FFFFFF" }}>{d}</span>
              </button>
            );
          })}
        </div>)}
        {!single && <div style={{ fontSize: 11, opacity: 0.7, marginTop: 6, lineHeight: 1.4 }}>Dashed dates have no changes yet. Tap one to open it; it is only saved once you edit something.</div>}
      </div>
    );
  };
  // ---- Repeat settings panel (left side of the event popup) ----
  const renderRepeatSection = (ev, dInput, dLabel, ghostBtn) => {
    const raw = { ...REC_DEFAULT, ...(ev.recurrence || legacyRecurrence(ev)) };
    const rec = resolveRecurrence(ev);
    const errors = recurrenceErrors(rec, ev.date);
    const setRec = (patch) => updateEvent(openId, (e) => ({
      ...e, recurrence: { ...(e.recurrence || legacyRecurrence(e)), ...patch }, repeat: null,
    }));
    const sel = { ...dInput, padding: "6px 8px" };
    const optStyle = { background: "#2A1A38" };
    const title = { fontSize: 13, fontWeight: 700, color: "#FFFFFF", margin: "10px 0 4px" };
    const section = { borderTop: "1px solid rgba(255,255,255,0.14)", marginTop: 10, paddingTop: 0 };
    const small = { fontSize: 11.5, opacity: 0.75, margin: "2px 0 6px", lineHeight: 1.4 };
    const subLabel = { fontSize: 11, opacity: 0.75, margin: "6px 0 2px" };
    const occSelect = (value, onChange) => (
      <select value={String(value)} onChange={(e) => onChange(e.target.value === "last" ? "last" : Number(e.target.value))} style={sel}>
        {[1, 2, 3, 4].map((n) => <option key={n} value={n} style={optStyle}>{["", "First", "Second", "Third", "Fourth"][n]}</option>)}
        <option value="last" style={optStyle}>Last</option>
      </select>
    );
    const weekdaySelect = (value, onChange) => (
      <select value={value} onChange={(e) => onChange(Number(e.target.value))} style={sel}>
        {WEEKDAY_ORDER.map((d) => <option key={d} value={d} style={optStyle}>{WEEKDAY_NAMES[d]}</option>)}
      </select>
    );
    const monthSelect = (value, onChange) => (
      <select value={value} onChange={(e) => onChange(Number(e.target.value))} style={sel}>
        {MONTH_NAMES.map((n, i) => <option key={n} value={i + 1} style={optStyle}>{n}</option>)}
      </select>
    );
    const daySelect = (value, onChange) => (
      <select value={value} onChange={(e) => onChange(Number(e.target.value))} style={sel}>
        {Array.from({ length: 31 }, (_, i) => i + 1).map((n) => <option key={n} value={n} style={optStyle}>{ordinalNum(n)}</option>)}
      </select>
    );
    const toggleWeekday = (d) => {
      const list = rec.weekdayList.includes(d) ? rec.weekdayList.filter((x) => x !== d) : [...rec.weekdayList, d];
      setRec({ weekdays: list.sort((a, b) => a - b).join(",") });
    };

    let preview = null;
    // closing the popup: a repeating event with no date yet gets its first date from the pattern
    const closeRepeat = (ask) => {
      setRepeatOptions(false);
      if (!rec.repeats || errors.length > 0) return;
      let date = ev.date;
      if (!date) { date = firstRepeatDate(rec, isoOf(new Date())); if (date) setField("date", date); }
      if (ask && date) setRepeatConfirm(true);
    };
    const startIso = ev.date || (rec.repeats && errors.length === 0 ? firstRepeatDate(rec, isoOf(new Date())) : "");
    if (rec.repeats && startIso && errors.length === 0) {
      const dates = recurrenceDates(rec, startIso, recurrenceHorizon(rec, startIso));
      preview = dates.slice(0, 4).map((iso) => {
        const [, m, d] = iso.split("-").map((n) => parseInt(n, 10));
        return `${MONTH_NAMES[m - 1].slice(0, 3)} ${d}`;
      }).join(", ") + (dates.length > 4 ? "…" : "");
    }

    return (
      <div>
        <div style={dLabel}>Repeat</div>
        <button onClick={() => setRepeatOptions(true)} aria-haspopup="dialog"
          style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, textAlign: "left", cursor: "pointer",
            border: "1px solid rgba(255,255,255,0.2)", borderRadius: 10, padding: "10px 12px", background: "rgba(255,255,255,0.05)", color: "#FFFFFF", fontFamily: "system-ui, sans-serif" }}>
          <span style={{ minWidth: 0 }}>
            <span style={{ display: "block", fontSize: 11, opacity: 0.7 }}>Repeat Schedule</span>
            <span style={{ display: "block", fontSize: 14, fontWeight: 700 }}>{errors.length > 0 ? "⚠ " : ""}{recurrenceSummary(rec)}</span>
          </span>
          <span style={{ fontSize: 20, opacity: 0.8, flexShrink: 0 }}>›</span>
        </button>
        {repeatOptions && ReactDOM.createPortal(
          <div className="no-print pane-dark" style={{ ...styles.modalOverlay, zIndex: 2000010 }} onMouseDown={(e) => { if (e.target === e.currentTarget) closeRepeat(false); }}>
            <div role="dialog" aria-label="Repeat options" style={{ width: "min(460px, 100%)", maxHeight: "88vh", overflowY: "auto", boxSizing: "border-box", borderRadius: 16, padding: 16,
              background: "#2A1A38", color: "#EAF0FF", border: "1px solid rgba(255,255,255,0.2)", boxShadow: "0 30px 60px -15px rgba(0,0,0,0.6)", fontFamily: "system-ui, sans-serif" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 4 }}>
                <div style={{ fontSize: 16, fontWeight: 700, color: "#FFFFFF" }}>Repeat</div>
                <button onClick={() => closeRepeat(false)} aria-label="Close" style={{ background: "transparent", border: "none", color: "#FFFFFF", fontSize: 20, cursor: "pointer", lineHeight: 1, padding: "2px 6px" }}>✕</button>
              </div>
        <div style={{ padding: "0 2px 4px" }}>
          <div style={{ ...title, marginTop: 8 }}>Repeat Schedule</div>
          <RecRadio name="rec-repeats" checked={!rec.repeats} onChange={() => setRec({ repeats: false })} label="Does not repeat" />
          <RecRadio name="rec-repeats" checked={rec.repeats} onChange={() => setRec({ repeats: true })} label="Repeats" />
          {rec.repeats && !ev.date && <div style={small}>No date needed — the first date is set from the pattern below.</div>}

          {rec.repeats && (
            <div>
              <div style={section} />
              <div style={title}>Repeat Frequency</div>
              {REC_FREQS.map(([v, label]) => (
                <RecRadio key={v} name="rec-freq" checked={rec.freq === v} onChange={() => setRec({ freq: v })} label={label} />
              ))}

              <div style={section} />
              <div style={title}>Repeat Pattern</div>
              {rec.freq === "daily" && (
                <div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13 }}>
                    Every
                    <input value={raw.interval} onChange={(e) => setRec({ interval: e.target.value.replace(/\D/g, "").slice(0, 3) })}
                      inputMode="numeric" aria-label="Days between repeats" style={{ ...sel, width: 64, flex: "0 0 64px", textAlign: "center" }} />
                    {rec.intervalN === 1 ? "day" : "days"}
                  </div>
                  <div style={small}>Repeat every day, or set an interval such as every 2 days.</div>
                </div>
              )}
              {rec.freq === "weekly" && (
                <div>
                  <div style={small}>Repeat every week on:</div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "2px 8px" }}>
                    {WEEKDAY_ORDER.map((d) => (
                      <label key={d} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, cursor: "pointer", padding: "2px 0" }}>
                        <input type="checkbox" checked={rec.weekdayList.includes(d)} onChange={() => toggleWeekday(d)} style={{ accentColor: "#E5A430", margin: 0 }} />
                        {WEEKDAY_NAMES[d]}
                      </label>
                    ))}
                  </div>
                </div>
              )}
              {rec.freq === "monthly" && (
                <div>
                  <RecRadio name="rec-month-mode" checked={rec.monthMode === "date"} onChange={() => setRec({ monthMode: "date" })} label="On a specific date (e.g. every 15th)" />
                  {rec.monthMode === "date" && (
                    <div>
                      <div style={{ maxWidth: 140, margin: "4px 0 2px 24px" }}>{daySelect(rec.monthDayN, (n) => setRec({ monthDay: n }))}</div>
                      {rec.monthDayN > 28 && <div style={{ ...small, marginLeft: 24 }}>Months with fewer days use their last day instead.</div>}
                    </div>
                  )}
                  <RecRadio name="rec-month-mode" checked={rec.monthMode === "weekday"} onChange={() => setRec({ monthMode: "weekday" })} label="On a specific weekday occurrence (e.g. 4th Sunday)" />
                  {rec.monthMode === "weekday" && (
                    <div style={{ display: "flex", gap: 8, margin: "2px 0 2px 24px" }}>
                      <div style={{ flex: 1, minWidth: 0 }}><div style={subLabel}>Occurrence</div>{occSelect(rec.occ, (v) => setRec({ occurrence: v }))}</div>
                      <div style={{ flex: 1, minWidth: 0 }}><div style={subLabel}>Day</div>{weekdaySelect(rec.wd, (v) => setRec({ weekday: v }))}</div>
                    </div>
                  )}
                </div>
              )}
              {rec.freq === "yearly" && (
                <div>
                  <RecRadio name="rec-year-mode" checked={rec.yearMode === "date"} onChange={() => setRec({ yearMode: "date" })} label="On a specific date (e.g. every December 25)" />
                  {rec.yearMode === "date" && (
                    <div style={{ display: "flex", gap: 8, margin: "4px 0 2px 24px" }}>
                      <div style={{ flex: 2, minWidth: 0 }}><div style={subLabel}>Month</div>{monthSelect(rec.ym, (v) => setRec({ yearMonth: v }))}</div>
                      <div style={{ flex: 1, minWidth: 0 }}><div style={subLabel}>Day</div>{daySelect(rec.yd, (v) => setRec({ yearDay: v }))}</div>
                    </div>
                  )}
                  <RecRadio name="rec-year-mode" checked={rec.yearMode === "weekday"} onChange={() => setRec({ yearMode: "weekday" })} label="On a weekday occurrence within a month (e.g. 4th Thursday of November)" />
                  {rec.yearMode === "weekday" && (
                    <div style={{ margin: "2px 0 2px 24px" }}>
                      <div style={{ display: "flex", gap: 8 }}>
                        <div style={{ flex: 1, minWidth: 0 }}><div style={subLabel}>Occurrence</div>{occSelect(rec.occ, (v) => setRec({ occurrence: v }))}</div>
                        <div style={{ flex: 1, minWidth: 0 }}><div style={subLabel}>Day</div>{weekdaySelect(rec.wd, (v) => setRec({ weekday: v }))}</div>
                      </div>
                      <div style={subLabel}>Month</div>
                      {monthSelect(rec.ym, (v) => setRec({ yearMonth: v }))}
                    </div>
                  )}
                  {rec.yearMode === "date" && rec.ym === 2 && rec.yd === 29 && <div style={{ ...small, marginLeft: 24 }}>In non-leap years this uses February 28.</div>}
                </div>
              )}

              <div style={section} />
              <div style={title}>Ends</div>
              <RecRadio name="rec-ends" checked={rec.endType === "never"} onChange={() => setRec({ endType: "never" })} label="Never" />
              <RecRadio name="rec-ends" checked={rec.endType === "date"} onChange={() => setRec({ endType: "date" })} label="On a specific date" />
              {rec.endType === "date" && (
                <div style={{ margin: "4px 0 4px 24px" }}>
                  <DateInput3 value={raw.endDate || ""} onChange={(v) => setRec({ endDate: v })} style={{ ...dInput, padding: "6px 4px" }} />
                </div>
              )}
              <RecRadio name="rec-ends" checked={rec.endType === "count"} onChange={() => setRec({ endType: "count" })} label="After a number of occurrences" />
              {rec.endType === "count" && (
                <div style={{ display: "flex", alignItems: "center", gap: 8, margin: "4px 0 4px 24px", fontSize: 13 }}>
                  <input value={raw.endCount} onChange={(e) => setRec({ endCount: e.target.value.replace(/\D/g, "").slice(0, 3) })}
                    inputMode="numeric" aria-label="Number of occurrences" style={{ ...sel, width: 72, flex: "0 0 72px", textAlign: "center" }} />
                  occurrences (including this event)
                </div>
              )}
            </div>
          )}

          {errors.length > 0 && (
            <div style={{ marginTop: 10, fontSize: 12, color: "#FFB4A6", lineHeight: 1.45 }}>
              {errors.map((msg) => <div key={msg}>⚠ {msg}</div>)}
            </div>
          )}

          <div style={section} />
          <div style={{ fontSize: 11, opacity: 0.7, margin: "10px 0 2px" }}>Schedule preview</div>
          <div style={{ fontSize: 14, fontWeight: 700, color: "#FFFFFF" }}>{recurrenceSummary(rec)}</div>
          {preview && <div style={{ fontSize: 11.5, opacity: 0.8, marginTop: 4 }}>Dates: {preview}</div>}
        </div>
              <button onClick={() => closeRepeat(true)} disabled={rec.repeats && errors.length > 0}
                style={{ ...ghostBtn, width: "100%", marginTop: 12, padding: "9px 12px", fontSize: 13, fontWeight: 700, background: "var(--bA9782F)", opacity: rec.repeats && errors.length ? 0.45 : 1, cursor: rec.repeats && errors.length ? "not-allowed" : "pointer" }}>Done</button>
            </div>
          </div>,
          document.body
        )}

        {rec.repeats && ev.date && laterInSeries(ev).length > 0 && (
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8 }}>
            <button onClick={() => updateUpcoming(ev)} style={{ ...ghostBtn, padding: "7px 12px", fontSize: 12.5 }}>Update upcoming</button>
          </div>
        )}
        {ev.seriesId && <div style={{ fontSize: 11, opacity: 0.65, marginTop: 4 }}>{events.filter((x) => x.seriesId === ev.seriesId).length} event{events.filter((x) => x.seriesId === ev.seriesId).length === 1 ? "" : "s"} in this series</div>}
      </div>
    );
  };
  // ---- Apply repeat: confirm, then a year/month calendar of the occurrences ----
  const proceedRepeat = () => {
    const src = openEvent;
    setRepeatConfirm(false);
    if (!src) return;
    if (!src.seriesId) setField("seriesId", uid());
    const [y, m] = (src.date || "").split("-").map((n) => parseInt(n, 10));
    if (y && m) setRepPick({ id: src.id, year: y, month: m });
  };
  // makes real events (copy of the source: programs, ministries, start time) on the given dates
  const createOccurrences = (src, isoList, auto) => {
    const rec = resolveRecurrence(src);
    const sid = src.seriesId || uid();
    const taken = new Set(events.filter((x) => x.id === src.id || (x.seriesId && x.seriesId === sid)).map((x) => x.date));
    const fresh = isoList.filter((iso) => !taken.has(iso));
    if (fresh.length === 0) return;
    const copyRec = storedRecurrence(rec);
    const copies = fresh.map((iso) => ({ ...cloneJson(src), id: uid(), date: iso, assignments: {}, verses: {}, announcements: "", seriesId: sid, repeat: null, recurrence: copyRec }));
    updateConfigRaw((prev) => ({
      ...prev,
      events: [...(prev.events || []).map((e) => (e.id === src.id ? { ...e, seriesId: sid } : e)), ...copies],
    }));
    if (auto) copies.forEach((c) => { autoMade.current[c.id] = true; });
    return copies[0].id;
  };
  const renderRepeatConfirm = () => {
    const src = openEvent;
    if (!src) return null;
    const rec = resolveRecurrence(src);
    return (
      <ClearNamesModal
        teamName={recurrenceSummary(rec)}
        title="Proceed with this repeat?"
        body={`“${src.title || "Untitled event"}” will repeat using the schedule below. Then use the month/year picker on the event card to see each date and create the event for any date.`}
        note="No events are created until you choose a date."
        warning="You can still change the repeat settings afterwards."
        confirmLabel="Yes, proceed"
        onCancel={() => { setRepeatConfirm(false); setRepeatOptions(true); }}
        onConfirm={proceedRepeat}
      />
    );
  };
  const renderSeriesCalendar = () => {
    const cal = seriesCal;
    const src = events.find((e) => e.id === cal.srcId);
    if (!src) return null;
    const rec = resolveRecurrence(src);
    const mates = events.filter((x) => x.id === src.id || (x.seriesId && x.seriesId === src.seriesId));
    const byDate = {};
    mates.forEach((x) => { if (x.date) byDate[x.date] = x; });
    const anchor = Object.keys(byDate).sort()[0] || src.date;
    const monthPrefix = `${cal.year}-${padTwo(cal.month)}`;
    const occ = new Set(anchor ? recurrenceDates(rec, anchor, isoOf(new Date(cal.year, cal.month, 0))) : []);
    const dim = new Date(cal.year, cal.month, 0).getDate();
    const lead = new Date(cal.year, cal.month - 1, 1).getDay();
    const cells = [...Array(lead).fill(null), ...Array.from({ length: dim }, (_, i) => i + 1)];
    const missing = Array.from(occ).filter((iso) => iso.startsWith(monthPrefix) && !byDate[iso]);
    const narrow = typeof window !== "undefined" && window.innerWidth < 760;
    const go = (patch) => setSeriesCal((c) => ({ ...c, ...patch, selected: null }));
    const shift = (delta) => {
      let m = cal.month + delta, y = cal.year;
      while (m > 12) { m -= 12; y += 1; }
      while (m < 1) { m += 12; y -= 1; }
      go({ year: y, month: m });
    };
    const baseYear = parseInt((src.date || "").slice(0, 4), 10) || new Date().getFullYear();
    const years = Array.from({ length: 25 }, (_, i) => baseYear - 2 + i);
    if (!years.includes(cal.year)) years.push(cal.year);
    years.sort((a, b) => a - b);
    const sel = { padding: "7px 8px", borderRadius: 8, border: "1px solid rgba(255,255,255,0.28)", background: "rgba(255,255,255,0.12)", color: "#FFFFFF", fontSize: 13.5, fontFamily: "system-ui, sans-serif", colorScheme: "dark" };
    const navBtn = { width: 34, height: 34, borderRadius: 8, border: "none", background: "rgba(255,255,255,0.16)", color: "#FFFFFF", fontSize: 18, cursor: "pointer", flexShrink: 0 };
    const opt = { background: "#1F3864" };
    const selEvent = cal.selected ? byDate[cal.selected] : null;
    const selIsOcc = cal.selected ? occ.has(cal.selected) : false;

    const renderInfo = () => {
      if (!cal.selected) return <div style={{ opacity: 0.8, fontSize: 13.5 }}>Pick a date on the calendar to see its details.</div>;
      const heading = <div style={{ fontFamily: "Georgia, serif", fontWeight: 700, fontSize: 17, color: "#FFFFFF", marginBottom: 6 }}>{eventDateLabel(cal.selected)}</div>;
      if (!selEvent) {
        return (
          <div>
            {heading}
            {selIsOcc ? (
              <div>
                <div style={{ fontSize: 13.5, opacity: 0.9, marginBottom: 10 }}>This date follows the repeat, but no event has been created for it yet.</div>
                {canEdit && <button onClick={() => createOccurrences(src, [cal.selected])} style={{ ...styles.smallBtn, background: "var(--bA9782F)", padding: "9px 14px" }}>+ Create event for this date</button>}
              </div>
            ) : (
              <div style={{ fontSize: 13.5, opacity: 0.85 }}>The repeat does not land on this date.</div>
            )}
          </div>
        );
      }
      const prog = eventProgress(selEvent);
      const computed = computeEventRows(selEvent);
      const phaseBlocks = EVENT_PHASES.map((p) => ({ phase: p, groups: eventGroups(selEvent, p.id) })).filter((x) => x.groups.length > 0);
      const timeLine = [clockLabel(selEvent.startTime) && `Start ${clockLabel(selEvent.startTime)}`, clockLabel(eventEndTime(selEvent)) && `End ${clockLabel(eventEndTime(selEvent))}`].filter(Boolean).join(" · ");
      return (
        <div>
          {heading}
          <div style={{ fontWeight: 700, fontSize: 14, color: "#FFFFFF" }}>{selEvent.title || "Untitled event"}</div>
          {norm(selEvent.subtitle) && <div style={{ fontSize: 12.5, opacity: 0.85 }}>{selEvent.subtitle}</div>}
          <div style={{ fontSize: 12.5, opacity: 0.85, marginTop: 3 }}>{[timeLine, `${prog.programs} program${prog.programs === 1 ? "" : "s"}`, prog.total ? `${prog.filled} of ${prog.total} roles filled` : "no ministry roles yet"].filter(Boolean).join(" · ")}</div>
          <button onClick={() => { setSeriesCal(null); setOpenId(selEvent.id); setMode("detail"); }}
            style={{ ...styles.smallBtn, background: "var(--bA9782F)", padding: "8px 14px", margin: "10px 0" }}>Open this event</button>
          {phaseBlocks.map(({ phase, groups }) => (
            <div key={phase.id}>
              <div style={{ fontSize: 10.5, fontWeight: 700, letterSpacing: 0.7, textTransform: "uppercase", color: "rgba(255,255,255,0.6)", margin: "8px 0 4px" }}>{phase.label}</div>
              {groups.map((group) => {
                const first = group[0];
                const time = (computed.find((c) => c.row.id === first.id) || {}).time;
                const lines = group.map((r) => {
                  const info = linkedLabel(r.linkedRole);
                  return { id: r.id, label: norm(r.task) || (info && info.role) || "", value: r.linkedRole ? eventVolunteer(selEvent, r.linkedRole) : r.fixedText };
                }).filter((l) => norm(l.label) || norm(l.value));
                return (
                  <div key={first.id} style={{ background: "rgba(255,255,255,0.1)", border: "1px solid rgba(255,255,255,0.12)", borderRadius: 10, padding: "8px 11px", marginBottom: 6 }}>
                    <div style={{ fontWeight: 700, fontSize: 13, color: "#FFFFFF" }}>{norm(first.program) || norm(first.task) || "Untitled program"}</div>
                    <div style={{ fontSize: 11.5, opacity: 0.8 }}>{[time, rowMinutes(first) ? `${rowMinutes(first)} mins` : ""].filter(Boolean).join(" · ") || "—"}</div>
                    {lines.length > 0 && (
                      <div style={{ marginTop: 4, fontSize: 12.5 }}>
                        {lines.map((l) => (
                          <div key={l.id}><span style={{ opacity: 0.7 }}>{l.label}{l.label ? ": " : ""}</span>{norm(l.value) ? <b style={{ fontWeight: 600 }}>{l.value}</b> : <span style={{ opacity: 0.5 }}>— open —</span>}</div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      );
    };

    return ReactDOM.createPortal(
      <div className="no-print pane-dark" style={{ ...styles.modalOverlay, zIndex: 2000001 }} onMouseDown={(e) => { if (e.target === e.currentTarget) setSeriesCal(null); }}>
        <div style={{ width: "min(860px, 100%)", maxHeight: "92vh", overflowY: "auto", borderRadius: 18, border: "1px solid rgba(255,255,255,0.18)", boxShadow: "0 30px 60px -15px rgba(0,0,0,0.6)", fontFamily: "system-ui, sans-serif", color: "#EAF0FF", background: "linear-gradient(180deg, #2F4E86 0%, #1F3864 100%)", padding: "16px 18px 18px", boxSizing: "border-box" }}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 10, marginBottom: 12 }}>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 11.5, fontWeight: 700, letterSpacing: 0.6, textTransform: "uppercase", color: "rgba(255,255,255,0.8)" }}>Repeat calendar · {src.title || "Untitled event"}</div>
              <div style={{ fontSize: 14, fontWeight: 700, color: "#FFFFFF", marginTop: 3 }}>{recurrenceSummary(rec)}</div>
            </div>
            <button onClick={() => setSeriesCal(null)} aria-label="Close" style={{ width: 32, height: 32, borderRadius: "50%", border: "none", background: "rgba(0,0,0,0.35)", color: "#FFFFFF", fontSize: 17, cursor: "pointer", flexShrink: 0 }}>×</button>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: narrow ? "1fr" : "minmax(0, 1fr) minmax(0, 1fr)", gap: 18, alignItems: "start" }}>
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 10 }}>
                <button onClick={() => shift(-1)} style={navBtn} aria-label="Previous month">‹</button>
                <select value={cal.month} onChange={(e) => go({ month: Number(e.target.value) })} aria-label="Month" style={{ ...sel, flex: 1, minWidth: 0 }}>
                  {MONTH_NAMES.map((n, i) => <option key={n} value={i + 1} style={opt}>{n}</option>)}
                </select>
                <select value={cal.year} onChange={(e) => go({ year: Number(e.target.value) })} aria-label="Year" style={{ ...sel, width: 84 }}>
                  {years.map((y) => <option key={y} value={y} style={opt}>{y}</option>)}
                </select>
                <button onClick={() => shift(1)} style={navBtn} aria-label="Next month">›</button>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
                {["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((d) => (
                  <div key={d} style={{ textAlign: "center", fontSize: 10.5, fontWeight: 700, opacity: 0.7, padding: "2px 0" }}>{d}</div>
                ))}
                {cells.map((day, i) => {
                  if (!day) return <div key={`b${i}`} />;
                  const iso = `${monthPrefix}-${padTwo(day)}`;
                  const hasEvent = !!byDate[iso];
                  const isOcc = occ.has(iso);
                  const active = cal.selected === iso;
                  return (
                    <button key={iso} onClick={() => setSeriesCal((c) => ({ ...c, selected: iso }))}
                      style={{
                        height: 40, borderRadius: 8, cursor: "pointer", fontSize: 13.5, fontWeight: hasEvent || isOcc ? 700 : 400, fontFamily: "system-ui, sans-serif", padding: 0,
                        color: hasEvent ? "#2A1A38" : "#FFFFFF",
                        background: hasEvent ? "#E5A430" : isOcc ? "rgba(229,164,48,0.12)" : "rgba(255,255,255,0.06)",
                        border: active ? "2px solid #FFFFFF" : isOcc && !hasEvent ? "1.5px dashed #E5A430" : "1px solid rgba(255,255,255,0.12)",
                      }}>{day}</button>
                  );
                })}
              </div>
              <div style={{ display: "flex", gap: 14, flexWrap: "wrap", fontSize: 11.5, opacity: 0.85, marginTop: 10 }}>
                <span><span style={{ display: "inline-block", width: 10, height: 10, borderRadius: 3, background: "#E5A430", marginRight: 5 }} />Event created</span>
                <span><span style={{ display: "inline-block", width: 10, height: 10, borderRadius: 3, border: "1.5px dashed #E5A430", marginRight: 5, boxSizing: "border-box" }} />Repeat date, not created</span>
              </div>
              {canEdit && missing.length > 0 && (
                <button onClick={() => createOccurrences(src, missing)} style={{ ...styles.smallBtn, background: "rgba(255,255,255,0.16)", padding: "8px 12px", marginTop: 10 }}>
                  + Create all {missing.length} event{missing.length === 1 ? "" : "s"} in {MONTH_NAMES[cal.month - 1]}
                </button>
              )}
            </div>
            <div style={{ background: "rgba(255,255,255,0.07)", border: "1px solid rgba(255,255,255,0.12)", borderRadius: 12, padding: "12px 14px", minWidth: 0 }}>
              {renderInfo()}
            </div>
          </div>
        </div>
      </div>,
      document.body
    );
  };
  const updateUpcoming = (src) => {
    const later = laterInSeries(src);
    if (later.length === 0) { window.alert("There are no later events in this series."); return; }
    if (!window.confirm(`Copy this program flow, ministries and start time to ${later.length} upcoming event${later.length === 1 ? "" : "s"}? Names and verses already entered are kept.`)) return;
    const ids = new Set(later.map((x) => x.id));
    updateConfig((prev) => ({
      ...prev,
      events: (prev.events || []).map((e) => (ids.has(e.id)
        ? { ...e, title: src.title, subtitle: src.subtitle, startTime: src.startTime, cover: src.cover, showHeadCount: src.showHeadCount, rows: cloneJson(src.rows || []), ministries: cloneJson(src.ministries || []) }
        : e)),
    }));
  };
  const deleteEvent = (event) => {
    if (!window.confirm(`Delete "${event.title || "Untitled event"}"?`)) return;
    updateConfig((prev) => ({ ...prev, events: (prev.events || []).filter((e) => e.id !== event.id) }));
    setOpenId(null);
    setMode("list");
  };

  const labelStyle = { fontSize: 12, fontWeight: 700, color: "var(--t6B6B6B)", marginBottom: 3 };
  const fieldWrap = { display: "flex", flexDirection: "column", flex: "1 1 180px", minWidth: 0 };

  if (mode === "print" && openEvent) {
    const computed = computeEventRows(openEvent);
    // blank Time/Program cells get merged into the row above, same as the Master List
    const spanList = (starts) => starts.map((isStart, i) => {
      if (!isStart) return 0;
      let span = 1;
      while (i + span < starts.length && !starts[i + span]) span++;
      return span;
    });
    const bandText = (word) => `${word} OF ${(openEvent.title || "EVENT").toUpperCase()}`;
    const roleNameFor = (key) => {
      const [teamId, roleId] = splitRoleKey(key);
      const team = (config.teams || []).find((t) => t.id === teamId);
      const role = team && (team.roles || []).find((r) => r.id === roleId);
      return role ? role.name : "";
    };
    // verse typed by the ministry, only for roles with "Add a verse box" turned on in Manage Teams
    const verseFor = (key) => {
      const [teamId, roleId] = splitRoleKey(key);
      const team = (config.teams || []).find((t) => t.id === teamId);
      const role = team && (team.roles || []).find((r) => r.id === roleId);
      return role && role.hasVerse ? ((openEvent.verses || {})[key] || "") : "";
    };
    // one merged notes cell down the whole table, goes in the first body row
    let notesPlaced = false;
    const takeNotesCell = () => {
      if (notesPlaced) return null;
      notesPlaced = true;
      return <td key="notes" rowSpan={computed.length + 2} style={styles.sheetTd}></td>;
    };
    const renderPhaseRows = (phaseId) => {
      const group = computed.filter((c) => c.phase === phaseId);
      const timeSpans = spanList(group.map((c, i) => i === 0 || !!c.time));
      const programSpans = spanList(group.map((c, i) => i === 0 || !!norm(c.row.program)));
      // rows with "merge volunteer with row above" share the cell of the row above (left, vertically centered)
      // (only when the name is the same as the row above; different names stay separate)
      const volValues = group.map((c) => normKey(c.row.fixedText || eventVolunteer(openEvent, c.row.linkedRole)));
      const volSpans = spanList(group.map((c, i) => i === 0 || !(c.row.mergeVolAbove && volValues[i] && volValues[i] === volValues[i - 1])));
      return group.map(({ row, time, durationText }, i) => (
        <tr key={row.id}>
          {timeSpans[i] > 0 && (
            <td rowSpan={timeSpans[i]} style={styles.sheetTd}>
              <div style={{ whiteSpace: "nowrap", fontVariantNumeric: "tabular-nums", fontSize: 10 }}>{time}</div>
              {norm(durationText) && <div style={{ marginTop: 2, color: "var(--t1F3864)", fontWeight: 700 }}>{durationText}</div>}
            </td>
          )}
          {programSpans[i] > 0 && (
            <td rowSpan={programSpans[i]} style={{ ...styles.sheetTd, fontWeight: 700, verticalAlign: "middle", whiteSpace: "pre-wrap" }}>
              {row.program}
              {(() => {
                const subLines = (row.programSubRoles || []).map((k) => eventVolunteer(openEvent, k)).filter((v) => norm(v));
                if (subLines.length === 0 && !norm(row.programNote)) return null;
                return (
                  <div style={{ fontWeight: 400, fontSize: 10.5, marginTop: 4 }}>
                    {subLines.map((v, idx) => <div key={idx}>{v}</div>)}
                    {norm(row.programNote) && <div>{row.programNote}</div>}
                  </div>
                );
              })()}
            </td>
          )}
          <td style={styles.sheetTd}>
            {row.task}
            {norm(verseFor(row.linkedRole)) && (
              <div style={{ fontWeight: 400, fontStyle: "italic", fontSize: 10.5, marginTop: row.task ? 3 : 0, color: "var(--t3B5A8A)" }}>{verseFor(row.linkedRole)}</div>
            )}
          </td>
          {volSpans[i] > 0 && (
            <td rowSpan={volSpans[i]} style={volSpans[i] > 1 ? { ...styles.sheetTd, verticalAlign: "middle", textAlign: "left" } : styles.sheetTd}>
              {row.fixedText || eventVolunteer(openEvent, row.linkedRole)}
            </td>
          )}
          <td style={{ ...styles.sheetTd, textAlign: "center" }}>
            <span style={{ display: "inline-block", width: 12, height: 12, border: "1px solid var(--l23211D)", borderRadius: 3 }} />
          </td>
          {takeNotesCell()}
        </tr>
      ));
    };
    return (
      <div className="print-sheet-wrap" style={styles.viewWrap}>
        <div className="no-print sheet-toolbar">
          <button onClick={() => setMode("detail")} style={{ ...styles.smallBtn, whiteSpace: "normal" }}>← Back</button>
          <button onClick={() => window.print()} style={{ ...styles.smallBtn, background: "var(--bA9782F)", whiteSpace: "normal" }}>🖨 Print</button>
          <button onClick={() => saveEventImage([openEvent.title, openEvent.date && eventDateLabel(openEvent.date)].filter(Boolean).join(" - "))} disabled={exportingImage}
            style={{ ...styles.smallBtn, background: "var(--b2F4858)", opacity: exportingImage ? 0.6 : 1, whiteSpace: "normal" }}>
            {exportingImage ? "Working…" : "🖼 Save as Image"}
          </button>
        </div>
        <div className="sheet-scroll">
          <div className="print-sheet paper" style={styles.sheet} ref={eventSheetRef}>
            <div className="print-sheet-watermark" style={styles.sheetWatermark} aria-hidden="true">
              <img src="./icons/VictoryWatermark.png" alt="" style={styles.sheetWatermarkImg} />
            </div>
            <div style={styles.sheetInner}>
              <div style={styles.sheetBannerMain}>{(printSettings.campus || "VICTORY ALFONSO").toUpperCase()}</div>
              <div style={styles.sheetBannerBold}>{(openEvent.title || "EVENT").toUpperCase()}</div>
              {openEvent.subtitle && <div style={styles.sheetBannerLight}>{openEvent.subtitle}</div>}
              {[clockLabel(openEvent.startTime) && `START TIME: ${clockLabel(openEvent.startTime)}`, clockLabel(eventEndTime(openEvent)) && `END TIME: ${clockLabel(eventEndTime(openEvent))}`].filter(Boolean).length > 0 && (
                <div style={styles.sheetBannerSub}>
                  {[clockLabel(openEvent.startTime) && `START TIME: ${clockLabel(openEvent.startTime)}`, clockLabel(eventEndTime(openEvent)) && `END TIME: ${clockLabel(eventEndTime(openEvent))}`].filter(Boolean).join(" | ")}
                </div>
              )}
              {openEvent.date && <div style={styles.sheetBannerSub}>{eventDateLabel(openEvent.date)}</div>}
              <table style={{ ...styles.sheetTable, tableLayout: "fixed" }}>
                <colgroup>
                  <col style={{ width: "13%" }} />
                  <col style={{ width: "17%" }} />
                  <col style={{ width: "25%" }} />
                  <col style={{ width: "20%" }} />
                  <col style={{ width: "4%" }} />
                  <col style={{ width: "21%" }} />
                </colgroup>
                <thead>
                  <tr>
                    <th style={styles.sheetTh}>Time</th>
                    <th style={styles.sheetTh}>Program</th>
                    <th style={styles.sheetTh}>Task</th>
                    <th style={styles.sheetTh}>Volunteer(s)</th>
                    <th style={styles.sheetTh}></th>
                    <th style={styles.sheetTh}>{PRINT_EXTRA_COL_LABEL}</th>
                  </tr>
                </thead>
                <tbody>
                  {renderPhaseRows("before")}
                  <tr data-divider="1"><td colSpan={5} style={styles.sheetBand}>{bandText("START")}</td>{takeNotesCell()}</tr>
                  {renderPhaseRows("during")}
                  <tr data-divider="1"><td colSpan={5} style={styles.sheetBand}>{bandText("END")}</td>{takeNotesCell()}</tr>
                  {renderPhaseRows("after")}
                </tbody>
              </table>
              {(() => {
                const ministries = openEvent.ministries || [];
                const renderMinistry = (block) => (
                  <div key={block.id} style={{ marginBottom: 14 }}>
                    <div style={styles.sheetSectionHead}>{(block.title || "").toUpperCase()}</div>
                    <table style={{ ...styles.sheetTable, tableLayout: "fixed", width: "100%" }}>
                      <colgroup>
                        <col style={{ width: SHEET_BOX_LABEL_WIDTH }} />
                        <col />
                      </colgroup>
                      <tbody>
                        {(block.roles || []).map((r) => (
                          <tr key={r.id}>
                            <td style={styles.sheetTd}>{r.label}</td>
                            <td style={styles.sheetTd}>{eventVolunteer(openEvent, blockRoleKey(block, r))}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                );
                const headCount = openEvent.showHeadCount && (
                  <div style={{ marginBottom: 14 }}>
                    <div style={styles.sheetSectionHead}>HEAD COUNT</div>
                    <table style={{ ...styles.sheetTable, tableLayout: "fixed", width: "100%" }}>
                      <colgroup>
                        <col style={{ width: SHEET_BOX_LABEL_WIDTH }} />
                        <col />
                      </colgroup>
                      <tbody>
                        {["Volunteer", "Adult", "Kids", "Total"].map((label) => (
                          <tr key={label}>
                            <td style={{ ...styles.sheetTd, fontWeight: label === "Total" ? 700 : 400 }}>{label}</td>
                            <td style={styles.sheetTd}></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                );
                const announcements = norm(openEvent.announcements) && (
                  <div style={{ marginBottom: 14 }}>
                    <div style={styles.sheetSectionHead}>ANNOUNCEMENTS</div>
                    <table style={{ ...styles.sheetTable, tableLayout: "fixed", width: "100%" }}><tbody><tr><td style={{ ...styles.sheetTd, whiteSpace: "pre-wrap" }}>{openEvent.announcements}</td></tr></tbody></table>
                  </div>
                );
                if (ministries.length === 0 && !headCount && !announcements) return null;
                return (
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 14, alignItems: "start" }}>
                    <div>{ministries.filter((_, i) => i % 2 === 0).map(renderMinistry)}</div>
                    <div>{ministries.filter((_, i) => i % 2 === 1).map(renderMinistry)}{announcements}{headCount}</div>
                  </div>
                );
              })()}
            </div>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={styles.viewWrap}>
      <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 18, flexWrap: "wrap" }}>
        <input type="text" value={eventSearch} onChange={(e) => setEventSearch(e.target.value)} placeholder="Search event name…"
          style={{ ...styles.toolbarInput, flex: "1 1 220px", padding: "10px 14px", borderRadius: 10 }} />
        {canEdit && <button onClick={createEvent} style={{ ...styles.smallBtn, padding: "10px 16px", borderRadius: 10, fontWeight: 700 }}>+ New event</button>}
      </div>
      {(() => {
        const q = normKey(eventSearch);
        const shown = q ? events.filter((e) => normKey(e.title).includes(q) || normKey(eventDateLabel(e.date)).includes(q)) : events;
        if (events.length === 0) {
          return <div style={{ color: "var(--t6B6B6B)", fontSize: 14 }}>No events yet.{canEdit ? " Tap “New event” to add one." : ""}</div>;
        }
        if (shown.length === 0) {
          return <div style={{ color: "var(--t6B6B6B)", fontSize: 14 }}>No events match “{eventSearch}”.</div>;
        }
        return (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))", gap: 16 }}>
            {shown.map((event) => {
              const prog = eventProgress(event);
              const pct = prog.total ? Math.round((prog.filled / prog.total) * 100) : 0;
              const when = [eventDateLabel(event.date) || "No date yet", clockLabel(event.startTime)].filter(Boolean).join(" · ");
              return (
                <div key={event.id} role="button" tabIndex={0}
                  onClick={() => { setOpenId(event.id); setMode("detail"); }}
                  onKeyDown={(e) => { if (e.key === "Enter") { setOpenId(event.id); setMode("detail"); } }}
                  style={{
                    position: "relative", height: 290, borderRadius: 16, overflow: "hidden", cursor: "pointer", color: "#FFFFFF", fontFamily: "system-ui, sans-serif",
                    background: "linear-gradient(160deg, #2B4A86 0%, #16294B 100%)",
                    ...(event.cover ? { backgroundImage: `url("${event.cover}")`, backgroundSize: "cover", backgroundPosition: "center" } : {}),
                    boxShadow: "0 12px 26px -12px rgba(35,33,29,0.55)",
                  }}>
                  <div style={{ position: "absolute", inset: 0, background: "linear-gradient(180deg, rgba(0,0,0,0.05) 30%, rgba(0,0,0,0.82) 100%)" }} />
                  <div style={{ position: "absolute", top: 12, left: 12, right: 12, background: "rgba(0,0,0,0.55)", borderRadius: 14, padding: "6px 10px", fontSize: 11.5, fontWeight: 700, lineHeight: 1.35 }}>
                    {when}
                    <div style={{ fontWeight: 400, fontSize: 10.5, opacity: 0.85 }}>{prog.programs} program{prog.programs === 1 ? "" : "s"}</div>
                  </div>
                  <div style={{ position: "absolute", left: 14, right: 14, bottom: 14 }}>
                    <div style={{ fontFamily: "Georgia, serif", fontWeight: 700, fontSize: 20, lineHeight: 1.2, marginBottom: 8, textShadow: "0 1px 6px rgba(0,0,0,0.5)" }}>
                      {event.title || "Untitled event"}
                    </div>
                    <div style={{ height: 4, borderRadius: 4, background: "rgba(255,255,255,0.3)", overflow: "hidden", marginBottom: 6 }}>
                      <div style={{ width: `${pct}%`, height: "100%", background: "#E5A430" }} />
                    </div>
                    <div style={{ fontSize: 11.5, opacity: 0.92 }}>{prog.total ? `${prog.filled} of ${prog.total} roles filled` : "No ministry roles yet"}</div>
                  </div>
                </div>
              );
            })}
          </div>
        );
      })()}
      {mode === "detail" && openEvent && renderEventDetail()}
      {programModal && renderProgramModal()}
      {repeatConfirm && mode === "detail" && openEvent && renderRepeatConfirm()}
      {seriesCal && renderSeriesCalendar()}
    </div>
  );
}

// Ministry-side view of the Events: pick an event, fill in this ministry's roles for it.
// Names are saved on the event (event.assignments), so the event sheet picks them up.
function TeamEventsAssign({ config, updateConfig, team, locked, isMobile, onBack, onNameChange }) {
  // sel = the open popup: { key (series id or event id), date, year, month }
  const [sel, setSel] = useState(null);
  const events = (config.events || []).slice().sort((a, b) => (a.date || "9999").localeCompare(b.date || "9999"));

  // One card per event; events made from one repeat share a card (pick the date inside).
  const todayISO = isoOf(new Date());
  const groups = [];
  const groupMap = {};
  events.forEach((e) => {
    const k = e.seriesId || e.id;
    if (!groupMap[k]) { groupMap[k] = { key: k, mates: [] }; groups.push(groupMap[k]); }
    groupMap[k].mates.push(e);
  });
  groups.forEach((g) => {
    g.rep = g.mates.find((m) => m.date && m.date >= todayISO) || g.mates[g.mates.length - 1];
    g.rec = resolveRecurrence(g.mates[0]);
    g.isSeries = g.rec.repeats || g.mates.length > 1;
  });
  groups.sort((a, b) => (a.rep.date || "9999").localeCompare(b.rep.date || "9999"));
  const group = sel ? groups.find((g) => g.key === sel.key) : null;
  const tmpl = group ? group.mates[0] : null;
  const byDate = {};
  if (group) group.mates.forEach((m) => { if (m.date) byDate[m.date] = m; });
  // for a repeating event the chosen date may not have an event yet: show a blank copy that is created on the first name typed
  const event = !group ? null
    : !group.isSeries ? tmpl
    : (byDate[sel.date] || { ...tmpl, id: null, date: sel.date, assignments: {}, verses: {}, announcements: "" });

  // roles this ministry fills in an event: the ones picked for its bottom block,
  // plus any task row linked to one of its roles
  const rolesForEvent = (e) => {
    const list = [];
    const seen = new Set();
    const add = (key, label) => {
      if (seen.has(key)) return;
      seen.add(key);
      list.push({ key, label });
    };
    const block = (e.ministries || []).find((b) => b.teamId === team.id);
    if (block) (block.roles || []).forEach((r) => add(blockRoleKey(block, r), r.label));
    (e.rows || []).forEach((row) => {
      const [linkedTeamId, linkedRoleId] = splitRoleKey(row.linkedRole);
      if (linkedTeamId !== team.id) return;
      const teamRole = (team.roles || []).find((r) => r.id === linkedRoleId);
      if (teamRole) add(row.linkedRole, teamRole.name);
    });
    // roles shown as extra lines under a program (e.g. 1st/2nd/3rd Song) are filled in by their ministry too
    (e.rows || []).forEach((row) => (row.programSubRoles || []).forEach((key) => {
      const [subTeamId, subRoleId] = splitRoleKey(key);
      if (subTeamId !== team.id) return;
      const subRole = (team.roles || []).find((r) => r.id === subRoleId);
      if (subRole) add(key, subRole.name);
    }));
    return list;
  };

  // Writes one name/verse. If the picked date has no event yet, the event is created from the series' first event right here.
  const writeField = (field, key, value) => {
    const date = event.date;
    const eventIdNow = event.id;
    const tmplId = tmpl.id;
    updateConfig((prev) => {
      let list = prev.events || [];
      let targetId = eventIdNow;
      if (!targetId) {
        const t = list.find((e) => e.id === tmplId);
        if (!t) return prev;
        const sid = t.seriesId || uid();
        const existing = list.find((e) => e.seriesId === sid && e.date === date);
        if (existing) targetId = existing.id;
        else {
          const copy = {
            ...JSON.parse(JSON.stringify(t)), id: uid(), date, assignments: {}, verses: {}, announcements: "",
            seriesId: sid, repeat: null, recurrence: storedRecurrence(resolveRecurrence(t)),
          };
          targetId = copy.id;
          list = [...list.map((e) => (e.id === t.id ? { ...e, seriesId: sid } : e)), copy];
        }
      }
      return {
        ...prev,
        events: list.map((e) => {
          if (e.id !== targetId) return e;
          const next = { ...(e[field] || {}) };
          if (norm(value)) next[key] = value;
          else delete next[key];
          return { ...e, [field]: next };
        }),
      };
    });
  };
  const setRoleValue = (key, value) => {
    writeField("assignments", key, value);
    if (onNameChange && event && event.date) onNameChange(event.date, key, value);
  };
  const setVerseValue = (key, value) => writeField("verses", key, value);

  const roles = event ? rolesForEvent(event) : [];

  // Same double-booking check as Assign volunteers, but for one event: the same name used in another
  // role of this event is a "duplicate" (same ministry) or a "Schedule Conflict" (different ministry,
  // unless the pair/combination is allowed in Manage Teams).
  const findEventIssues = (ev, selfKey, name) => {
    const target = normKey(name);
    if (!target || !ev) return [];
    const issues = [];
    const [selfTeamId, selfRoleId] = splitRoleKey(selfKey);
    const selfTag = roleTag(selfTeamId, selfRoleId);
    Object.entries(ev.assignments || {}).forEach(([key, val]) => {
      if (key === selfKey || normKey(val) !== target) return;
      const [tId, rId] = splitRoleKey(key);
      const otherTeam = (config.teams || []).find((t) => t.id === tId);
      if (!otherTeam) return;
      let roleName = ((otherTeam.roles || []).find((r) => r.id === rId) || {}).name;
      if (!roleName) {
        const block = (ev.ministries || []).find((b) => b.teamId === tId);
        const custom = block && (block.roles || []).find((r) => `c:${r.id}` === rId);
        roleName = custom ? custom.label : "";
      }
      if (!roleName) return;
      const otherTag = roleTag(tId, rId);
      if ((config.compatibleGroups || []).some((g) => g.includes(selfTag) && g.includes(otherTag))) return;
      if (tId === selfTeamId) issues.push({ type: "duplicate", team: otherTeam, role: { name: roleName } });
      else if (!isCompatible(selfTeamId, tId, config.teams, config.compatiblePairs || [])) issues.push({ type: "Schedule Conflict", team: otherTeam, role: { name: roleName } });
    });
    return issues;
  };
  const filledOf = (e) => {
    const list = rolesForEvent(e);
    return { total: list.length, filled: list.filter((r) => norm(eventVolunteer(e, r.key))).length };
  };

  useEffect(() => {
    if (!sel) return;
    const onKey = (e) => { if (e.key === "Escape") setSel(null); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [!!sel]);

  const openGroup = (g) => {
    const d = g.rep.date || "";
    const [y, m] = d.split("-").map((n) => parseInt(n, 10));
    const now = new Date();
    setSel({ key: g.key, date: d, year: isNaN(y) ? now.getFullYear() : y, month: isNaN(m) ? now.getMonth() + 1 : m });
  };

  // month/year switcher + the dates of the repeat (like the date buttons on Assign volunteers).
  // Only years/months that actually have a date of this repeat can be picked.
  const renderDatePicker = () => {
    const prefix = `${sel.year}-${padTwo(sel.month)}`;
    const startYear = parseInt((tmpl.date || "").slice(0, 4), 10) || new Date().getFullYear();
    const occ = new Set();
    if (group.rec.repeats && tmpl.date) recurrenceDates(group.rec, tmpl.date, `${Math.max(startYear + 10, sel.year)}-12-31`).forEach((d) => occ.add(d));
    group.mates.forEach((m) => { if (m.date) occ.add(m.date); });
    const all = Array.from(occ).sort();
    const years = Array.from(new Set(all.map((d) => parseInt(d.slice(0, 4), 10))));
    if (!years.includes(sel.year)) { years.push(sel.year); years.sort((a, b) => a - b); }
    const monthsOf = (y) => Array.from(new Set(all.filter((d) => d.startsWith(`${y}-`)).map((d) => parseInt(d.slice(5, 7), 10)))).sort((a, b) => a - b);
    const months = monthsOf(sel.year);
    if (!months.includes(sel.month)) { months.push(sel.month); months.sort((a, b) => a - b); }
    const monthDates = all.filter((d) => d.startsWith(prefix));
    // Yearly repeat = one date per year, so only the year can be picked (no month or date buttons)
    if (group.rec.repeats && group.rec.freq === "yearly") {
      const mateDates = group.mates.map((m) => m.date).filter(Boolean);
      const yearDate = (y) => mateDates.find((d) => d.startsWith(`${y}-`)) || repeatDateIn(group.rec, y, 1, tmpl.date);
      const pickYear = (y) => {
        const first = yearDate(y);
        if (first) setSel((s) => ({ ...s, year: y, month: parseInt(first.slice(5, 7), 10), date: first }));
      };
      const prevY = yearDate(sel.year - 1) ? sel.year - 1 : null;
      const nextY = yearDate(sel.year + 1) ? sel.year + 1 : null;
      const yNav = (disabled) => ({ background: "transparent", border: "none", color: "#1F3864", fontSize: 20, cursor: disabled ? "default" : "pointer", padding: "0 14px", lineHeight: 1, opacity: disabled ? 0.3 : 1 });
      return (
        <div>
          <div style={{ fontSize: 10.5, fontWeight: 700, letterSpacing: 0.7, textTransform: "uppercase", color: "rgba(255,255,255,0.7)", margin: "18px 0 8px" }}>Choose a year</div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: "#F6F1E4", border: "1px solid #E4DCC6", borderRadius: 12, padding: "6px 4px", maxWidth: 260 }}>
            <button onClick={() => prevY && pickYear(prevY)} disabled={!prevY} style={yNav(!prevY)} aria-label="Previous year">‹</button>
            <div style={{ flex: 1, textAlign: "center", fontFamily: "system-ui, sans-serif", fontWeight: 700, fontSize: 16, color: "#1F3864" }}>{sel.year}</div>
            <button onClick={() => nextY && pickYear(nextY)} disabled={!nextY} style={yNav(!nextY)} aria-label="Next year">›</button>
          </div>
          <div style={{ fontSize: 11, opacity: 0.7, marginTop: 8, lineHeight: 1.4 }}>{byDate[sel.date] ? "" : `No volunteers assigned for ${sel.year} yet. Add a name to start this event.`}</div>
        </div>
      );
    }
    // jump to a month and pick its first date, so the roles on the right always match the buttons
    const jump = (y, m) => {
      const first = all.find((d) => d.startsWith(`${y}-${padTwo(m)}`));
      setSel((s) => ({ ...s, year: y, month: m, date: first || s.date }));
    };
    const keyOf = (y, m) => y * 12 + m;
    const here = keyOf(sel.year, sel.month);
    const monthKeys = Array.from(new Set(all.map((d) => keyOf(parseInt(d.slice(0, 4), 10), parseInt(d.slice(5, 7), 10))))).sort((a, b) => a - b);
    const prevKey = [...monthKeys].reverse().find((k) => k < here);
    const nextKey = monthKeys.find((k) => k > here);
    const jumpKey = (k) => jump(Math.floor((k - 1) / 12), ((k - 1) % 12) + 1);
    const selS = { padding: "7px 6px", borderRadius: 8, border: "1px solid rgba(255,255,255,0.28)", background: "rgba(255,255,255,0.12)", color: "#FFFFFF", fontSize: 13, fontFamily: "system-ui, sans-serif", colorScheme: "dark", minWidth: 0 };
    const navB = (disabled) => ({ width: 32, height: 34, borderRadius: 8, border: "none", background: "rgba(255,255,255,0.16)", color: "#FFFFFF", fontSize: 18, cursor: disabled ? "default" : "pointer", flexShrink: 0, opacity: disabled ? 0.35 : 1 });
    const isMonthly = group.rec.repeats && group.rec.freq === "monthly";
    const mateDatesM = group.mates.map((m) => m.date).filter(Boolean);
    const monthDate = (y, m) => mateDatesM.find((d) => d.startsWith(`${y}-${padTwo(m)}`)) || repeatDateIn(group.rec, y, m, tmpl.date);
    const stepOf = (delta) => {
      let y = sel.year, m = sel.month + delta;
      while (m > 12) { m -= 12; y += 1; }
      while (m < 1) { m += 12; y -= 1; }
      return monthDate(y, m) ? { y, m } : null;
    };
    const goStep = (delta) => {
      if (isMonthly) { const st = stepOf(delta); if (st) setSel((s) => ({ ...s, year: st.y, month: st.m, date: monthDate(st.y, st.m) })); }
      else { const k = delta < 0 ? prevKey : nextKey; if (k) jumpKey(k); }
    };
    const canStep = (delta) => (isMonthly ? !!stepOf(delta) : !!(delta < 0 ? prevKey : nextKey));
    const yNavB = (disabled) => ({ background: "transparent", border: "none", color: "#1F3864", fontSize: 20, cursor: disabled ? "default" : "pointer", padding: "0 14px", lineHeight: 1, opacity: disabled ? 0.3 : 1 });
    const opt = { background: "#2A1A38" };
    return (
      <div>
        <div style={{ fontSize: 10.5, fontWeight: 700, letterSpacing: 0.7, textTransform: "uppercase", color: "rgba(255,255,255,0.7)", margin: "18px 0 8px" }}>{group.rec.repeats && group.rec.freq === "monthly" ? "Choose a month" : "Choose a date"}</div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: "#F6F1E4", border: "1px solid #E4DCC6", borderRadius: 12, padding: "6px 4px" }}>
          <button onClick={() => goStep(-1)} disabled={!canStep(-1)} style={yNavB(!canStep(-1))} aria-label="Previous month">‹</button>
          <div style={{ flex: 1, textAlign: "center", fontFamily: "system-ui, sans-serif", fontWeight: 700, fontSize: 15, color: "#1F3864" }}>{MONTH_NAMES[sel.month - 1]} {sel.year}</div>
          <button onClick={() => goStep(1)} disabled={!canStep(1)} style={yNavB(!canStep(1))} aria-label="Next month">›</button>
        </div>
        {!(group.rec.repeats && group.rec.freq === "monthly") && (
          <div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 10 }}>
          {monthDates.length === 0 && <div style={{ fontSize: 12.5, opacity: 0.8 }}>No dates in {MONTH_NAMES[sel.month - 1]} {sel.year}.</div>}
          {monthDates.map((iso) => {
            const [y, m, d] = iso.split("-").map((n) => parseInt(n, 10));
            const active = sel.date === iso;
            const made = !!byDate[iso];
            return (
              <button key={iso} onClick={() => setSel((s) => ({ ...s, date: iso }))} aria-label={eventDateLabel(iso)}
                style={{
                  width: 52, height: 48, borderRadius: 10, cursor: "pointer", padding: 0, fontFamily: "system-ui, sans-serif",
                  display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 1,
                  border: active ? "2px solid #FFFFFF" : made ? "1px solid rgba(229,164,48,0.8)" : "1.5px dashed rgba(229,164,48,0.8)",
                  background: active ? "#FFFFFF" : "rgba(255,255,255,0.08)",
                }}>
                <span style={{ fontSize: 8.5, fontWeight: 600, letterSpacing: "0.08em", color: active ? "#7A6E4E" : "rgba(255,255,255,0.7)" }}>{WEEKDAY_NAMES[new Date(y, m - 1, d).getDay()].slice(0, 3).toUpperCase()}</span>
                <span style={{ fontSize: 16, fontWeight: 700, color: active ? "#1F3864" : "#FFFFFF" }}>{d}</span>
              </button>
            );
          })}
        </div>
        <div style={{ fontSize: 11, opacity: 0.7, marginTop: 8, lineHeight: 1.4 }}>Dashed dates have no volunteers yet. Add a name to start that date’s event.</div>
          </div>
        )}
        {group.rec.repeats && group.rec.freq === "monthly" && !byDate[sel.date] && <div style={{ fontSize: 11, opacity: 0.7, marginTop: 8, lineHeight: 1.4 }}>No volunteers assigned for {MONTH_NAMES[sel.month - 1]} {sel.year} yet. Add a name to start this event.</div>}
      </div>
    );
  };

  const renderModal = () => {
    const narrow = isMobile || (typeof window !== "undefined" && window.innerWidth < 760);
    const prog = filledOf(event);
    const pct = prog.total ? prog.filled / prog.total : 0;
    const R = 46, C = 2 * Math.PI * R;
    const sectionLabel = { fontSize: 10.5, fontWeight: 700, letterSpacing: 0.7, textTransform: "uppercase", color: "rgba(255,255,255,0.7)", margin: "18px 0 8px" };
    const darkField = { ...styles.input, background: "rgba(255,255,255,0.12)", border: "1px solid rgba(255,255,255,0.28)", borderLeft: "3px solid rgba(229,164,48,0.75)", color: "#FFFFFF", colorScheme: "dark" };
    const timeLine = [clockLabel(event.startTime) && `Start ${clockLabel(event.startTime)}`, clockLabel(eventEndTime(event)) && `End ${clockLabel(eventEndTime(event))}`].filter(Boolean).join(" · ");
    return ReactDOM.createPortal(
      <div className="no-print pane-dark" style={{ ...styles.modalOverlay, zIndex: 1999990 }} onMouseDown={(e) => { if (e.target === e.currentTarget) setSel(null); }}>

function MobileControls({ monthState, week, setWeek, slot, setSlot, monthLabelText, year, month, onPrevMonth, onNextMonth, onlineUsers, userName, hideSlots, thursday }) {
  const others = (onlineUsers || []).filter((u) => norm(u.name).toLowerCase() !== norm(userName).toLowerCase());
  const [showPresence, setShowPresence] = useState(false);
  const [coords, setCoords] = useState(null);
  const presenceWrapRef = useRef(null);
  const pillRef = useRef(null);
  const popupRef = useRef(null);

  // The pill sits inside a row that scrolls horizontally
  // (mobileControlsRow has overflowX set), and setting only one axis of
  // overflow makes browsers force the other axis to "auto" too — which
  // clips anything absolutely positioned outside that row's own box. So
  // the names dropdown is rendered through a portal into document.body and
  // positioned with position:fixed against the pill's own bounding box,
  // the same trick used for the volunteer-name suggestion popup below.
  const updateCoords = useCallback(() => {
    const el = pillRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    setCoords({ top: rect.bottom + 6, right: window.innerWidth - rect.right });
  }, []);

  useEffect(() => {
    if (!showPresence) return;
    updateCoords();
    const handleOutside = (e) => {
      if (presenceWrapRef.current && presenceWrapRef.current.contains(e.target)) return;
      if (popupRef.current && popupRef.current.contains(e.target)) return;
      setShowPresence(false);
    };
    document.addEventListener("mousedown", handleOutside);
    window.addEventListener("scroll", updateCoords, true);
    window.addEventListener("resize", updateCoords);
    return () => {
      document.removeEventListener("mousedown", handleOutside);
      window.removeEventListener("scroll", updateCoords, true);
      window.removeEventListener("resize", updateCoords);
    };
  }, [showPresence, updateCoords]);

  return (
    <div className="no-print" style={styles.mobileControls}>
      <div style={styles.mobileControlsRow}>
        <div className="month-nav-keep" style={styles.mobileMonthNav}>
          <button onClick={onPrevMonth} style={styles.monthNavBtn} aria-label="Previous month">‹</button>
          <MonthPickerLabel style={styles.mobileMonthLabel} />
          <button onClick={onNextMonth} style={styles.monthNavBtn} aria-label="Next month">›</button>
        </div>
        <div ref={presenceWrapRef} style={{ position: "relative" }}>
          <button ref={pillRef} onClick={() => setShowPresence((v) => !v)} style={styles.mobilePresencePill}>
            🟢 {1 + others.length} online
          </button>
          {showPresence && coords && ReactDOM.createPortal(
            <div ref={popupRef} className="no-print"
              style={{ ...styles.mobilePresenceDropdown, position: "fixed", top: coords.top, right: coords.right }}>
              <div style={styles.mobilePresenceDropdownItem}><span style={styles.presenceDot} />{userName} (you)</div>
              {others.map((u) => (
                <div key={u.id} style={styles.mobilePresenceDropdownItem}><span style={styles.presenceDot} />{u.name}</div>
              ))}
            </div>,
            document.body
          )}
        </div>
      </div>
      <div style={styles.mobileControlsRow}>
        {WEEKS.map((w) => {
          const thu = thursday ? nthThursday(year, month, w) : null;
          const text = thursday ? (thu ? String(thu.getDate()) : null) : weekButtonText(w, monthState.weekLabels, year, month);
          if (!text && w !== week) return null;
          return (
            <button key={w} onClick={() => setWeek(w)}
              style={{ ...styles.mobileWeekBtn, ...(thursday && w === THURSDAY_ONSITE_WEEK ? { borderColor: ONSITE_COLOR, ...(w === week ? { background: ONSITE_COLOR, color: "#FFFFFF" } : { color: ONSITE_COLOR }) } : (w === week ? styles.weekBtnActive : {})) }}>
              {text || "–"}
            </button>
          );
        })}
        {!hideSlots && SLOTS.map((s) => (
          <button key={s} onClick={() => setSlot(s)}
            style={{ ...styles.mobileSlotBtn, ...(s === slot ? styles.slotBtnActive : {}) }}>
            {s}
          </button>
        ))}
      </div>
      <div style={styles.mobileWeekDate}>
        {thursday
          ? (nthThursday(year, month, week) ? `${thursdayLabel(nthThursday(year, month, week))} · ${prayerKind(week)}` : "No Thursday this week")
          : weekDisplayLabel(week, monthState.weekLabels, year, month)}
      </div>
    </div>
  );
}

function initials(name) {
  const parts = norm(name).split(/\s+/).filter(Boolean);
  if (parts.length === 0) return "?";
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}
