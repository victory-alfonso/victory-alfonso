  const [exporting, setExporting] = useState(null); // null | "image" | "pdf"
  const sheetRef = useRef(null);
  // The Online/Onsite Prayer ministry meets on Thursdays (week n = the nth Thursday) and has a single box per role.
  const isThu = !!(team && team.thursday);
  const slotList = isThu ? [SLOTS[0]] : SLOTS;
  const thuDate = isThu ? nthThursday(year, month, week) : null;
  const thuSlotIdx = isThu ? (week === THURSDAY_ONSITE_WEEK ? 3 : 1) : 0;
  useEffect(() => {
    if (isThu && !thuDate) setWeek(THURSDAY_ONSITE_WEEK);
  }, [isThu, thuDate ? thuDate.getTime() : 0, year, month]);

  // ---- Per-role volunteer list editing (add / remove right on the ministry tab) ----
  // Same data as Manage Teams (role.volunteers in the shared config), so the
  // dropdown on each role and the Manage Teams list always stay in sync.
  const [openVolRoles, setOpenVolRoles] = useState({}); // roleId -> bool (panel expanded)
  const [volDraft, setVolDraft] = useState({});         // roleId -> textarea text
  const parseVolunteerNames = (raw) =>
    (raw || "").split(/[\n,]/).map((x) => norm(x)).filter(Boolean);
  const addVolunteers = (roleId) => {
    if (locked || !team) return;
    const names = parseVolunteerNames(volDraft[roleId]);
    if (names.length === 0) return;
    updateConfig((prev) => ({
      ...prev,
      teams: prev.teams.map((t) => {
        if (t.id !== team.id) return t;
        return {
          ...t,
          roles: t.roles.map((r) => {
            if (r.id !== roleId) return r;
            const existing = r.volunteers || [];
            const seen = new Set(existing.map((v) => normKey(v)));
            const additions = [];
            names.forEach((nm) => {
              const k = normKey(nm);
              if (seen.has(k)) return;
              seen.add(k);
              additions.push(nm);
            });
            if (additions.length === 0) return r;
            return { ...r, volunteers: [...existing, ...additions] };
          }),
        };
      }),
    }));
    setVolDraft((prev) => ({ ...prev, [roleId]: "" }));
  };
  const removeVolunteerFromRole = (roleId, name) => {
    if (locked || !team) return;
    updateConfig((prev) => ({
      ...prev,
      teams: prev.teams.map((t) => {
        if (t.id !== team.id) return t;
        return {
          ...t,
          roles: t.roles.map((r) => (r.id === roleId ? { ...r, volunteers: (r.volunteers || []).filter((v) => v !== name) } : r)),
        };
      }),
    }));
  };

  // Same share/download + capture approach as the Master List's print sheet:
  // phones get the native share sheet (so the image can go straight into a
  // group chat), desktop just downloads the file.
  const isMobileDevice = () =>
    /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (navigator.userAgentData && navigator.userAgentData.mobile);

  const shareOrDownloadBlob = useCallback(async (blob, filename, mimeType) => {
    try {
      const file = new File([blob], filename, { type: mimeType });
      if (isMobileDevice() && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return;
      }
    } catch (err) {
      if (err && err.name === "AbortError") return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }, []);

  const exportMonthSheet = useCallback(async (kind, sheetLabel) => {
    const source = sheetRef.current;
    if (!source || !window.html2canvas || exporting) return;
    setExporting(kind);
    let wrapper = null;
    try {
      const CAPTURE_SCALE = 2;
      const CONTENT_W = 740;
      const clone = source.cloneNode(true);
      clone.style.zoom = "1";
      clone.style.width = `${CONTENT_W}px`;
      clone.style.margin = "0";
      wrapper = document.createElement("div");
      wrapper.style.position = "fixed";
      wrapper.style.top = "0";
      wrapper.style.left = "-99999px";
      wrapper.appendChild(clone);
      document.body.appendChild(wrapper);
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

      const rawCanvas = await window.html2canvas(clone, {
        scale: CAPTURE_SCALE,
        backgroundColor: "#FFFFFF",
        useCORS: true,
      });
      document.body.removeChild(wrapper);
      wrapper = null;

      const safeName = sheetLabel.replace(/[\\/:*?"<>|]/g, "").trim();
      if (kind === "image") {
        await new Promise((resolve) => {
          rawCanvas.toBlob(async (blob) => {
            if (blob) await shareOrDownloadBlob(blob, `${safeName}.png`, "image/png");
            resolve();
          }, "image/png");
        });
      } else {
        const { jsPDF } = window.jspdf;
        const imgData = rawCanvas.toDataURL("image/jpeg", 0.95);
        const pdfW = rawCanvas.width / CAPTURE_SCALE;
        const pdfH = rawCanvas.height / CAPTURE_SCALE;
        const pdf = new jsPDF({ orientation: pdfW > pdfH ? "landscape" : "portrait", unit: "px", format: [pdfW, pdfH] });
        pdf.addImage(imgData, "JPEG", 0, 0, pdfW, pdfH);
        await shareOrDownloadBlob(pdf.output("blob"), `${safeName}.pdf`, "application/pdf");
      }
    } catch (err) {
      if (wrapper && wrapper.parentNode) wrapper.parentNode.removeChild(wrapper);
      console.error(err);
      alert("Couldn't export. Please try again.");
    }
    setExporting(null);
  }, [exporting, shareOrDownloadBlob]);

  if (!team) return null;
  const setName = (roleId, value, slotArg = slot) => {
    if (locked) return;
    updateMonthState((prev) => {
      const key = assignKey(week, slotArg, team.id, roleId);
      const oldValue = norm(prev.assignments[key]);
      const nextAssignments = { ...prev.assignments };
      if (norm(value)) nextAssignments[key] = value;
      else delete nextAssignments[key];
      let nextEditMeta = withEditMeta({ ...(prev.editMeta || {}) }, key, userName);
      // First service -> copy to the other services, but only where they
      // are still empty or same as the old value (so edited ones stay as is)
      const role = team.roles.find((r) => r.id === roleId);
      if (copiesFirstSlot(role) && slotArg === SLOTS[0]) {
        SLOTS.slice(1).forEach((otherSlot) => {
          const otherKey = assignKey(week, otherSlot, team.id, roleId);
          if (norm(nextAssignments[otherKey]) !== oldValue) return;
          if (norm(value)) nextAssignments[otherKey] = value;
          else delete nextAssignments[otherKey];
          nextEditMeta = withEditMeta(nextEditMeta, otherKey, userName);
        });
      }
      return { ...prev, assignments: nextAssignments, editMeta: nextEditMeta };
    });
    // Online/Onsite Prayer: the name also lands on the prayer meeting event of that Thursday
    if (isThu && thuDate && updateConfig) {
      const evKey = eventRoleKey(team.id, roleId);
      const dateISO = isoOf(thuDate);
      updateConfig((prev) => syncPrayerToEvents(prev, dateISO, evKey, value));
    }
  };
  const setVerse = (roleId, value, slotArg = slot) => {
    if (locked) return;
    updateMonthState((prev) => {
      const key = assignKey(week, slotArg, team.id, roleId);
      const nextVerses = { ...(prev.verses || {}) };
      if (norm(value)) nextVerses[key] = value;
      else delete nextVerses[key];
      const nextEditMeta = withEditMeta({ ...(prev.editMeta || {}) }, key + "__verse", userName);
      return { ...prev, verses: nextVerses, editMeta: nextEditMeta };
    });
  };
  const hasAnyValue = team.roles.some((role) => SLOTS.some((s) => {
    const key = assignKey(week, s, team.id, role.id);
    return norm(monthState.assignments[key]) || norm((monthState.verses || {})[key]);
  }));
  const confirmClearAll = () => {
    setConfirmOpen(false);
    updateMonthState((prev) => {
      const nextAssignments = { ...prev.assignments };
      const nextVerses = { ...(prev.verses || {}) };
      let nextEditMeta = { ...(prev.editMeta || {}) };
      team.roles.forEach((role) => SLOTS.forEach((s) => {
        const key = assignKey(week, s, team.id, role.id);
        delete nextAssignments[key];
        delete nextVerses[key];
        nextEditMeta = withEditMeta(nextEditMeta, key, userName);
        nextEditMeta = withEditMeta(nextEditMeta, key + "__verse", userName);
      }));
      return { ...prev, assignments: nextAssignments, verses: nextVerses, editMeta: nextEditMeta };
    });
  };
  if (mode === "print") {
    const monthLabelText = monthLabel(year, month);
    const sheetLabel = `${team.name} - ${monthLabelText}`;
    const printSettings = config.printSettings || {};
    // Only include weeks that actually fall in this month (or have a manual
    // date override) — a 5th week that doesn't correspond to a real Sunday
    // was rendering as a whole extra blank table, wasting space.
    // "Online Prayer Lead" is a Thursday role. To keep every printed date
    // inside the month being printed, week n uses the nth Thursday OF THIS
    // MONTH (never a Thursday from the previous/next month). A week with a
    // Sunday but no matching Thursday just skips that row, and a Thursday
    // with no matching Sunday gets its own small block.
    const nthThursdayOfMonth = (w) => {
      if (!(year && month)) return null;
      const first = new Date(year, month - 1, 1);
      const day = 1 + ((4 - first.getDay() + 7) % 7) + (w - 1) * 7;
      const d = new Date(year, month - 1, day);
      return d.getMonth() === month - 1 ? d : null;
    };
    const weeksData = WEEKS.map((w) => {
      const manual = norm(monthState.weekLabels && monthState.weekLabels[w]);
      const hasSunday = !!(manual || (year && month && nthSundayOfMonth(year, month, w)));
      const thu = nthThursdayOfMonth(w);
      return {
        week: w,
        hasSunday,
        dateLabel: hasSunday ? weekDisplayLabel(w, monthState.weekLabels, year, month) : null,
        thursdayLabel: thu ? `Thursday, ${MONTH_NAMES[thu.getMonth()]} ${thu.getDate()}` : null,
      };
    }).filter((w) => w.hasSunday || (w.thursdayLabel && team.roles.some((r) => norm(r.name).toLowerCase() === "online prayer lead")));
    const isThursdayRole = (r) => norm(r.name).toLowerCase() === "online prayer lead";
    const sundayRoles = team.roles.filter((r) => !isThursdayRole(r));
    const thursdayRoles = team.roles.filter(isThursdayRole);
    // Plain Excel/Google-Sheets-style grid: dark navy date bar, a medium
    // blue for both the time-slot header row and the role-name column, thin
    // black gridlines, white value cells. No card chrome, shadow, rounded
    // corners, or watermark — this view is meant to be screenshotted/printed
    // as a clean roster, not styled like the rest of the app.
    const thuWeeks = team.thursday
      ? WEEKS.map((w) => {
          const d = nthThursday(year, month, w);
          return d ? { week: w, label: thursdayLabel(d), kind: prayerKind(w), color: prayerColor(w) === ONSITE_COLOR ? "#4E2B78" : "#0B6F8A" } : null;
        }).filter(Boolean)
      : [];
    const NAVY_DARK = "#153D64";
    const NAVY_MED = "#215C98";
    const GRID = "#000000";
    const dateBarCell = { background: NAVY_DARK, color: "#FFFFFF", fontWeight: 700, fontSize: 13, textAlign: "center", padding: "6px 8px", border: `1px solid ${GRID}` };
    const headerCell = { background: NAVY_MED, color: "#FFFFFF", fontWeight: 700, fontSize: 12, textAlign: "center", padding: "5px 8px", border: `1px solid ${GRID}` };
    const roleCell = { background: NAVY_MED, color: "#FFFFFF", fontWeight: 700, fontSize: 12.5, textAlign: "left", padding: "5px 10px", border: `1px solid ${GRID}`, whiteSpace: "nowrap" };
    const valueCell = { background: "var(--bFFFFFF)", color: "var(--t1A1A1A)", fontSize: 12.5, textAlign: "left", padding: "5px 10px", border: `1px solid ${GRID}`, whiteSpace: "normal" };
    return (
      <div className="print-sheet-wrap" style={styles.viewWrap}>
        <div className="no-print sheet-toolbar">
          <button onClick={() => setMode("edit")} style={{ ...styles.smallBtn, whiteSpace: "normal" }}>← Back</button>
          <button onClick={() => window.print()} style={{ ...styles.smallBtn, background: "var(--bA9782F)", whiteSpace: "normal" }}>🖨 Print</button>
          <button onClick={() => exportMonthSheet("image", sheetLabel)} disabled={!!exporting}
            style={{ ...styles.smallBtn, background: "var(--b2F4858)", opacity: exporting && exporting !== "image" ? 0.6 : 1, whiteSpace: "normal" }}>
            {exporting === "image" ? "Working…" : "🖼 Save as Image"}
          </button>
          <button onClick={() => exportMonthSheet("pdf", sheetLabel)} disabled={!!exporting}
            style={{ ...styles.smallBtn, background: "var(--b2F4858)", opacity: exporting && exporting !== "pdf" ? 0.6 : 1, whiteSpace: "normal" }}>
            {exporting === "pdf" ? "Working…" : "📄 Save as PDF"}
          </button>
        </div>
        <div className="sheet-scroll">
          {/* Plain block, same pattern as the Master List's sheet (styles.sheet):
              no flex/centering here, so this div and the table inside it are
              free to stretch to the full width of the printable page instead
              of shrink-wrapping to their content and leaving blank margin. */}
          <div ref={sheetRef} className="paper" style={{ background: "var(--bFFFFFF)", padding: 12, minWidth: 480 }}>
            {/* Same banner style as the Master List's run sheet (dark navy
                title bar + light-blue sub bar), just with the ministry name
                worked into the sub line instead of a single service time.
                No inline-block wrapper here either, so the banner spans the
                same full width as the table below it. */}
            <div style={{ border: "2px solid var(--l23211D)", marginBottom: 14, fontFamily: "Calibri, Arial, sans-serif" }}>
              <div style={styles.sheetBannerMain}>{printSettings.churchName || "VICTORY ALFONSO SUNDAY SERVICE"}</div>
              <div style={styles.sheetBannerSub}>
                {[printSettings.campus || "VICTORY ALFONSO", team.name, monthLabelText].filter(Boolean).join(" | ")}
              </div>
            </div>
            {team.thursday ? (
              thuWeeks.length === 0 ? (
                <div style={{ fontFamily: "Calibri, Arial, sans-serif", color: "var(--t8A7F5E)", textAlign: "center", padding: 20 }}>No Thursdays found for this month.</div>
              ) : (
                <table style={{ borderCollapse: "collapse", fontFamily: "Calibri, Arial, sans-serif", width: "100%", tableLayout: "fixed" }}>
                  <colgroup>
                    <col style={{ width: "34%" }} />
                    <col style={{ width: "66%" }} />
                  </colgroup>
                  {thuWeeks.map((w, wi) => (
                    <tbody key={w.week} style={{ breakInside: "avoid", pageBreakInside: "avoid" }}>
                      {wi > 0 && <tr><td colSpan={2} style={{ border: "none", padding: 0, height: 14 }} /></tr>}
                      <tr>
                        <th colSpan={2} style={{ ...dateBarCell, background: w.color }}>{w.label} — {w.kind} PRAYER MEETING</th>
                      </tr>
                      {team.roles.length === 0 ? (
                        <tr><td style={valueCell} colSpan={2}>No roles set up for this team yet.</td></tr>
                      ) : team.roles.map((role) => {
                        const key = assignKey(w.week, SLOTS[0], team.id, role.id);
                        const name = monthState.assignments[key] || "";
                        const verse = (monthState.verses || {})[key] || "";
                        return (
                          <tr key={role.id}>
                            <td style={{ ...roleCell, background: w.color }}>{thuRoleName(role.name, w.week)}</td>
                            <td style={valueCell}>
                              {name}
                              {role.hasVerse && verse && <div style={{ fontSize: 10.5, color: "var(--t6B6B6B)", marginTop: 2, whiteSpace: "normal" }}>{verse}</div>}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  ))}
                </table>
              )
            ) : weeksData.length === 0 ? (
              <div style={{ fontFamily: "Calibri, Arial, sans-serif", color: "var(--t8A7F5E)", textAlign: "center", padding: 20 }}>
                No Sundays found for this month.
              </div>
            ) : (
              // One shared table for the whole sheet (not a separate table per
              // week) so the browser sizes every column to fit the widest
              // content across ALL weeks at once — columns hug the role names
              // and volunteer names tightly instead of sitting at a fixed
              // percentage width, and every week still lines up exactly since
              // it's literally the same table.
              <table style={{ borderCollapse: "collapse", fontFamily: "Calibri, Arial, sans-serif", width: "100%", tableLayout: "fixed" }}>
                {/* Fixed layout: role column gets a set share, and the 9am / 11am / 4pm
                    columns split the rest equally so they're always the same width. */}
                <colgroup>
                  <col style={{ width: "22%" }} />
                  {SLOTS.map((s) => (<col key={s} style={{ width: `${78 / SLOTS.length}%` }} />))}
                </colgroup>
                {weeksData.map((w, wi) => (
                  // Each week gets its own tbody (still the same shared table,
                  // so column widths stay lined up across every week) with
                  // break-inside: avoid so the browser's print pagination
                  // can't slice a week's block in half between pages — it
                  // pushes the whole block to the next page instead.
                  <tbody key={w.week} style={{ breakInside: "avoid", pageBreakInside: "avoid" }}>
                    {wi > 0 && (
                      <tr><td colSpan={1 + SLOTS.length} style={{ border: "none", padding: 0, height: 14 }} /></tr>
                    )}
                    {w.hasSunday && (
                      <tr>
                        <th colSpan={1 + SLOTS.length} style={dateBarCell}>{w.dateLabel}</th>
                      </tr>
                    )}
                    {w.hasSunday && (
                      <tr>
                        <th style={headerCell}></th>
                        {SLOTS.map((s) => (<th key={s} style={headerCell}>{s.replace("AM", "am").replace("PM", "pm")}</th>))}
                      </tr>
                    )}
                    {!w.hasSunday ? null : team.roles.length === 0 ? (
                      <tr><td style={valueCell} colSpan={1 + SLOTS.length}>No roles set up for this team yet.</td></tr>
                    ) : (
                      sundayRoles.map((role) => (
                        <tr key={role.id}>
                          <td style={roleCell}>{role.name}</td>
                          {SLOTS.map((s) => {
                            const key = assignKey(w.week, s, team.id, role.id);
                            const name = monthState.assignments[key] || "";
                            const verse = (monthState.verses || {})[key] || "";
                            return (
                              <td key={s} style={valueCell}>
                                {name}
                                {role.hasVerse && verse && (
                                  <div style={{ fontSize: 10.5, color: "var(--t6B6B6B)", marginTop: 2, whiteSpace: "normal" }}>{verse}</div>
                                )}
                              </td>
                            );
                          })}
                        </tr>
                      ))
                    )}
                    {w.thursdayLabel && thursdayRoles.map((role) => {
                      // One name per week: collect whatever was assigned in any time slot.
                      const names = [];
                      SLOTS.forEach((s) => {
                        const nm = norm(monthState.assignments[assignKey(w.week, s, team.id, role.id)]);
                        if (nm && !names.includes(nm)) names.push(nm);
                      });
                      return (
                        <tr key={role.id}>
                          <td style={roleCell}>{role.name}</td>
                          <td style={valueCell} colSpan={SLOTS.length}>
                            <span style={{ fontWeight: 700 }}>{w.thursdayLabel}</span>
                            {names.length > 0 ? ` — ${names.join(" / ")}` : ""}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                ))}
              </table>
            )}
          </div>
        </div>
      </div>
    );
  }

  // event name -> Thursday box of this tab (week n = nth Thursday), works for other months too
  const syncNameFromEvent = (dateISO, eventKey, value) => {
    if (!isThu || locked) return;
    const [y, m, d] = String(dateISO || "").split("-").map(Number);
    const [teamId, roleId] = splitRoleKey(eventKey);
    if (!y || !m || !d || teamId !== team.id || !team.roles.some((r) => r.id === roleId)) return;
    if (new Date(y, m - 1, d).getDay() !== 4) return;
    const key = assignKey(Math.ceil(d / 7), SLOTS[0], team.id, roleId);
    const apply = (prev) => {
      const nextAssignments = { ...(prev.assignments || {}) };
      if (norm(value)) nextAssignments[key] = value;
      else delete nextAssignments[key];
      return { ...prev, assignments: nextAssignments, editMeta: withEditMeta({ ...(prev.editMeta || {}) }, key, userName) };
    };
    if (y === year && m === month) updateMonthState(apply);
    else monthRef(y, m).transaction((cur) => apply({ ...emptyMonthState(), ...(cur || {}) }));
  };

  if (showEvents) {
    return <TeamEventsAssign config={config} updateConfig={updateConfig} team={team} locked={locked} isMobile={isMobile} onNameChange={syncNameFromEvent} onBack={() => setShowEvents(false)} />;
  }

  return (
    <div style={styles.viewWrap}>
      {/* On desktop the title, month picker, Sunday dates and service-time chips are one
          frozen block that stays pinned while the roles scroll underneath. */}
      <div style={isMobile ? undefined : { position: "sticky", top: 0, zIndex: 20, background: "var(--bF6F1E4)", paddingTop: 8 }}>
      <header style={{ ...styles.viewHeader, ...(isMobile ? {} : { marginBottom: 4 }) }}>
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
          <h1 style={isMobile ? styles.h1 : { ...styles.h1, lineHeight: 1.1 }}>{team.name}</h1>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <button onClick={() => setShowEvents(true)} style={{ ...styles.smallBtn, background: "var(--b2F4858)" }}>📅 Events</button>
            <button onClick={() => setMode("print")} className="btn-print" style={styles.smallBtn}>🖨 Print month</button>
            {!locked && (
              <button onClick={() => hasAnyValue && setConfirmOpen(true)} disabled={!hasAnyValue} className="btn-clear"
                style={{ ...styles.smallBtn, background: "var(--bA6402F)", opacity: hasAnyValue ? 1 : 0.45, cursor: hasAnyValue ? "pointer" : "default" }}>
                Clear all
              </button>
            )}
            <ThemeToggle className="theme-toggle-view" />
          </div>
        </div>
        <div style={{ ...styles.viewMeta, display: "flex", alignItems: "center", flexWrap: "wrap", gap: 8, ...(isMobile ? {} : { marginTop: 2 }) }}>
          {!isMobile && (
            <div className="no-print month-nav-keep" style={styles.headerMonthNav}>
              <button onClick={onPrevMonth} style={styles.headerMonthBtn} aria-label="Previous month">‹</button>
              <MonthPickerLabel style={styles.headerMonthLabel} />
              <button onClick={onNextMonth} style={styles.headerMonthBtn} aria-label="Next month">›</button>
            </div>
          )}
          <span>
          {isThu
            ? (thuDate ? `${thursdayLabel(thuDate)} · ${prayerKind(week)}` : "")
            : isMobile
            ? weekDisplayLabel(week, monthState.weekLabels, year, month)
            : (norm(monthState.weekLabels && monthState.weekLabels[week])
                ? weekDisplayLabel(week, monthState.weekLabels, year, month)
                : "")}{isMobile && !isThu ? " · All services" : ""}
          </span>
          {team.flexible && <span style={styles.flexTag}>compatible with every team</span>}
          {locked && <span style={styles.flexTag}>view only — you can only edit your ministry</span>}
        </div>
      </header>
      {/* Column header: one colored chip per service time, so every role row
          below shows all the services side by side and nobody has to switch
          time slots to fill in the 11:00 AM or 4:00 PM names. It sits outside
          rolesCard (which scrolls horizontally) so it can stay pinned to the
          top while scrolling. */}
      <div className="no-print" style={{
        ...(isMobile ? { position: "sticky", top: "env(safe-area-inset-top, 0px)", zIndex: 20 } : {}),
        background: "var(--bF6F1E4)", display: "flex", alignItems: "center",
        ...(isMobile ? { padding: "6px 0 8px", gap: 0 } : { padding: "4px 23px 8px 0", gap: 20 }),
      }}>
        {!isMobile && (
          <div style={{ width: 233, flexShrink: 0, display: "flex", gap: 5 }}>
            {WEEKS.map((w) => {
              const thu = isThu ? nthThursday(year, month, w) : null;
              const text = isThu ? (thu ? String(thu.getDate()) : null) : weekButtonText(w, monthState.weekLabels, year, month);
              if (!text && w !== week) return null;
              const active = w === week;
              const kindColor = isThu ? prayerColor(w) : null;
              return (

// headers, etc.) regardless of where in the tree it's triggered from.
function ClearNamesModal({ teamName, onCancel, onConfirm,
  title = "Clear Names",
  body = "This will remove all volunteer names and verses from this ministry tab for this service, and update the Master List.",
  note = "Only this tab will be affected. Other ministry tabs stay untouched.",
  warning = "This cannot be undone. Please make sure you're on the right tab before continuing.",

  return ReactDOM.createPortal(
    <div className="no-print" style={styles.modalOverlay} onMouseDown={(e) => { if (e.target === e.currentTarget) onCancel(); }}>

      </div>
