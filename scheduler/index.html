    document.body
  );
}

// Lets the signed-in user change the name they show up as on the schedule
// (their Firebase displayName). Purely cosmetic/matching — see the note by
// updateNickname in App for why this never affects edit access.
function RenameModal({ currentName, onRenameUser, onDone }) {
  const [value, setValue] = useState(currentName || "");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onDone(); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [onDone]);

  const save = async () => {
    if (!norm(value)) { setError("Enter a name."); return; }
    setBusy(true);
    setError("");
    const result = await onRenameUser(value);
    setBusy(false);
    if (result && result.ok) {
      onDone();
    } else {
      setError((result && result.error) || "Couldn't save that name.");
    }
  };

  return ReactDOM.createPortal(
    <div className="no-print" style={styles.modalOverlay} onMouseDown={(e) => { if (e.target === e.currentTarget) onDone(); }}>
      <div style={styles.modalCard}>
        <div style={styles.modalIconRow}>
          <div style={{ ...styles.modalIconBadge, background: "var(--b1F3864)" }}>✎</div>
          <div style={styles.modalTitle}>Edit Your Name</div>
        </div>
        <div style={styles.modalBody}>
          This is the name shown on the schedule and used to match your
          assignments. It doesn't affect who can edit — that's controlled by
          your team leader's Editors list.
        </div>
        <input type="text" value={value} autoFocus
          onChange={(e) => setValue(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") save(); }}
          placeholder="e.g. Zerah Torres" style={{ ...styles.input, marginBottom: error ? 8 : 16 }} />
        {error && <div style={{ color: "var(--tA6402F)", fontSize: 12.5, fontFamily: "system-ui, sans-serif", marginBottom: 16 }}>{error}</div>}
        <div style={styles.modalActions}>
          <button onClick={onDone} style={styles.modalCancelBtn} disabled={busy}>Cancel</button>
          <button onClick={save} style={{ ...styles.smallBtn, padding: "9px 18px", opacity: busy ? 0.6 : 1 }} disabled={busy}>
            {busy ? "Saving…" : "Save"}
          </button>
        </div>
      </div>
    </div>,
    document.body
  );
}

// Lets a signed-in user change their own account password from inside the
// app, instead of having to sign out and use the "forgot password" email
// link. Firebase requires a recent sign-in for a change like this, so the
// user re-enters their current password first, which we use to re-
// authenticate before setting the new one.
function ChangePasswordModal({ onChangePassword, onDone }) {
  const [currentPassword, setCurrentPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [done, setDone] = useState(false);
  const [showCurrent, setShowCurrent] = useState(false);
  const [showNew, setShowNew] = useState(false);
  const [showConfirm, setShowConfirm] = useState(false);

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onDone(); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [onDone]);

  const save = async () => {
    setError("");
    if (!currentPassword) { setError("Enter your current password."); return; }
    if (!newPassword || newPassword.length < 6) { setError("New password should be at least 6 characters."); return; }
    if (newPassword !== confirmPassword) { setError("New passwords don't match."); return; }
    setBusy(true);
    const result = await onChangePassword(currentPassword, newPassword);
    setBusy(false);
    if (result && result.ok) {
      setDone(true);
    } else {
      setError((result && result.error) || "Couldn't change your password.");
    }
  };

  return ReactDOM.createPortal(
    <div className="no-print" style={styles.modalOverlay} onMouseDown={(e) => { if (e.target === e.currentTarget) onDone(); }}>
      <div style={styles.modalCard}>
        <div style={styles.modalIconRow}>
          <div style={{ ...styles.modalIconBadge, background: "var(--b1F3864)" }}>🔒</div>
          <div style={styles.modalTitle}>Change Password</div>
        </div>
        {done ? (
          <React.Fragment>
            <div style={styles.modalBody}>Your password has been updated.</div>
            <div style={styles.modalActions}>
              <button onClick={onDone} style={{ ...styles.smallBtn, padding: "9px 18px" }}>Done</button>
            </div>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <div style={styles.modalBody}>
              Enter your current password, then choose a new one.
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: error ? 8 : 16 }}>
              <div style={styles.passwordFieldWrap}>
                <input type={showCurrent ? "text" : "password"} value={currentPassword} autoFocus autoComplete="current-password"
                  onChange={(e) => setCurrentPassword(e.target.value)}
                  placeholder="Current password" style={{ ...styles.input, paddingRight: 40 }} />
                <button type="button" onClick={() => setShowCurrent((s) => !s)} style={styles.passwordToggleBtn}
                  aria-label={showCurrent ? "Hide password" : "Show password"} title={showCurrent ? "Hide password" : "Show password"}>
                  {showCurrent ? <EyeOffIcon /> : <EyeIcon />}
                </button>
              </div>
              <div style={styles.passwordFieldWrap}>
                <input type={showNew ? "text" : "password"} value={newPassword} autoComplete="new-password"
                  onChange={(e) => setNewPassword(e.target.value)}
                  placeholder="New password" style={{ ...styles.input, paddingRight: 40 }} />
                <button type="button" onClick={() => setShowNew((s) => !s)} style={styles.passwordToggleBtn}
                  aria-label={showNew ? "Hide password" : "Show password"} title={showNew ? "Hide password" : "Show password"}>
                  {showNew ? <EyeOffIcon /> : <EyeIcon />}
                </button>
              </div>
              <div style={styles.passwordFieldWrap}>
                <input type={showConfirm ? "text" : "password"} value={confirmPassword} autoComplete="new-password"
                  onChange={(e) => setConfirmPassword(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter") save(); }}
                  placeholder="Confirm new password" style={{ ...styles.input, paddingRight: 40 }} />
                <button type="button" onClick={() => setShowConfirm((s) => !s)} style={styles.passwordToggleBtn}
                  aria-label={showConfirm ? "Hide password" : "Show password"} title={showConfirm ? "Hide password" : "Show password"}>
                  {showConfirm ? <EyeOffIcon /> : <EyeIcon />}
                </button>
              </div>
            </div>
            {error && <div style={{ color: "var(--tA6402F)", fontSize: 12.5, fontFamily: "system-ui, sans-serif", marginBottom: 16 }}>{error}</div>}
            <div style={styles.modalActions}>
              <button onClick={onDone} style={styles.modalCancelBtn} disabled={busy}>Cancel</button>
              <button onClick={save} style={{ ...styles.smallBtn, padding: "9px 18px", opacity: busy ? 0.6 : 1 }} disabled={busy}>
                {busy ? "Saving…" : "Save"}
              </button>
            </div>
          </React.Fragment>
        )}
      </div>
    </div>,
    document.body
  );
}

// A volunteer-name text input with a custom popup dropdown of saved names for
// this role. The dropdown is rendered through a portal into document.body
// and positioned with position:fixed against the input's own bounding box,
// so it floats above everything (never gets clipped by a scrolling/overflow
// ancestor like the roles card) and always has room to fully show itself.
// Opening it via click/focus always shows the FULL saved list for the role
// (not narrowed to whatever text is already in the box) so a name that's
// already been chosen — including one currently flagged as a conflict or
// duplicate — can still be swapped for someone else with one click. Typing
// further narrows the list as usual. Selecting a suggestion, or typing a
// brand new name, only fills the field — it never writes back to the saved
// Press-and-hold "last changed by" info badge. Sits absolutely inside a
// position:relative wrapper around a field, at the field's right edge.
// Anchor its coordinates off `anchorRef` (the field itself) so the tooltip
// is portaled to <body> with fixed positioning — this keeps it from being
// clipped by any ancestor's overflow (e.g. the scrollable roles card).
function LastChangedBadge({ meta, anchorRef, align }) {
  const [show, setShow] = useState(false);
  const [coords, setCoords] = useState(null);
  const [shiftX, setShiftX] = useState(0);
  const tooltipRef = useRef(null);
  const metaTime = metaTimeText(meta);
  const hasMeta = hasMetaInfo(meta);

  const updateCoords = useCallback(() => {
    const el = anchorRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    setCoords({ top: rect.bottom + 6, right: window.innerWidth - rect.right });
  }, [anchorRef]);

  useEffect(() => {
    if (!show) return;
    updateCoords();
    window.addEventListener("scroll", updateCoords, true);
    window.addEventListener("resize", updateCoords);
    return () => {
      window.removeEventListener("scroll", updateCoords, true);
      window.removeEventListener("resize", updateCoords);
    };
  }, [show, updateCoords]);

  // Nudge the tooltip back onto the screen if it would spill past the
  // left/right edge once its actual rendered width is known.
  useEffect(() => {
    if (!show || !coords || !tooltipRef.current) { setShiftX(0); return; }
    const margin = 8;
    const rect = tooltipRef.current.getBoundingClientRect();
    let shift = 0;
    if (rect.right > window.innerWidth - margin) shift -= (rect.right - (window.innerWidth - margin));
    if (rect.left + shift < margin) shift += (margin - (rect.left + shift));
    setShiftX(shift);
  }, [show, coords]);

  if (!hasMeta) return null;

  return (
    <React.Fragment>
      <button
        type="button"
        aria-label="Last changed by"
        onMouseDown={(e) => { e.preventDefault(); updateCoords(); setShow(true); }}
        onMouseUp={() => setShow(false)}
        onMouseLeave={() => setShow(false)}
        onTouchStart={(e) => { e.preventDefault(); updateCoords(); setShow(true); }}
        onTouchEnd={() => setShow(false)}
        onTouchCancel={() => setShow(false)}
        onContextMenu={(e) => e.preventDefault()}
        style={{
          position: "absolute", right: 8,
          ...(align === "top" ? { top: 10 } : { top: "50%", transform: "translateY(-50%)" }),
          width: 22, height: 22, borderRadius: "50%", border: "none", padding: 0,
          display: "flex", alignItems: "center", justifyContent: "center",
          background: show ? "var(--bD8CFB0)" : "transparent",
          cursor: "pointer", overflow: "hidden",
          userSelect: "none", WebkitUserSelect: "none", WebkitTouchCallout: "none", touchAction: "manipulation",
          transition: "background 0.15s ease",
        }}
      >
        <span style={{
          position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center",
          fontSize: 13, fontWeight: 700, fontFamily: "Georgia, serif",
          color: "var(--tA99B72)", lineHeight: 1,
          opacity: show ? 0 : 1, transform: show ? "scale(0.4) rotate(-20deg)" : "scale(1) rotate(0deg)",
          transition: "opacity 0.18s ease, transform 0.18s ease",
          pointerEvents: "none", WebkitTouchCallout: "none", WebkitUserSelect: "none", userSelect: "none",
        }}>i</span>
        <img src="./icons/victory.png" alt="" draggable="false" style={{
          position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover", objectPosition: "50% 50%", borderRadius: "50%",
          opacity: show ? 1 : 0, transform: show ? "scale(1) rotate(0deg)" : "scale(0.4) rotate(20deg)",
          transition: "opacity 0.18s ease, transform 0.18s ease",
          pointerEvents: "none", WebkitTouchCallout: "none", WebkitUserSelect: "none", userSelect: "none",
        }} />
      </button>
      {show && coords && ReactDOM.createPortal(
        <div ref={tooltipRef} className="no-print" style={{
          position: "fixed", top: coords.top, right: coords.right, zIndex: 2100001,
          background: "#2A2620", color: "#F6F1E4", fontSize: 11.5, fontStyle: "italic",
          fontFamily: "system-ui, sans-serif", padding: "6px 10px", borderRadius: 6,
          whiteSpace: "nowrap", boxShadow: "0 6px 14px rgba(0,0,0,0.25)", pointerEvents: "none",
          transform: `translateX(${shiftX}px)`,
        }}>
          Last changed by {meta.by}{metaTime ? ` · ${metaTime}` : ""}
        </div>,
        document.body
      )}
    </React.Fragment>
  );
}

// Small inline "i" info icon for the Master List, standing in for the
// always-on "name · Xh ago" caption. Tap-and-hold (or hover on desktop)
// swaps the "i" for the victory logo and pops a "Last changed by" tooltip —
// same crossfade as LastChangedBadge above. Released/blurred, it reverts.
// Renders nothing when there's no edit history to show. Deliberately a
// plain inline element (not a flex wrapper) so it sits inside the name
// text like a word and wraps with it, instead of forcing the name onto
// one unbreakable line that can overflow its column.
function MasterEditInfo({ meta, style }) {
  const [show, setShow] = useState(false);
  const [coords, setCoords] = useState(null);
  const [shiftX, setShiftX] = useState(0);
  const btnRef = useRef(null);
  const tooltipRef = useRef(null);
  const metaTime = metaTimeText(meta);
  const hasMeta = hasMetaInfo(meta);

  const updateCoords = useCallback(() => {
    const el = btnRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    setCoords({ top: rect.bottom + 6, left: rect.left });
  }, []);

  useEffect(() => {
    if (!show) return;
    updateCoords();
    window.addEventListener("scroll", updateCoords, true);
    window.addEventListener("resize", updateCoords);
    return () => {
      window.removeEventListener("scroll", updateCoords, true);
      window.removeEventListener("resize", updateCoords);
    };
  }, [show, updateCoords]);

  // Once the tooltip is actually in the DOM, measure it and nudge it back
  // onto the screen if it would otherwise spill past the left/right edge —
  // this is what keeps "Last changed by ..." readable near screen edges.
  useEffect(() => {
    if (!show || !coords || !tooltipRef.current) { setShiftX(0); return; }
    const margin = 8;
    const rect = tooltipRef.current.getBoundingClientRect();
    let shift = 0;
    if (rect.right > window.innerWidth - margin) shift -= (rect.right - (window.innerWidth - margin));
    if (rect.left + shift < margin) shift += (margin - (rect.left + shift));
    setShiftX(shift);
  }, [show, coords]);

  if (!hasMeta) return null;

  return (
    <React.Fragment>
      <button
        ref={btnRef}
        type="button"
        aria-label="Last changed by"
        onMouseDown={(e) => { e.preventDefault(); updateCoords(); setShow(true); }}
        onMouseUp={() => setShow(false)}
        onMouseLeave={() => setShow(false)}
        onTouchStart={(e) => { e.preventDefault(); updateCoords(); setShow(true); }}
        onTouchEnd={() => setShow(false)}
        onTouchCancel={() => setShow(false)}
        onContextMenu={(e) => e.preventDefault()}
        style={{ ...styles.masterMetaBtn, background: show ? "var(--bD8CFB0)" : "transparent", ...(style || {}) }}
      >
        <span style={{
          position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center",
          fontSize: 10.5, fontWeight: 700, fontFamily: "Georgia, serif",
          color: "var(--tA99B72)", lineHeight: 1,
          opacity: show ? 0 : 1, transform: show ? "scale(0.4) rotate(-20deg)" : "scale(1) rotate(0deg)",
          transition: "opacity 0.18s ease, transform 0.18s ease",
          pointerEvents: "none", WebkitTouchCallout: "none", WebkitUserSelect: "none", userSelect: "none",
        }}>i</span>
        <img src="./icons/victory.png" alt="" draggable="false" style={{
          position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover", objectPosition: "50% 50%", borderRadius: "50%",
          opacity: show ? 1 : 0, transform: show ? "scale(1) rotate(0deg)" : "scale(0.4) rotate(20deg)",
          transition: "opacity 0.18s ease, transform 0.18s ease",
          pointerEvents: "none", WebkitTouchCallout: "none", WebkitUserSelect: "none", userSelect: "none",
        }} />
      </button>
      {show && coords && ReactDOM.createPortal(
        <div ref={tooltipRef} className="no-print" style={{
          position: "fixed", top: coords.top, left: coords.left, zIndex: 2100001,
          background: "#2A2620", color: "#F6F1E4", fontSize: 11.5, fontStyle: "italic",
          fontFamily: "system-ui, sans-serif", padding: "6px 10px", borderRadius: 6,
          whiteSpace: "nowrap", boxShadow: "0 6px 14px rgba(0,0,0,0.25)", pointerEvents: "none",
          transform: `translateX(${shiftX}px)`,
        }}>
          Last changed by {meta.by}{metaTime ? ` · ${metaTime}` : ""}
        </div>,
        document.body
      )}
    </React.Fragment>
  );
}

// Plain text/number/textarea field with an optional press-and-hold "last
// changed by" badge at its right edge. Used anywhere a single field (not
// the volunteer-name autocomplete) needs its own edit-attribution.
function TextFieldWithMeta({ value, onChange, locked, placeholder, style, meta, multiline, rows, inputMode, align, wrapStyle }) {
  const ref = useRef(null);
  const hasMeta = hasMetaInfo(meta);
  const fieldStyle = hasMeta ? { ...style, paddingRight: 34 } : style;
  return (
    <div style={{ position: "relative", ...(wrapStyle || {}) }}>
      {multiline ? (
        <textarea ref={ref} value={value} onChange={(e) => onChange(e.target.value)}
          placeholder={placeholder} readOnly={locked} rows={rows} style={fieldStyle} />
      ) : (
        <input ref={ref} value={value} onChange={(e) => onChange(e.target.value)}
          placeholder={placeholder} readOnly={locked} inputMode={inputMode} style={fieldStyle} autoComplete="off" />
      )}
      {hasMeta && <LastChangedBadge meta={meta} anchorRef={ref} align={align} />}
    </div>
  );
}

// volunteer list on its own; that list is only ever edited deliberately
// from Manage Teams.
// compact: used for the narrow 3-column phone cells — names wrap instead of
//   truncating, and the search icon / "last changed" badge move into the picker
//   popup so they don't eat space inside a ~90px box.
// popupTitle / popupMinWidth: heading ("Admin · 11:00 AM") and minimum width
//   for the picker popup, so it's clear which box you're filling in.
function VolunteerNameInput({ value, onChange, volunteers, locked, placeholder, style, meta, allowAbove = true, warningText, compact = false, popupTitle, popupMinWidth = 0 }) {
  const [open, setOpen] = useState(false);
  const [closing, setClosing] = useState(false);
  const closeTimerRef = useRef(null);
  const [search, setSearch] = useState("");
  const [coords, setCoords] = useState(null);
  const [isEditing, setIsEditing] = useState(false);
  const wrapRef = useRef(null);
  const anchorRef = useRef(null);
  const popupRef = useRef(null);
  const viewportSettleTimer = useRef(null);
  const frozenPopupRef = useRef({ filtered: [], coords: null });

  // Closing plays a quick shrink-and-fade before it actually unmounts, so
  // the popup feels like it retracts rather than just vanishing.
  const closePopup = useCallback(() => {
    setOpen((wasOpen) => {
      if (!wasOpen) return wasOpen;
      setClosing(true);
      clearTimeout(closeTimerRef.current);
      closeTimerRef.current = setTimeout(() => setClosing(false), 150);
      return false;
    });
  }, []);

  useEffect(() => () => clearTimeout(closeTimerRef.current), []);
  // Whether to show the keyboard is about the input device, not window
  // width — a narrow desktop window is still mouse-driven, so we check
  // pointer type directly instead of reusing the layout's isMobile flag.
  const [isTouchDevice] = useState(() => (typeof window !== "undefined" && window.matchMedia ? window.matchMedia("(pointer: coarse)").matches : false));

  const hasMeta = hasMetaInfo(meta) && !compact;
  // On a touchscreen there's a keyboard to worry about, so clicking the box
  // only shows the picker; the search icon is the opt-in way to type. On a
  // mouse-driven device, clicking the box edits directly, like a normal field.
  const showSearchIcon = !locked && isTouchDevice && !compact;

  // Once the keyboard finishes opening (visualViewport stops changing), check
  // once whether it now covers the focused input, and if so nudge the page up
  // by exactly the overlap. Debounced so mid-animation resize events don't
  // each add their own extra scroll — that repeated stacking was the bounce.
  useEffect(() => {
    const vv = window.visualViewport;
    if (!vv) return;
    const handleViewportResize = () => {
      clearTimeout(viewportSettleTimer.current);
      viewportSettleTimer.current = setTimeout(() => {
        const el = anchorRef.current;
        if (!el || document.activeElement !== el) return;
        const rect = el.getBoundingClientRect();
        const visibleBottom = vv.offsetTop + vv.height;
        const overlap = rect.bottom - visibleBottom;
        if (overlap > 0) window.scrollBy(0, overlap + 12);
      }, 120);
    };
    vv.addEventListener("resize", handleViewportResize);
    return () => {
      vv.removeEventListener("resize", handleViewportResize);
      clearTimeout(viewportSettleTimer.current);
    };
  }, []);

  // Picks whichever side (below or above the input) has more room, and caps
  // the popup's height to whatever space is actually visible — so on phones
  // it lands above the on-screen keyboard instead of hiding behind it.
  const updateCoords = useCallback(() => {
    const el = anchorRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const vv = window.visualViewport;
    const layoutHeight = window.innerHeight;
    const visibleTop = vv ? vv.offsetTop : 0;
    const visibleBottom = vv ? vv.offsetTop + vv.height : layoutHeight;
    const gap = 6;
    const margin = 10;
    const spaceBelow = visibleBottom - rect.bottom - gap - margin;
    const spaceAbove = rect.top - visibleTop - gap - margin;
    // On mobile the role name sits directly above this input (stacked column
    // layout), so flipping the popup above it would hide which role is being
    // filled in. allowAbove === false keeps it pinned below no matter what.
    const below = allowAbove === false || spaceBelow >= 120 || spaceBelow >= spaceAbove;
    const maxHeight = Math.max(100, Math.min(240, below ? spaceBelow : spaceAbove));
    // A narrow box (like a phone's 3-column cell) would give a tiny popup, so
    // enforce a minimum width and keep it fully on screen.
    const popupWidth = Math.max(rect.width, Math.min(popupMinWidth, window.innerWidth - margin * 2));
    const popupLeft = Math.max(margin, Math.min(rect.left, window.innerWidth - popupWidth - margin));
    if (below) {
      let top = rect.bottom + gap;
      // Clamp so the popup never runs off the bottom of the visible viewport,
      // even when allowAbove === false forces it to stay below no matter what
      // (e.g. the very last field on the page, like Benediction, where there
      // isn't enough real room underneath it).
      const maxTop = visibleBottom - margin - maxHeight;
      if (top > maxTop) top = Math.max(visibleTop + margin, maxTop);
      setCoords({ left: popupLeft, width: popupWidth, top, bottom: null, maxHeight });
    } else {
      setCoords({ left: popupLeft, width: popupWidth, top: null, bottom: layoutHeight - rect.top + gap, maxHeight });
    }
  }, [allowAbove, popupMinWidth]);

  // Tapping the box on a touchscreen just shows the picker — no keyboard,
  // so nothing to scroll for. With a mouse it edits directly, like a normal field.
  // Cancels any pending close-animation teardown so reopening mid-exit
  // doesn't get its "closing" flag cleared out from under it later.
  const cancelClosing = () => {
    clearTimeout(closeTimerRef.current);
    setClosing(false);
  };

  const openPicker = () => {
    if (locked) return;
    if (!isTouchDevice) { startTyping(); return; }
    if ((volunteers || []).length === 0) { startTyping(); return; }
    setSearch("");
    updateCoords();
    cancelClosing();
    setOpen(true);
  };

  const startTyping = () => {
    if (locked) return;
    setSearch("");
    setIsEditing(true);
    cancelClosing();
    setOpen(true);
  };

  useEffect(() => {
    if (!isEditing) return;
    updateCoords();
    const el = anchorRef.current;
    if (el) el.focus({ preventScroll: true });
  }, [isEditing, updateCoords]);

  useEffect(() => {
    if (!open) return;
    updateCoords();
    const handleOutside = (e) => {
      if (wrapRef.current && wrapRef.current.contains(e.target)) return;
      if (popupRef.current && popupRef.current.contains(e.target)) return;
      closePopup();
      setIsEditing(false);
    };
    document.addEventListener("mousedown", handleOutside);
    window.addEventListener("scroll", updateCoords, true);
    window.addEventListener("resize", updateCoords);
    const vv = window.visualViewport;
    if (vv) {
      vv.addEventListener("resize", updateCoords);
      vv.addEventListener("scroll", updateCoords);
    }
    return () => {
      document.removeEventListener("mousedown", handleOutside);
      window.removeEventListener("scroll", updateCoords, true);
      window.removeEventListener("resize", updateCoords);
      if (vv) {
        vv.removeEventListener("resize", updateCoords);
        vv.removeEventListener("scroll", updateCoords);
      }
    };
  }, [open, updateCoords]);

  const pick = (v) => {
    onChange(v);
    setSearch("");
    closePopup();
    setIsEditing(false);
  };

  const filtered = isEditing
    ? (volunteers || []).filter((v) => normKey(v).includes(normKey(search)))
    : (volunteers || []);

  // While the popup is open we keep a frozen snapshot of its list/position;
  // once it starts closing we keep rendering that snapshot instead of the
  // live values, so the exit animation doesn't jump or change content
  // mid-flight while it fades out.
  if (open && coords) frozenPopupRef.current = { filtered, coords };
  const popupData = open ? { filtered, coords } : frozenPopupRef.current;

  const rightPad = (hasMeta ? 34 : 0) + (showSearchIcon ? 30 : 0);
  const boxStyle = rightPad ? { ...style, paddingRight: rightPad } : style;

  return (
    <div ref={wrapRef} style={{ position: "relative", flex: 1 }}>
      {isEditing ? (
        <input
          ref={anchorRef}
          value={value}
          onChange={(e) => {
            onChange(e.target.value);
            setSearch(e.target.value);
            updateCoords();
            cancelClosing();
            setOpen(true);
          }}
          onBlur={() => setIsEditing(false)}
          placeholder={placeholder}
          style={compact ? { ...boxStyle, fontSize: 16 } : boxStyle}
          autoComplete="off"
        />
      ) : (
        <div
          ref={anchorRef}
          role="button"
          tabIndex={locked ? -1 : 0}
          onClick={openPicker}
          onKeyDown={(e) => { if (!locked && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openPicker(); } }}
          style={{
            ...boxStyle,
            display: "flex", alignItems: "center",
            ...(value ? {} : { color: "var(--tA99B72)" }),
            cursor: locked ? "default" : "pointer",
          }}
        >
          <span style={compact ? { minWidth: 0, flex: 1, overflowWrap: "anywhere" } : { overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
            {value || placeholder}
          </span>
          {warningText && <WarningIcon text={warningText} style={{ marginLeft: compact ? 3 : 6 }} />}
        </div>
      )}
      {showSearchIcon && (
        <button type="button" aria-label="Type or search a name"
          onMouseDown={(e) => e.preventDefault()}
          onClick={startTyping}
          style={{
            position: "absolute", top: "50%", transform: "translateY(-50%)",
            right: hasMeta ? 34 : 8, width: 22, height: 22, borderRadius: "50%",
            border: "none", background: "transparent", color: "var(--tA99B72)",
            display: "flex", alignItems: "center", justifyContent: "center",
            cursor: "pointer", padding: 0,
          }}
        >
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="11" cy="11" r="7" />
            <line x1="16.65" y1="16.65" x2="21" y2="21" />
          </svg>
        </button>
      )}
      {hasMeta && <LastChangedBadge meta={meta} anchorRef={anchorRef} />}
      {(open || closing) && !locked && popupData.filtered.length > 0 && popupData.coords && ReactDOM.createPortal(
        <div ref={popupRef}
          className={
            "no-print suggest-popup-anim " +
            (popupData.coords.top != null ? "suggest-popup-below " : "suggest-popup-above ") +
            (open ? "suggest-popup-in" : "suggest-popup-out")
          }
          style={{
            ...styles.suggestPopup,
            left: popupData.coords.left, width: popupData.coords.width, maxHeight: popupData.coords.maxHeight,
            ...(popupData.coords.top != null ? { top: popupData.coords.top, bottom: "auto" } : { bottom: popupData.coords.bottom, top: "auto" }),
          }}>
          {(popupTitle || compact) && (
            <div style={{ padding: "9px 14px 8px", borderBottom: "1px solid rgba(255,255,255,0.16)", color: "var(--tC9D5EE)", fontSize: 12, lineHeight: 1.35, fontFamily: "system-ui, sans-serif" }}>
              {popupTitle && <div style={{ fontWeight: 600, letterSpacing: 0.2 }}>{popupTitle}</div>}
              {compact && hasMetaInfo(meta) && (
                <div style={{ fontStyle: "italic", opacity: 0.85, marginTop: 2 }}>
                  Last changed by {meta.by}{metaTimeText(meta) ? ` · ${metaTimeText(meta)}` : ""}
                </div>
              )}
              {compact && isTouchDevice && !isEditing && (
                <button type="button"
                  onMouseDown={(e) => e.preventDefault()}
                  onClick={startTyping}
                  style={{ marginTop: 6, padding: "5px 10px", border: "none", borderRadius: 6, background: "rgba(255,255,255,0.14)", color: "var(--tEDF1FA)", fontSize: 12, fontFamily: "system-ui, sans-serif", cursor: "pointer" }}>
                  ✎ Type a name instead
                </button>
              )}
            </div>
          )}
          {popupData.filtered.map((v, i) => (
            <div key={v} className="volunteer-suggest-item"
              style={{ ...styles.suggestItem, borderTop: i === 0 ? "none" : "1px solid rgba(255,255,255,0.16)" }}
              onMouseDown={(e) => { e.preventDefault(); pick(v); }}>
              {v}
            </div>
          ))}
        </div>,
        document.body
      )}
    </div>
  );
}

// Small pulsing warning icon shown beside a name that's already booked for
// another role on the same team — replaces the old always-visible "Also
// serving as X on this team" text. Tap or hover to see which role.
function WarningIcon({ text, style }) {
  const [show, setShow] = useState(false);
  const [coords, setCoords] = useState(null);
  const [shiftX, setShiftX] = useState(0);
  const btnRef = useRef(null);
  const tooltipRef = useRef(null);

  const updateCoords = useCallback(() => {
    const el = btnRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    setCoords({ top: rect.bottom + 6, left: rect.left });
  }, []);

  useEffect(() => {
    if (!show) return;
    updateCoords();
    window.addEventListener("scroll", updateCoords, true);
    window.addEventListener("resize", updateCoords);
    return () => {
      window.removeEventListener("scroll", updateCoords, true);
      window.removeEventListener("resize", updateCoords);
    };
  }, [show, updateCoords]);

  useEffect(() => {
    if (!show || !coords || !tooltipRef.current) { setShiftX(0); return; }
    const margin = 8;
    const rect = tooltipRef.current.getBoundingClientRect();
    let shift = 0;
    if (rect.right > window.innerWidth - margin) shift -= (rect.right - (window.innerWidth - margin));
    if (rect.left + shift < margin) shift += (margin - (rect.left + shift));
    setShiftX(shift);
  }, [show, coords]);

  return (
    <React.Fragment>
      <button
        type="button"
        ref={btnRef}
        aria-label={text}
        onMouseDown={(e) => { e.preventDefault(); e.stopPropagation(); updateCoords(); setShow(true); }}
        onMouseUp={(e) => { e.preventDefault(); e.stopPropagation(); setShow(false); }}
        onMouseLeave={() => setShow(false)}
        onTouchStart={(e) => { e.preventDefault(); e.stopPropagation(); updateCoords(); setShow(true); }}
        onTouchEnd={(e) => { e.preventDefault(); e.stopPropagation(); setShow(false); }}
        onTouchCancel={() => setShow(false)}
        onClick={(e) => { e.preventDefault(); e.stopPropagation(); }}
        onContextMenu={(e) => e.preventDefault()}
        style={{ ...styles.warnIconBtn, ...(style || {}) }}>     
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C24A3A" strokeWidth="2.3" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12 3.5 L22 20.5 H2 Z" />
          <line x1="12" y1="9.5" x2="12" y2="14" />
          <circle cx="12" cy="17.2" r="0.6" fill="#C24A3A" stroke="none" />
        </svg>
      </button>
      {show && coords && ReactDOM.createPortal(
        <div ref={tooltipRef} className="no-print" style={{
          position: "fixed", top: coords.top, left: coords.left, zIndex: 2100001,
          background: "#2A2620", color: "#F6F1E4", fontSize: 12, fontStyle: "italic",
          fontFamily: "system-ui, sans-serif", padding: "6px 10px", borderRadius: 6,
          maxWidth: 240, boxShadow: "0 6px 14px rgba(0,0,0,0.25)", pointerEvents: "none",
          transform: `translateX(${shiftX}px)`,
        }}>
          {text}
        </div>,
        document.body
      )}
    </React.Fragment>
  );
}

function ServiceInfoView({ monthState, updateMonthState, week, slot, year, month, locked, userName }) {
  const [confirmOpen, setConfirmOpen] = useState(false);
  const key = serviceInfoKey(week, slot);
  const info = (monthState.serviceInfo && monthState.serviceInfo[key]) || { series: "", topic: "", verse: "", announcements: "", headcountVolunteer: "", headcountAdult: "", headcountKids: "" };
  const editMeta = monthState.editMeta || {};
  const fieldMeta = (field) => editMeta[key + "__" + field] || null;

  const setField = (field, value) => {
    if (locked) return;
    updateMonthState((prev) => {
      const nextEditMeta = withEditMeta({ ...(prev.editMeta || {}) }, key + "__" + field, userName);
      return {
        ...prev,
        serviceInfo: {
          ...(prev.serviceInfo || {}),
          [key]: { ...info, [field]: value },
        },
        editMeta: nextEditMeta,
      };
    });
  };

  const lockedStyle = locked ? { background: "var(--bF3EFE2)", cursor: "default" } : {};

  const INFO_FIELDS = ["series", "topic", "verse", "announcements", "headcountVolunteer", "headcountAdult", "headcountKids"];
  const hasAnyValue = INFO_FIELDS.some((f) => norm(info[f]));
  const confirmClearAll = () => {
    setConfirmOpen(false);
    if (locked) return;
    updateMonthState((prev) => {
      const nextServiceInfo = { ...(prev.serviceInfo || {}) };
      delete nextServiceInfo[key];
      let nextEditMeta = { ...(prev.editMeta || {}) };
      INFO_FIELDS.forEach((f) => {
        nextEditMeta = withEditMeta(nextEditMeta, key + "__" + f, userName);
      });
      return { ...prev, serviceInfo: nextServiceInfo, editMeta: nextEditMeta };
    });
  };

  return (
    <div style={styles.viewWrap}>
      <header style={styles.viewHeader}>
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
          <h1 style={styles.h1}>Service Details</h1>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            {!locked && (
              <button onClick={() => hasAnyValue && setConfirmOpen(true)} disabled={!hasAnyValue}
                style={{ ...styles.smallBtn, background: "var(--bA6402F)", opacity: hasAnyValue ? 1 : 0.45, cursor: hasAnyValue ? "pointer" : "default" }}>
                Clear all
              </button>
            )}
            <ThemeToggle className="theme-toggle-view" />
          </div>
        </div>
        <div style={styles.viewMeta}>
          {weekDisplayLabel(week, monthState.weekLabels, year, month)} · {slot}
          {locked && <span style={styles.flexTag}>view only — only Service Lead editors can change this</span>}
        </div>
      </header>
      <div style={styles.rolesCard}>
        <div style={{ padding: 20, display: "flex", flexDirection: "column", gap: 16 }}>
          <div>
            <div style={styles.fieldLabel}>Series Name</div>
            <TextFieldWithMeta value={info.series || ""} onChange={(v) => setField("series", v)}
              placeholder="e.g. Rooted" locked={locked} meta={fieldMeta("series")} style={{ ...styles.input, ...lockedStyle }} />
          </div>
          <div>
            <div style={styles.fieldLabel}>Topic</div>
            <TextFieldWithMeta value={info.topic || ""} onChange={(v) => setField("topic", v)}
              placeholder="e.g. Faith that acts" locked={locked} meta={fieldMeta("topic")} style={{ ...styles.input, ...lockedStyle }} />
          </div>
          <div>
            <div style={styles.fieldLabel}>Verse</div>
            <TextFieldWithMeta value={info.verse || ""} onChange={(v) => setField("verse", v)}
              placeholder="e.g. James 2:14-17" locked={locked} meta={fieldMeta("verse")} style={{ ...styles.input, ...lockedStyle }} />
          </div>
          <div>
            <div style={styles.fieldLabel}>Announcements</div>
            <TextFieldWithMeta value={info.announcements || ""} onChange={(v) => setField("announcements", v)}
              placeholder="Anything to announce this service…" locked={locked} meta={fieldMeta("announcements")}
              multiline rows={5} align="top"
              style={{ ...styles.input, ...lockedStyle, resize: "vertical", fontFamily: "system-ui, sans-serif" }} />
          </div>
          <div>
            <div style={styles.fieldLabel}>Head count (for the print sheet)</div>
            <div style={{ display: "flex", gap: 10 }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 11.5, color: "var(--t8A7F5E)", marginBottom: 4, fontFamily: "system-ui, sans-serif" }}>Volunteers</div>
                <TextFieldWithMeta value={info.headcountVolunteer || ""} onChange={(v) => setField("headcountVolunteer", v)}
                  inputMode="numeric" locked={locked} meta={fieldMeta("headcountVolunteer")} style={{ ...styles.input, ...lockedStyle }} />
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 11.5, color: "var(--t8A7F5E)", marginBottom: 4, fontFamily: "system-ui, sans-serif" }}>Adults</div>
                <TextFieldWithMeta value={info.headcountAdult || ""} onChange={(v) => setField("headcountAdult", v)}
                  inputMode="numeric" locked={locked} meta={fieldMeta("headcountAdult")} style={{ ...styles.input, ...lockedStyle }} />
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 11.5, color: "var(--t8A7F5E)", marginBottom: 4, fontFamily: "system-ui, sans-serif" }}>Kids</div>
                <TextFieldWithMeta value={info.headcountKids || ""} onChange={(v) => setField("headcountKids", v)}
                  inputMode="numeric" locked={locked} meta={fieldMeta("headcountKids")} style={{ ...styles.input, ...lockedStyle }} />
              </div>
            </div>
          </div>
        </div>
      </div>
      {confirmOpen && (
        <ClearNamesModal
          teamName="Service Details"
          title="Clear Service Details"
          body="This will remove the series name, topic, verse, announcements and head counts for this service."
          note="Only this service's details will be affected. Volunteer names in the ministry tabs stay untouched."
          warning="This cannot be undone. Please make sure you're on the right service before continuing."
          confirmLabel="Yes, Clear Details"
          onCancel={() => setConfirmOpen(false)}
          onConfirm={confirmClearAll}
        />
      )}
    </div>
  );
}

// Vertical middle (as a 0-1 fraction of the sheet's height) of the space
// between the first and last divider rows ("START OF ..." / "END OF ...").
// Returns null if the sheet has fewer than two dividers.
function dividerMidRatio(sheetEl) {
  if (!sheetEl) return null;
  const rows = sheetEl.querySelectorAll("tr[data-divider]");
  if (rows.length < 2) return null;
  const sr = sheetEl.getBoundingClientRect();
  if (!sr.height) return null;
  const a = rows[0].getBoundingClientRect();
  const b = rows[rows.length - 1].getBoundingClientRect();
  return ((a.bottom + b.top) / 2 - sr.top) / sr.height;
}

// header text for the notes column at the far right
const PRINT_EXTRA_COL_LABEL = "Notes";

// same label/value split for every box under the program table
const SHEET_BOX_LABEL_WIDTH = "58%";

function MasterListView({ config, monthState, updateMonthState, week, slot, year, month }) {
  const [view, setView] = useState("list");
  const [search, setSearch] = useState("");
  const [exporting, setExporting] = useState(null); // null | "image" | "pdf"
  const sheetRef = useRef(null);
  const wmImgRef = useRef(null);

  // Phones/tablets get the native share sheet (Messenger, WhatsApp, etc. are
  // registered there); desktop/laptop browsers mostly aren't registered with
  // any chat apps as share targets, so there we skip straight to a normal
  // file download that the user can then attach wherever they like.
  const isMobileDevice = () =>
    /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (navigator.userAgentData && navigator.userAgentData.mobile);

  // Turns a Blob into either the device's native share sheet (so it can be
  // sent straight to Messenger/a group chat) or, if sharing files isn't
  // supported, a plain file download as a fallback.
  const shareOrDownloadBlob = useCallback(async (blob, filename, mimeType) => {
    try {
      const file = new File([blob], filename, { type: mimeType });
      if (isMobileDevice() && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return;
      }
    } catch (err) {
      if (err && err.name === "AbortError") return; // user cancelled the share sheet
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }, []);

  const exportSheet = useCallback(async (kind, sheetLabel) => {
    const source = sheetRef.current;
    if (!source || !window.html2canvas || exporting) return;
    setExporting(kind);
    let wrapper = null;
    try {
      // Render a real, detached copy of the sheet at a fixed "desktop" width
      // — actually laid out by the browser itself (not a virtual clone deep
      // inside html2canvas), so column proportions come out exactly like a
      // real desktop view/print, never squeezed or oddly stretched. It's
      // parked off-screen so the user's own on-screen view never flickers.
      const CAPTURE_SCALE = 2; // pixel-density multiplier for a crisp raster
      const CONTENT_W = 740; // css px matching the printable width on a letter page
      const clone = source.cloneNode(true);
      clone.style.zoom = "1"; // in case the live sheet was mid print-shrink
      clone.style.width = `${CONTENT_W}px`;
      clone.style.margin = "0";
      // The table is stretched to fill the page below, but the watermark
      // logo must NOT be stretched with it. So it's left out of this capture
      // and drawn separately (at its natural proportions) on the final page.
      clone.style.background = "transparent";
      const wmEl = clone.querySelector(".print-sheet-watermark");
      if (wmEl) wmEl.style.visibility = "hidden";
      wrapper = document.createElement("div");
      wrapper.style.position = "fixed";
      wrapper.style.top = "0";
      wrapper.style.left = "-99999px";
      wrapper.appendChild(clone);
      document.body.appendChild(wrapper);
      // Two animation frames make sure the browser has actually laid out
      // and painted the clone (and the watermark image) before we shoot it.
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      // Where the middle of START..END falls on the sheet (0-1), measured on
      // the clone before it's stretched to the page.
      const wmMidRatio = dividerMidRatio(clone);

      const rawCanvas = await window.html2canvas(clone, {
        scale: CAPTURE_SCALE,
        backgroundColor: null,
        useCORS: true,
      });
      document.body.removeChild(wrapper);
      wrapper = null;

      // Load the watermark so it can be drawn with its real aspect ratio.
      const wmImg = await new Promise((resolve) => {
        const im = new Image();
        im.onload = () => resolve(im);
        im.onerror = () => resolve(null);
        im.src = "./icons/VictoryWatermark.png";
      });

      // Compose the raster onto a white "sheet of paper" that is always
      // exactly US Letter size at 300 DPI (2550x3300px), with the same
      // 0.35in margins the print stylesheet uses. The table is stretched
      // to exactly fill the printable area (both width and height), so it
      // always fits the page edge-to-edge instead of leaving blank space
      // above/below when it's shorter than a full page.
      const DPI = 300;
      const pageW = Math.round(8.5 * DPI); // 2550
      const pageH = Math.round(11 * DPI); // 3300
      const margin = Math.round(0.35 * DPI);
      const usableW = pageW - margin * 2;
      const usableH = pageH - margin * 2;
      const drawW = usableW;
      const drawH = usableH;
      const drawX = margin;
      const drawY = margin;

      const canvas = document.createElement("canvas");
      canvas.width = pageW;
      canvas.height = pageH;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, pageW, pageH);
      // Watermark first (behind the table), centered in the printable area,
      // smaller than on screen (31.7% of page width, max 238 of 740 css px) and
      // keeping its natural width:height ratio — never stretched.
      if (wmImg && wmImg.naturalWidth && wmImg.naturalHeight) {
        const wmW = Math.min(0.317 * drawW, (238 / CONTENT_W) * drawW);
        const wmH = wmW * (wmImg.naturalHeight / wmImg.naturalWidth);
        ctx.save();
        ctx.globalAlpha = 0.5;
        const wmCenterY = drawY + (wmMidRatio == null ? 0.46 : wmMidRatio) * drawH;
        ctx.drawImage(wmImg, drawX + (drawW - wmW) / 2, wmCenterY - wmH / 2, wmW, wmH);
        ctx.restore();
      }
      ctx.drawImage(rawCanvas, drawX, drawY, drawW, drawH);

      const safeName = sheetLabel.replace(/[\\/:*?"<>|]/g, "").trim();
      if (kind === "image") {
        await new Promise((resolve) => {
          canvas.toBlob(async (blob) => {
            if (blob) await shareOrDownloadBlob(blob, `${safeName}.png`, "image/png");
            resolve();
          }, "image/png");
        });
      } else {
        const { jsPDF } = window.jspdf;
        const imgData = canvas.toDataURL("image/jpeg", 0.95);
        const pdf = new jsPDF({ orientation: "portrait", unit: "px", format: [pageW / CAPTURE_SCALE, pageH / CAPTURE_SCALE] });
        pdf.addImage(imgData, "JPEG", 0, 0, pageW / CAPTURE_SCALE, pageH / CAPTURE_SCALE);
        await shareOrDownloadBlob(pdf.output("blob"), `${safeName}.pdf`, "application/pdf");
      }
    } catch (err) {
      if (wrapper && wrapper.parentNode) wrapper.parentNode.removeChild(wrapper);
      console.error(err);
      alert("Hindi na-export. Subukan muli.");
    }
    setExporting(null);
  }, [exporting, shareOrDownloadBlob]);

  // The run sheet's content (main table + side blocks + head count) can be
  // taller than a single printed page once a lot of rows/overrides are in
  // play. Rather than let the browser split it across two pages, shrink the
  // whole sheet down to fit one page's printable area right before printing
  // (both the in-app Print button and Ctrl+P trigger the same browser print
  // flow, so listening for window's print events covers both), then restore
  // it to full size afterward so the on-screen view is unaffected.
  // Keep the watermark vertically centered between the START and END
  // divider rows (it's placed by percentage, so print zoom doesn't affect it).
  const placeWatermark = useCallback(() => {
    const img = wmImgRef.current;
    if (!img) return;
    const r = dividerMidRatio(sheetRef.current);
    img.style.top = r == null ? "46%" : `${(r * 100).toFixed(2)}%`;
  }, []);
  useEffect(() => { if (view === "print") placeWatermark(); });
  useEffect(() => {
    if (view !== "print") return;
    let ro = null;
    if (window.ResizeObserver && sheetRef.current) {
      ro = new ResizeObserver(placeWatermark);
      ro.observe(sheetRef.current);
    }
    const mq = window.matchMedia ? window.matchMedia("print") : null;
    window.addEventListener("beforeprint", placeWatermark);
    window.addEventListener("afterprint", placeWatermark);
    if (mq && mq.addEventListener) mq.addEventListener("change", placeWatermark);
    return () => {
      if (ro) ro.disconnect();
      window.removeEventListener("beforeprint", placeWatermark);
      window.removeEventListener("afterprint", placeWatermark);
      if (mq && mq.removeEventListener) mq.removeEventListener("change", placeWatermark);
    };
  }, [view, placeWatermark]);

  useEffect(() => {
    if (view !== "print") return;
    const applyPrintScale = () => fitSheetToOnePage(sheetRef.current);
    const resetPrintScale = () => resetSheetFit(sheetRef.current);
    window.addEventListener("beforeprint", applyPrintScale);
    window.addEventListener("afterprint", resetPrintScale);
    return () => {
      window.removeEventListener("beforeprint", applyPrintScale);
      window.removeEventListener("afterprint", resetPrintScale);
    };
  }, [view]);

  const rows = [];
  config.teams.forEach((team) => {
    team.roles.forEach((role) => {
      const key = assignKey(week, slot, team.id, role.id);
      const name = monthState.assignments[key] || "";
      const verse = (monthState.verses && monthState.verses[key]) || "";
      const checked = !!(monthState.checks && monthState.checks[key]);
      const issues = name ? findIssues(config, monthState, week, slot, team.id, role.id, name) : [];
      const meta = (monthState.editMeta && monthState.editMeta[key]) || null;
      rows.push({ key, team, role, name, verse, checked, issues, meta });
    });
  });
  const filled = rows.filter((r) => r.name).length;
  const infoKey = serviceInfoKey(week, slot);
  const info = (monthState.serviceInfo && monthState.serviceInfo[infoKey]) || {};
  const printSettings = config.printSettings || {};
  const dateLabel = weekDisplayLabel(week, monthState.weekLabels, year, month);

  // Search filters (and highlights) rows by team, role, or volunteer name
  // so a long list is quick to scan once there are a lot of volunteers.
  const searchQuery = norm(search);
  const searchLower = searchQuery.toLowerCase();
  const filteredRows = searchQuery
    ? rows.filter((r) =>
        r.team.name.toLowerCase().includes(searchLower) ||
        r.role.name.toLowerCase().includes(searchLower) ||
        r.name.toLowerCase().includes(searchLower))
    : rows;

  // Grouped by team for the simplified mobile card view — avoids repeating
  // "TEAM: Service Lead" on every single line, which is what made the
  // stacked mobile table hard to scan, and lets each team render as its
  // own card. Rows are already produced team-by-team above, so a new
  // section starts whenever the team changes.
  const teamSections = [];
  filteredRows.forEach((r) => {
    const current = teamSections[teamSections.length - 1];
    if (!current || current.team.id !== r.team.id) {
      teamSections.push({ team: r.team, rows: [r] });
    } else {
      current.rows.push(r);
    }
  });

  const toggleCheck = (key) => {
    updateMonthState((prev) => {
      const nextChecks = { ...(prev.checks || {}) };
      if (nextChecks[key]) delete nextChecks[key];
      else nextChecks[key] = true;
      return { ...prev, checks: nextChecks };
    });
  };

  if (view === "print") {
    const total = [info.headcountVolunteer, info.headcountAdult, info.headcountKids]
      .map((v) => parseInt(v, 10))
      .filter((n) => !isNaN(n))
      .reduce((a, b) => a + b, 0);
    const program = config.printProgram || defaultPrintProgram();
    const timeOffset = slotOffsetMinutes(slot);

    const setCustomValue = (rowId, value) => {
      updateMonthState((prev) => {
        const next = { ...(prev.customValues || {}) };
        const cvKey = `${week}|${slot}|${rowId}`;
        if (norm(value)) next[cvKey] = value;
        else delete next[cvKey];
        return { ...prev, customValues: next };
      });
    };

    // one merged notes cell down the whole table, goes in the first body row
    const bodyRowCount = program.sections.reduce((n, sec) => n + (sec.kind === "divider" ? 1 : (sec.rows || []).filter((row) => rowVisibleForWeek(row, week)).length), 0);
    // "merge volunteer with row above" can go across sections; a divider band breaks it
    // ...but only when it is ticked AND the name is the same as the row above; different names stay separate
    const volMerge = {};
    let volHeadId = null;
    let volHeadValue = "";
    program.sections.forEach((sec) => {
      if (sec.kind === "divider") { volHeadId = null; volHeadValue = ""; return; }
      (sec.rows || []).filter((row) => rowVisibleForWeek(row, week)).forEach((row) => {
        const rowValue = normKey(resolvePrintRow(config, monthState, week, slot, row).value);
        if (row.mergeVolAbove && volHeadId && rowValue && rowValue === volHeadValue) {
          volMerge[row.id] = { start: false, span: 0 };
          volMerge[volHeadId].span++;
          if (row.checkbox) volMerge[volHeadId].checkbox = true;
        } else {
          volHeadId = row.id;
          volHeadValue = rowValue;
          volMerge[row.id] = { start: true, span: 1, checkbox: !!row.checkbox };
        }
      });
    });
    let notesPlaced = false;
    const takeNotesCell = () => {
      if (notesPlaced || bodyRowCount === 0) return null;
      notesPlaced = true;
      return <td key="notes" rowSpan={bodyRowCount} style={styles.sheetTd}></td>;
    };

    const VolunteerCell = ({ row }) => {
      const r = resolvePrintRow(config, monthState, week, slot, row);
      const hasConflict = r.issues.some((x) => x.type === "Schedule Conflict");
      const hasDup = r.issues.some((x) => x.type === "duplicate");
      if (r.editable) {
        return (
          <input className="no-print-interactive" value={r.value} onChange={(e) => setCustomValue(row.id, e.target.value)}
            placeholder="—" style={{ width: "100%", boxSizing: "border-box", border: "none", background: "transparent", fontSize: 11.5, fontFamily: "system-ui, sans-serif", outline: "none" }} />
        );
      }
      return (
        <span style={{ color: hasConflict ? "var(--t8C2F22)" : hasDup ? "var(--t8A6A1A)" : "inherit", fontWeight: hasConflict || hasDup ? 700 : 400 }}>
          {r.value || ""}
        </span>
      );
    };

    return (
      <div className="print-sheet-wrap" style={styles.viewWrap}>
        <div className="no-print sheet-toolbar">
          <button onClick={() => setView("list")} style={{ ...styles.smallBtn, whiteSpace: "normal" }}>← Back to list view</button>
          <button onClick={() => window.print()} style={{ ...styles.smallBtn, background: "var(--bA9782F)", whiteSpace: "normal" }}>🖨 Print</button>
          <button onClick={() => exportSheet("image", `Master List - ${dateLabel} - ${slot}`)} disabled={!!exporting}
            style={{ ...styles.smallBtn, background: "var(--b2F4858)", opacity: exporting && exporting !== "image" ? 0.6 : 1, whiteSpace: "normal" }}>
            {exporting === "image" ? "Ginagawa…" : "🖼 Save as Image"}
          </button>
          <button onClick={() => exportSheet("pdf", `Master List - ${dateLabel} - ${slot}`)} disabled={!!exporting}
            style={{ ...styles.smallBtn, background: "var(--b2F4858)", opacity: exporting && exporting !== "pdf" ? 0.6 : 1, whiteSpace: "normal" }}>
            {exporting === "pdf" ? "Ginagawa…" : "📄 Save as PDF"}
          </button>
        </div>
        <div className="sheet-scroll">
        <div className="print-sheet paper" style={styles.sheet} ref={sheetRef}>
          <div className="print-sheet-watermark" style={styles.sheetWatermark} aria-hidden="true">
            <img ref={wmImgRef} src="./icons/VictoryWatermark.png" alt="" style={styles.sheetWatermarkImg} />
          </div>
          <div style={styles.sheetInner}>
          <div style={styles.sheetBannerMain}>{(printSettings.campus || "VICTORY ALFONSO").toUpperCase()}</div>
          <div style={styles.sheetBannerSub}>
            {["SUNDAY SERVICE", callTimeForSlot(printSettings, slot) && `CALLTIME: ${callTimeForSlot(printSettings, slot)}`, `TIME: ${slot}`].filter(Boolean).join(" | ")}
          </div>
          {info.series && <div style={styles.sheetBannerBold}>{info.series.toUpperCase()}</div>}
          {(info.topic || info.verse) && <div style={styles.sheetBannerLight}>{[info.topic, info.verse].filter(Boolean).join("   ")}</div>}
          <div style={styles.sheetBannerSub}>{dateLabel}</div>

          <table style={{ ...styles.sheetTable, tableLayout: "fixed" }}>
            <colgroup>
              <col style={{ width: "13%" }} />
              <col style={{ width: "17%" }} />
              <col style={{ width: "25%" }} />
              <col style={{ width: "20%" }} />
              <col style={{ width: "4%" }} />
              <col style={{ width: "21%" }} />
            </colgroup>
            <thead>
              <tr>
                <th style={styles.sheetTh}>Time</th>
                <th style={styles.sheetTh}>Program</th>
                <th style={styles.sheetTh}>Task</th>
                <th style={styles.sheetTh}>Volunteer(s)</th>
                <th style={{ ...styles.sheetTh, width: 26 }}></th>
                <th style={styles.sheetTh}>{PRINT_EXTRA_COL_LABEL}</th>
              </tr>
            </thead>
            <tbody>
              {program.sections.map((section) => {
                if (section.kind === "divider") {
                  return (
                    <tr key={section.id} data-divider="1">
                      <td colSpan={5} style={styles.sheetBand}>{shiftDividerLabel(section.label, slot)}</td>
                      {takeNotesCell()}
                    </tr>
                  );
                }
                const visibleRows = (section.rows || []).filter((row) => rowVisibleForWeek(row, week));
                if (visibleRows.length === 0) return null;
                const extraLines = (section.programSubRoles || [])
                  .map((tag) => resolveRoleTagValue(config, monthState, week, slot, tag))
                  .filter((v) => norm(v));

                const timings = visibleRows.map((r) => resolveRowTiming(r, week, slot, timeOffset));
                const isBlankTiming = (t) => !norm(t.time) && !norm(t.duration);


                return visibleRows.map((row, i) => {
                  const timing = timings[i];
                  // blank rows below get merged into this one's Time/Duration
                  const startsTimeGroup = i === 0 || !isBlankTiming(timing);
                  let timeSpan = 1;
                  while (startsTimeGroup && i + timeSpan < visibleRows.length && isBlankTiming(timings[i + timeSpan])) timeSpan++;
                  const verseText = resolveRowVerse(config, monthState, week, slot, row, program);
                  const volInfo = volMerge[row.id] || { start: true, span: 1 };
                  const startsVolGroup = volInfo.start;
                  const volSpan = volInfo.span;
                  return (
                    <tr key={row.id}>
                      {startsTimeGroup && (
                        <td rowSpan={timeSpan} style={styles.sheetTd}>
                          <div style={{ whiteSpace: "nowrap", fontVariantNumeric: "tabular-nums", fontSize: 10 }}>{timing.time}</div>
                          {norm(timing.duration) && <div style={{ marginTop: 2, color: "var(--t1F3864)", fontWeight: 700 }}>{timing.duration}</div>}
                        </td>
                      )}
                      {i === 0 && (
                        <td rowSpan={visibleRows.length} style={{ ...styles.sheetTd, fontWeight: 700, verticalAlign: "middle", whiteSpace: "pre-wrap" }}>
                          {section.program || ""}
                          {extraLines.length > 0 && (
                            <div style={{ fontWeight: 400, fontSize: 10.5, marginTop: 4 }}>
                              {extraLines.map((v, idx) => <div key={idx}>{v}</div>)}
                            </div>
                          )}
                        </td>
                      )}
                      <td style={styles.sheetTd}>
                        {row.task || ""}
                        {verseText && (
                          <div style={{ fontWeight: 400, fontStyle: "italic", fontSize: 10.5, marginTop: 3, color: "var(--t3B5A8A)" }}>{verseText}</div>
                        )}
                      </td>
                      {startsVolGroup && (
                        <td rowSpan={volSpan} style={volSpan > 1 ? { ...styles.sheetTd, verticalAlign: "middle", textAlign: "left" } : styles.sheetTd}><VolunteerCell row={row} /></td>
                      )}
                      {startsVolGroup && (
                        <td rowSpan={volSpan} style={{ ...styles.sheetTd, textAlign: "center", verticalAlign: volSpan > 1 ? "middle" : undefined }}>
                          {volInfo.checkbox && (
                            <input className="no-print-interactive" type="checkbox" checked={!!(monthState.checks && monthState.checks[`custom:${row.id}`])}
                              onChange={() => toggleCheck(`custom:${row.id}`)} />
                          )}
                        </td>
                      )}
                      {takeNotesCell()}
                    </tr>
                  );
                });
              })}
            </tbody>
          </table>

          {/* same placement as the Events print: blocks alternate left/right, announcements + head count at the bottom right */}
          {(() => {
            const sideBlocks = program.sideBlocks || [];
            const renderSideBlock = (block) => (
              <div key={block.id} style={{ marginBottom: 14 }}>
                <div style={styles.sheetSectionHead}>{block.title}</div>
                <table style={{ ...styles.sheetTable, tableLayout: "fixed", width: "100%" }}>
                  <colgroup>
                    <col style={{ width: SHEET_BOX_LABEL_WIDTH }} />
                    <col />
                  </colgroup>
                  <tbody>
                    {(block.rows || []).map((row) => (
                      <tr key={row.id}>
                        <td style={styles.sheetTd}>{row.label}</td>
                        <td style={styles.sheetTd}><VolunteerCell row={row} /></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            );
            return (
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginTop: 14, alignItems: "start" }}>
                <div>
                  {sideBlocks.filter((_, i) => i % 2 === 0).map(renderSideBlock)}
                  {(program.soloRows || []).length > 0 && (
                    <div style={{ marginBottom: 14 }}>
                      <table style={{ ...styles.sheetTable, tableLayout: "fixed", width: "100%" }}>
                        <colgroup>
                          <col style={{ width: SHEET_BOX_LABEL_WIDTH }} />
                          <col />
                        </colgroup>
                        <tbody>
                          {program.soloRows.map((row) => (
                            <tr key={row.id}>
                              <td style={{ ...styles.sheetTd, background: "var(--b1F3864)", color: "#FFFFFF", fontWeight: 700 }}>{row.label.toUpperCase()}</td>
                              <td style={styles.sheetTd}><VolunteerCell row={row} /></td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                  <div>
                    <div style={styles.sheetSectionHead}>HEAD COUNT</div>

                      <colgroup>
                        <col style={{ width: SHEET_BOX_LABEL_WIDTH }} />

                        <tr><td style={styles.sheetTd}>Volunteer</td><td style={styles.sheetTd}>{info.headcountVolunteer || ""}</td></tr>
                        <tr><td style={styles.sheetTd}>Adult</td><td style={styles.sheetTd}>{info.headcountAdult || ""}</td></tr>
                        <tr><td style={styles.sheetTd}>Kids</td><td style={styles.sheetTd}>{info.headcountKids || ""}</td></tr>
                        <tr><td style={{ ...styles.sheetTd, fontWeight: 700 }}>Total</td><td style={{ ...styles.sheetTd, fontWeight: 700 }}>{total || ""}</td></tr>
                      </tbody>
                    </table>

                  {sideBlocks.filter((_, i) => i % 2 === 1).map(renderSideBlock)}
                  <div style={{ marginBottom: 14 }}>

                </div>
              </div>
            );

  return (

          {searchQuery && ` · ${filteredRows.length} match${filteredRows.length === 1 ? "" : "es"}`}
        </div>
        {rows.length > 0 && (
          <div style={styles.masterProgressTrack}>
            <div style={{ ...styles.masterProgressFill, width: `${fillPct}%` }} />

      <div style={{ marginBottom: 16, display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
        <button onClick={() => setView("print")} style={styles.smallBtn}>🖨 Print-friendly run sheet</button>
        <input type="text" value={search} onChange={(e) => setSearch(e.target.value)}
          placeholder="Search team, role, or volunteer…"
          style={{ ...styles.toolbarInput, width: 240 }} />
        {searchQuery && (
          <button onClick={() => setSearch("")} style={styles.ghostBtn}>Clear</button>
        )}
      </div>
      {hasInfo && (
        <div style={{ ...styles.masterInfoCard, marginBottom: 16 }}>
          {infoItems.map((item, i) => (
            <div key={item.label} style={i === infoItems.length - 1 ? { ...styles.masterInfoItem, borderBottom: "none", paddingBottom: 0 } : styles.masterInfoItem}>
              <div style={styles.masterInfoLabel}>{item.label}</div>
              <div style={styles.masterInfoValue}>{item.value}</div>
            </div>
          ))}
        </div>
      )}

      <div className="master-outer" style={styles.masterCard}>
        <div className="master-table-wrap">
          <table style={styles.table} className="responsive-table">
            <thead>
              <tr>
                <th style={styles.th}>Team</th>

            <tbody>
              {filteredRows.length === 0 && (
                <tr><td colSpan={5} style={styles.emptyNote}>No teams, roles, or volunteers match "{searchQuery}".</td></tr>

              {filteredRows.map((r, idx) => {
                const hasConflict = r.issues.some((x) => x.type === "Schedule Conflict");
                const hasDup = r.issues.some((x) => x.type === "duplicate");
                return (
                  <tr key={r.key} className="master-row" style={{ background: hasConflict ? "var(--bFBE9E5)" : hasDup ? "var(--bFBF3DC)" : idx % 2 === 0 ? "var(--bFFFFFF)" : "var(--bFAF6EA)" }}>
                    <td style={styles.td} data-label="Team">{searchQuery ? highlightMatch(r.team.name, searchQuery) : r.team.name}</td>
                    <td style={styles.td} data-label="Role">{searchQuery ? highlightMatch(r.role.name, searchQuery) : r.role.name}</td>
                    <td style={{ ...styles.td, fontWeight: r.name ? 600 : 400 }} data-label="Volunteer">
                      <span style={r.name && hasConflict ? styles.nameConflict : r.name && hasDup ? styles.nameDup : undefined}>
                        {r.name ? (searchQuery ? highlightMatch(r.name, searchQuery) : r.name) : <span style={styles.tdMuted}>— open —</span>}

                        : <span style={styles.tdMuted}>—</span>}

        </div>

        <div className="master-cards" style={styles.masterSectionWrap}>
          {teamSections.length === 0 && (
            <div style={styles.emptyNote}>No teams, roles, or volunteers match "{searchQuery}".</div>

            <div key={section.team.id} style={styles.masterSection}>
