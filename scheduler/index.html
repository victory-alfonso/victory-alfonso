              {section.rows.map((r, i) => {
                const hasConflict = r.issues.some((x) => x.type === "Schedule Conflict");
                const hasDup = r.issues.some((x) => x.type === "duplicate");
                const isLast = i === section.rows.length - 1;
                return (
                  <div key={r.key} className="mc-row" style={{ ...styles.mcRow, borderBottom: isLast ? "none" : "1px solid var(--lF1EBDA)", background: i % 2 === 1 ? "var(--bFCFAF3)" : "var(--bFFFFFF)" }}>
                    <div style={styles.mcRoleCol}>
                      <div style={styles.mcRoleName}>{searchQuery ? highlightMatch(r.role.name, searchQuery) : r.role.name}</div>
                      {r.role.hasVerse && r.verse && <div style={styles.mcVerse}>{r.verse}</div>}
                      {hasConflict && <div style={styles.mcStatusNote}><span style={styles.badgeConflict}>Schedule Conflict</span></div>}
                      {!hasConflict && hasDup && <div style={styles.mcStatusNote}><span style={styles.badgeDup}>Duplicate</span></div>}
                    </div>
                    <div style={{ ...styles.mcVolunteer, color: r.name ? "var(--t2A2620)" : "var(--tB0A582)", fontWeight: r.name ? 600 : 400 }}>
                      <span style={r.name && hasConflict ? styles.nameConflict : r.name && hasDup ? styles.nameDup : undefined}>
                        {r.name ? (searchQuery ? highlightMatch(r.name, searchQuery) : r.name) : <span style={styles.mcOpen}>— open —</span>}
                        <MasterEditInfo meta={r.meta} />
                      </span>
                    </div>
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// Read-only view for any signed-in user (no editor/team access needed):
// scans every week/slot/team/role in the currently selected month and
// shows just the rows where the assigned volunteer's name matches this
// user's own name, grouped by week/date. Lets a non-editor find their
// own assignments without having to click through Master List one
// week+slot at a time.
function MyScheduleView({ config, monthState, userName, year, month, partial }) {
  // Some assignments are typed as a nickname the login name doesn't cover
  // (e.g. logged in as "Eduardo Cruz" but the sheet says "Jun"). This lets
  // each person add their own alias, saved locally on this device/browser
  // only (no Firebase write access needed, so it works even without editor
  // rights) so "My Schedule" can also catch those rows.
  const aliasStorageKey = `ministry-scheduler-alias-${normKey(userName)}`;
  const [alias, setAlias] = useState(() => {
    try { return localStorage.getItem(aliasStorageKey) || ""; } catch (e) { return ""; }
  });
  useEffect(() => {
    try { localStorage.setItem(aliasStorageKey, alias); } catch (e) { /* ignore */ }
  }, [alias, aliasStorageKey]);

  const myNames = [userName, alias].map(norm).filter(Boolean);
  const matchesMe = (assignedName) => myNames.some((n) =>
    (partial ? namePrefixMatch(assignedName, n) : false) || namesLikelyMatch(assignedName, n));

  const weeksData = WEEKS.map((week) => {
    const dateLabel = weekDisplayLabel(week, monthState.weekLabels, year, month);
    const slots = SLOTS.map((slot) => {
      const matches = [];
      config.teams.forEach((team) => {
        team.roles.forEach((role) => {
          const key = assignKey(week, slot, team.id, role.id);
          const name = monthState.assignments[key] || "";
          if (name && matchesMe(name)) {
            const issues = findIssues(config, monthState, week, slot, team.id, role.id, name);
            matches.push({ team, role, name, issues });
          }
        });
      });
      return { slot, matches };
    }).filter((s) => s.matches.length > 0);
    return { week, dateLabel, slots };
  }).filter((w) => w.slots.length > 0);

  const totalAssignments = weeksData.reduce(
    (sum, w) => sum + w.slots.reduce((s2, sl) => s2 + sl.matches.length, 0), 0
  );

  return (
    <div style={styles.viewWrap}>
      <header style={styles.viewHeader}>
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12 }}>
          <h1 style={styles.h1}>My Schedule</h1>
          <ThemeToggle className="theme-toggle-view" />
        </div>
        <div style={styles.viewMeta}>
          {monthLabel(year, month)} · {totalAssignments} assignment{totalAssignments === 1 ? "" : "s"}
        </div>
      </header>

      <div style={{ ...styles.lightCard, marginBottom: 16 }}>
        <div style={styles.fieldLabel}>Also called (nickname, optional)</div>
        <input type="text" value={alias} onChange={(e) => setAlias(e.target.value)}
          placeholder="e.g. Huwana, if that's how you're listed in the schedule"
          style={{ ...styles.input, maxWidth: 320 }} />
        <div style={{ ...styles.pairNote, marginTop: 8, marginBottom: 0 }}>
          Matches "{userName}" automatically — by first name or by surname alone, plus
          nickname-style entries. Add a nickname here if assignments use a name this
          doesn't catch. Saved only on this device.
        </div>
      </div>

      {weeksData.length === 0 ? (
        <div style={styles.masterCard}>
          <div style={styles.emptyNote}>No assignments found for you this month yet.</div>
        </div>
      ) : (
        weeksData.map((w) => (
          <div key={w.week} style={{ ...styles.masterCard, marginBottom: 16 }}>
            <div style={styles.sheetSectionHead}>{w.dateLabel}</div>
            <table style={styles.table}>
              <thead>
                <tr>
                  <th style={styles.th}>Service</th>
                  <th style={styles.th}>Team</th>
                  <th style={styles.th}>Role</th>
                  <th style={styles.th}>Listed as</th>
                  <th style={styles.th}>Status</th>
                </tr>
              </thead>
              <tbody>
                {w.slots.flatMap((sl) =>
                  sl.matches.map((m, idx) => {
                    const hasConflict = m.issues.some((x) => x.type === "Schedule Conflict");
                    const hasDup = m.issues.some((x) => x.type === "duplicate");
                    const exactMatch = myNames.some((n) => normKey(n) === normKey(m.name));
                    return (
                      <tr key={`${sl.slot}-${m.team.id}-${m.role.id}`}
                        style={{ background: hasConflict ? "var(--bFBE9E5)" : hasDup ? "var(--bFBF3DC)" : idx % 2 === 0 ? "var(--bFFFFFF)" : "var(--bFAF6EA)" }}>
                        <td style={styles.td}>{m.team.thursday ? `${nthThursday(year, month, w.week) ? thursdayLabel(nthThursday(year, month, w.week)) : "Thursday"} · ${prayerKind(w.week)}` : sl.slot}</td>
                        <td style={styles.td}>{m.team.name}</td>
                        <td style={styles.td}>{m.team.thursday ? thuRoleName(m.role.name, w.week) : m.role.name}</td>
                        <td style={styles.td}>
                          {m.name}{!exactMatch && !partial && <span style={styles.tdMuted}> (close match)</span>}
                        </td>
                        <td style={styles.td}>
                          {hasConflict ? <span style={styles.badgeConflict}>Schedule Conflict</span>
                            : hasDup ? <span style={styles.badgeDup}>Duplicate</span>
                            : <span style={styles.badgeOk}>Confirmed</span>}
                        </td>
                      </tr>
                    );
                  })
                )}
              </tbody>
            </table>
          </div>
        ))
      )}
    </div>
  );
}

function ManageView({ config, updateConfig, monthState, updateMonthState, monthLabelText, isMobile }) {
  const [manageTab, setManageTab] = useState("teams");
  // Cards start collapsed; anything created in this session starts open so it can be edited right away.
  const [freshIds, setFreshIds] = useState({});
  const markFresh = (id) => setFreshIds((f) => ({ ...f, [id]: true }));
  const [newTeamName, setNewTeamName] = useState("");
  const [newRoleName, setNewRoleName] = useState({});
  const [restrictEmail, setRestrictEmail] = useState("");
  const [restrictTeamIds, setRestrictTeamIds] = useState([]);
  const [restrictCanManage, setRestrictCanManage] = useState(false);
  const [restrictCanEditEvents, setRestrictCanEditEvents] = useState(false);
  const [role1, setRole1] = useState("");
  const [role2, setRole2] = useState("");
  const [role3, setRole3] = useState("");
  const [role4, setRole4] = useState("");
  const [overrideDraft, setOverrideDraft] = useState({});
  const [progModal, setProgModal] = useState(null); // "+ Program" popup for the print program
  const [newVolunteerName, setNewVolunteerName] = useState({});
  // Drag-to-reorder roles: { teamId, roleId, overId } while a handle is held
  const [roleDrag, setRoleDrag] = useState(null);
  const roleDragRef = useRef(null);
  roleDragRef.current = roleDrag;

  const moveRole = (teamId, fromId, toId) => {
    if (!fromId || !toId || fromId === toId) return;
    updateConfig((prev) => ({
      ...prev,
      teams: prev.teams.map((t) => {
        if (t.id !== teamId) return t;
        const list = t.roles.slice();
        const from = list.findIndex((r) => r.id === fromId);
        const to = list.findIndex((r) => r.id === toId);
        if (from < 0 || to < 0) return t;
        const [item] = list.splice(from, 1);
        list.splice(to, 0, item);
        return { ...t, roles: list };
      }),
    }));
  };

  useEffect(() => {
    if (!roleDrag) return;
    const onMove = (e) => {
      const cur = roleDragRef.current;
      if (!cur) return;
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const row = el && el.closest ? el.closest("[data-role-row]") : null;
      const overId = row && row.getAttribute("data-team-id") === cur.teamId ? row.getAttribute("data-role-id") : cur.overId;
      if (overId !== cur.overId) setRoleDrag({ ...cur, overId });
      // auto-scroll near the screen edges
      if (e.clientY < 70) window.scrollBy(0, -14);
      else if (e.clientY > window.innerHeight - 70) window.scrollBy(0, 14);
      e.preventDefault();
    };
    const onUp = () => {
      const cur = roleDragRef.current;
      if (cur) moveRole(cur.teamId, cur.roleId, cur.overId);
      setRoleDrag(null);
    };
    window.addEventListener("pointermove", onMove, { passive: false });
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
    return () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      window.removeEventListener("pointercancel", onUp);
    };
  }, [!!roleDrag]);

  const printSettings = config.printSettings || {};
  const setPrintSetting = (field, value) => {
    updateConfig((prev) => ({ ...prev, printSettings: { ...(prev.printSettings || {}), [field]: value } }));
  };

  const allRoleOptions = config.teams.flatMap((t) =>
    t.roles.map((r) => ({ tag: roleTag(t.id, r.id), label: `${t.name} — ${r.name}` }))
  );
  const addGroup = () => {
    const picked = [role1, role2, role3, role4].filter(Boolean);
    const unique = Array.from(new Set(picked));
    if (unique.length < 2) return;
    updateConfig((prev) => ({ ...prev, compatibleGroups: [...(prev.compatibleGroups || []), unique] }));
    setRole1(""); setRole2(""); setRole3(""); setRole4("");
  };
  const removeGroup = (idx) => {
    updateConfig((prev) => ({ ...prev, compatibleGroups: (prev.compatibleGroups || []).filter((_, i) => i !== idx) }));
  };

  const addTeam = () => {
    const name = norm(newTeamName);
    if (!name) return;
    const newId = uid();
    markFresh(newId);
    updateConfig((prev) => ({ ...prev, teams: [...prev.teams, { id: newId, name, flexible: false, roles: [] }] }));
    setNewTeamName("");
  };
  const removeTeam = (teamId) => {
    updateConfig((prev) => ({
      ...prev,
      teams: prev.teams.filter((t) => t.id !== teamId),
      compatiblePairs: prev.compatiblePairs.filter((p) => !p.split("~").includes(teamId)),
    }));
  };
  const renameTeam = (teamId, name) => {
    updateConfig((prev) => ({ ...prev, teams: prev.teams.map((t) => (t.id === teamId ? { ...t, name } : t)) }));
  };
  const toggleFlexible = (teamId) => {
    updateConfig((prev) => ({ ...prev, teams: prev.teams.map((t) => (t.id === teamId ? { ...t, flexible: !t.flexible } : t)) }));
  };
  const addRole = (teamId) => {
    const name = norm(newRoleName[teamId]);
    if (!name) return;
    updateConfig((prev) => ({ ...prev, teams: prev.teams.map((t) => (t.id === teamId ? { ...t, roles: [...t.roles, { id: uid(), name }] } : t)) }));
    setNewRoleName((prev) => ({ ...prev, [teamId]: "" }));
  };
  const removeRole = (teamId, roleId) => {
    updateConfig((prev) => ({
      ...prev,
      teams: prev.teams.map((t) => (t.id === teamId ? { ...t, roles: t.roles.filter((r) => r.id !== roleId) } : t)),
    }));
  };
  const renameRole = (teamId, roleId, name) => {
    updateConfig((prev) => ({ ...prev, teams: prev.teams.map((t) => (t.id === teamId ? { ...t, roles: t.roles.map((r) => (r.id === roleId ? { ...r, name } : r)) } : t)) }));
  };
  const toggleRoleVerse = (teamId, roleId) => {
    updateConfig((prev) => ({ ...prev, teams: prev.teams.map((t) => (t.id === teamId ? { ...t, roles: t.roles.map((r) => (r.id === roleId ? { ...r, hasVerse: !r.hasVerse } : r)) } : t)) }));
  };
  const setRoleField = (teamId, roleId, field, value) => {
    updateConfig((prev) => ({ ...prev, teams: prev.teams.map((t) => (t.id === teamId ? { ...t, roles: t.roles.map((r) => (r.id === roleId ? { ...r, [field]: value } : r)) } : t)) }));
  };
  const togglePair = (aId, bId) => {
    const key = pairKey(aId, bId);
    updateConfig((prev) => ({ ...prev, compatiblePairs: prev.compatiblePairs.includes(key) ? prev.compatiblePairs.filter((p) => p !== key) : [...prev.compatiblePairs, key] }));
  };
  const setWeekLabel = (week, label) => {
    updateMonthState((prev) => ({ ...prev, weekLabels: { ...prev.weekLabels, [week]: label } }));
  };
  const toggleRestrictTeamId = (teamId) => {
    setRestrictTeamIds((prev) => (prev.includes(teamId) ? prev.filter((id) => id !== teamId) : [...prev, teamId]));
  };
  const addRestriction = () => {
    const email = normKey(restrictEmail);
    if (!email || (restrictTeamIds.length === 0 && !restrictCanEditEvents)) return;
    updateConfig((prev) => ({ ...prev, restrictions: { ...(prev.restrictions || {}), [emailToKey(email)]: { teams: restrictTeamIds, canManage: restrictCanManage, canEditEvents: restrictCanEditEvents } } }));
    setRestrictEmail("");
    setRestrictTeamIds([]);
    setRestrictCanManage(false);
    setRestrictCanEditEvents(false);
  };
  const editRestriction = (email, entry) => {
    setRestrictEmail(email);
    setRestrictTeamIds(entry.teams);
    setRestrictCanManage(entry.canManage);
    setRestrictCanEditEvents(entry.canEditEvents);
  };
  const removeRestriction = (name) => {
    updateConfig((prev) => {
      const next = { ...(prev.restrictions || {}) };
      delete next[name];
      return { ...prev, restrictions: next };
    });
  };

  // ---- Per-role volunteer list (used for the Assign volunteers dropdown) ----
  // Draft input state is keyed by "teamId|roleId" so each role has its own
  // in-progress "add volunteer" field. Multiple names can be entered at
  // once, separated by commas and/or new lines (e.g. pasted from a list),
  // and they're all added together — duplicates (case-insensitive, against
  // the existing list and within the pasted batch) are skipped.
  const volunteerDraftKey = (teamId, roleId) => `${teamId}|${roleId}`;
  const parseVolunteerNames = (raw) =>
    (raw || "")
      .split(/[\n,]/)
      .map((s) => norm(s))
      .filter(Boolean);
  const addVolunteer = (teamId, roleId) => {
    const draftKey = volunteerDraftKey(teamId, roleId);
    const names = parseVolunteerNames(newVolunteerName[draftKey]);
    if (names.length === 0) return;
    updateConfig((prev) => ({
      ...prev,
      teams: prev.teams.map((t) => {
        if (t.id !== teamId) return t;
        return {
          ...t,
          roles: t.roles.map((r) => {
            if (r.id !== roleId) return r;
            const existing = r.volunteers || [];
            const seen = new Set(existing.map((v) => normKey(v)));
            const additions = [];
            names.forEach((name) => {
              const key = normKey(name);
              if (seen.has(key)) return;
              seen.add(key);
              additions.push(name);
            });
            if (additions.length === 0) return r;
            return { ...r, volunteers: [...existing, ...additions] };
          }),
        };
      }),
    }));
    setNewVolunteerName((prev) => ({ ...prev, [draftKey]: "" }));
  };
  const removeVolunteer = (teamId, roleId, name) => {
    updateConfig((prev) => ({
      ...prev,
      teams: prev.teams.map((t) => {
        if (t.id !== teamId) return t;
        return {
          ...t,
          roles: t.roles.map((r) => (r.id === roleId ? { ...r, volunteers: (r.volunteers || []).filter((v) => v !== name) } : r)),
        };
      }),
    }));
  };

  const rigidTeams = config.teams.filter((t) => !t.flexible);
  const restrictionEntries = Object.entries(config.restrictions || {});

  // ---- Print Program (run sheet layout) editing ----
  const program = config.printProgram || defaultPrintProgram();
  const updateProgram = (updater) => {
    updateConfig((prev) => {
      const cur = prev.printProgram || defaultPrintProgram();
      const next = typeof updater === "function" ? updater(cur) : updater;
      return { ...prev, printProgram: next };
    });
  };
  const moveInArray = (arr, idx, dir) => {
    const next = arr.slice();
    const j = idx + dir;
    if (j < 0 || j >= next.length) return arr;
    [next[idx], next[j]] = [next[j], next[idx]];
    return next;
  };
  const addSection = (kind) => {
    const newId = uid();
    markFresh(newId);
    updateProgram((p) => ({
      ...p,
      sections: [...p.sections, kind === "divider"
        ? { id: newId, kind: "divider", label: "NEW DIVIDER" }
        : { id: newId, kind: "group", program: "", rows: [{ id: uid(), time: "", duration: "", task: "New task" }] }],
    }));
  };
  const removeSection = (id) => updateProgram((p) => ({ ...p, sections: p.sections.filter((s) => s.id !== id) }));
  const moveSection = (id, dir) => updateProgram((p) => ({ ...p, sections: moveInArray(p.sections, p.sections.findIndex((s) => s.id === id), dir) }));
  const updateSection = (id, field, value) => updateProgram((p) => ({ ...p, sections: p.sections.map((s) => (s.id === id ? { ...s, [field]: value } : s)) }));
  const addRow = (sectionId) => updateProgram((p) => ({ ...p, sections: p.sections.map((s) => (s.id === sectionId ? { ...s, rows: [...s.rows, { id: uid(), time: "", duration: "", task: "New task" }] } : s)) }));
  const removeRow = (sectionId, rowId) => updateProgram((p) => ({ ...p, sections: p.sections.map((s) => (s.id === sectionId ? { ...s, rows: s.rows.filter((r) => r.id !== rowId) } : s)) }));
  const updateRow = (sectionId, rowId, field, value) => updateProgram((p) => ({ ...p, sections: p.sections.map((s) => (s.id === sectionId ? { ...s, rows: s.rows.map((r) => (r.id === rowId ? { ...r, [field]: value } : r)) } : s)) }));
  const moveRowToSection = (fromSectionId, rowId, toSectionId) => {
    if (fromSectionId === toSectionId) return;
    updateProgram((p) => {
      let movedRow = null;
      const withoutRow = p.sections.map((s) => {
        if (s.id === fromSectionId) {
          movedRow = s.rows.find((r) => r.id === rowId);
          return { ...s, rows: s.rows.filter((r) => r.id !== rowId) };
        }
        return s;
      });
      if (!movedRow) return p;
      const withRow = withoutRow.map((s) => (s.id === toSectionId ? { ...s, rows: [...s.rows, movedRow] } : s));
      return { ...p, sections: withRow };
    });
  };
  const toggleRowWeek = (sectionId, rowId, row, w) => {
    const cur = row.showWeeks && row.showWeeks.length ? row.showWeeks : WEEKS.slice();
    const next = cur.includes(w) ? cur.filter((x) => x !== w) : [...cur, w].sort((a, b) => a - b);
    updateRow(sectionId, rowId, "showWeeks", next.length === WEEKS.length ? null : next);
  };
  const addProgramSubRole = (sectionId, tag) => {
    if (!tag) return;
    updateProgram((p) => ({ ...p, sections: p.sections.map((s) => (s.id === sectionId ? { ...s, programSubRoles: [...(s.programSubRoles || []), tag] } : s)) }));
  };
  const removeProgramSubRole = (sectionId, tag) => {
    updateProgram((p) => ({ ...p, sections: p.sections.map((s) => (s.id === sectionId ? { ...s, programSubRoles: (s.programSubRoles || []).filter((t) => t !== tag) } : s)) }));
  };

  // ---- Print the program layout (read-only copy of what is set up here) ----
  const printProgramLayout = () => {
    const esc = (v) => String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const roleLabel = (tag) => { const o = allRoleOptions.find((r) => r.tag === tag); return o ? o.label : tag; };
    const weeksText = (row) => (row.showWeeks && row.showWeeks.length ? "Wk " + row.showWeeks.join(", ") : "All");
    const overrideText = (list) => (list || []).map((ov) =>
      `${ov.weeks && ov.weeks.length ? "Wk " + ov.weeks.join(",") : "All weeks"} · ${ov.slots && ov.slots.length ? ov.slots.join(", ") : "All slots"} → ${[ov.time, ov.duration].filter((v) => norm(v)).join(" / ") || "—"}`
    ).join("<br>");
    let body = "";
    program.sections.forEach((sec) => {
      if (sec.kind === "divider") {
        const ov = overrideText(sec.overrides);
        body += `<tr class="band"><td colspan="7">${esc(sec.label)}${norm(sec.time) ? " — " + esc(sec.time) : ""}${ov ? `<div class="ov">${ov}</div>` : ""}</td></tr>`;
        return;
      }
      const rows = sec.rows || [];
      const extra = (sec.programSubRoles || []).map(roleLabel).join(", ");
      rows.forEach((row, i) => {
        body += "<tr>" +
          `<td>${esc(row.time)}</td><td>${esc(row.duration)}</td>` +
          (i === 0 ? `<td rowspan="${rows.length}" class="prog">${esc(sec.program)}${extra ? `<div class="ov">Extra lines: ${esc(extra)}</div>` : ""}</td>` : "") +
          `<td>${esc(row.task)}</td>` +
          `<td>${row.linkedRole ? esc(roleLabel(row.linkedRole)) : esc(row.fixedText || "(free text)")}</td>` +
          `<td>${weeksText(row)}</td>` +
          `<td class="ov">${overrideText(row.overrides)}</td></tr>`;
      });
    });
    let side = "";
    (program.sideBlocks || []).forEach((b) => {
      side += `<h3>${esc(b.title)}</h3><table><tbody>` +
        (b.rows || []).map((r) => `<tr><td>${esc(r.label)}</td><td>${r.linkedRole ? esc(roleLabel(r.linkedRole)) : "(free text)"}</td></tr>`).join("") +
        "</tbody></table>";
    });
    if ((program.soloRows || []).length) {
      side += `<h3>OTHER</h3><table><tbody>` +
        program.soloRows.map((r) => `<tr><td>${esc(r.label)}</td><td>${r.linkedRole ? esc(roleLabel(r.linkedRole)) : "(free text)"}</td></tr>`).join("") +
        "</tbody></table>";
    }
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Print Program</title><style>
      body{font-family:Arial,sans-serif;font-size:11px;color:#222;margin:16px}
      h2{margin:0 0 2px;font-size:16px} .sub{color:#666;margin-bottom:10px}
      h3{margin:14px 0 4px;font-size:12px}
      table{border-collapse:collapse;width:100%;margin-bottom:6px}
      td,th{border:1px solid #999;padding:3px 5px;vertical-align:top;text-align:left}
      th{background:#1F3864;color:#fff} .prog{font-weight:700} .band td{background:#e8e8e8;font-weight:700;text-align:center}
      .ov{font-size:9.5px;color:#555;font-weight:400}
      tr{page-break-inside:avoid}
    </style></head><body>
      <h2>Print Program (run sheet layout)</h2><div class="sub">Times are for the first service slot</div>
      <table><thead><tr><th>Time</th><th>Duration</th><th>Program</th><th>Task</th><th>Volunteer / Linked role</th><th>Weeks</th><th>Overrides</th></tr></thead><tbody>${body}</tbody></table>
      ${side}
    </body></html>`;
    const frame = document.createElement("iframe");
    frame.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0";
    frame.onload = () => {
      const w = frame.contentWindow;
      w.focus();
      w.print();
      setTimeout(() => frame.remove(), 60000);
    };
    frame.srcdoc = html;
    document.body.appendChild(frame);
  };

  // ---- "+ Program" popup (same idea as the Events tab) ----
  const durationToMins = (text) => {
    const t = norm(text).toUpperCase();
    const n = parseInt(t, 10);
    if (isNaN(n)) return "";
    return /HR/.test(t) ? String(n * 60) : String(n);
  };
  const firstClock = (text) => {
    const m = parseClockToMinutes(norm(text).split(/\s[–-]\s/)[0]);
    return m == null ? "" : minutesToHHMM(m);
  };
  const blankProgTask = () => ({ id: uid(), task: "", linkedRole: "", fixedText: "", showWeeks: null });
  const openProgModal = (section) => {
    const rows = section ? section.rows || [] : [];
    const start = rows[0] ? firstClock(rows[0].time) : "";
    const mins = rows[0] ? durationToMins(rows[0].duration) : "";
    setProgModal({
      sectionId: section ? section.id : null,
      program: section ? section.program || "" : "",
      startAt: start, mins, initStart: start, initMins: mins,
      afterId: "", shiftBelow: false,
      subRoles: section ? section.programSubRoles || [] : [],
      tasks: rows.length
        ? rows.map((r) => ({ id: r.id, task: r.task || "", linkedRole: r.linkedRole || "", fixedText: r.fixedText || "", showWeeks: r.showWeeks && r.showWeeks.length ? r.showWeeks : null }))
        : [blankProgTask()],
    });
  };
  // how many mins the program grew (new program = its whole length)
  const progShiftDelta = (m) => {
    const now = parseInt(m.mins, 10) || 0;
    return m.sectionId ? now - (parseInt(m.initMins, 10) || 0) : now;
  };
  const saveProgModal = () => {
    const m = progModal;
    if (!m) return;
    const startMin = parseClockToMinutes(m.startAt);
    const minsNum = parseInt(m.mins, 10);
    const hasMins = !isNaN(minsNum) && minsNum > 0;
    // untouched time/mins on an existing program = keep the original text (e.g. "1 HR")
    const keepTiming = !!m.sectionId && m.startAt === m.initStart && m.mins === m.initMins;
    const sectionId = m.sectionId || uid();
    if (!m.sectionId) markFresh(sectionId);
    const p = program;
    const old = p.sections.find((s) => s.id === sectionId);
    const oldRows = old ? old.rows || [] : [];
    const rows = (m.tasks.length ? m.tasks : [blankProgTask()]).map((t, i) => {
      const base = oldRows.find((r) => r.id === t.id) || {};
      const row = { ...base, id: t.id, task: t.task, linkedRole: t.linkedRole, fixedText: t.linkedRole ? "" : t.fixedText, showWeeks: t.showWeeks };
      if (i === 0 && !keepTiming) {
        row.time = startMin == null ? "" : hasMins ? `${minutesToHHMM(startMin)} – ${minutesToHHMM(startMin + minsNum)}` : minutesToHHMM(startMin);
        row.duration = hasMins ? `${minsNum} MINS` : "";
      }
      if (row.time === undefined) row.time = "";
      if (row.duration === undefined) row.duration = "";
      return row;
    });
    const section = { ...(old || { id: sectionId, kind: "group" }), program: m.program, programSubRoles: m.subRoles, rows };
    const rest = p.sections.filter((s) => s.id !== sectionId);
    let at = old ? p.sections.findIndex((s) => s.id === sectionId) : rest.length;
    if (m.afterId) {
      const idx = rest.findIndex((s) => s.id === m.afterId);
      if (idx >= 0) at = idx + 1;
    }
    let sections = [...rest.slice(0, at), section, ...rest.slice(at)];
    // push the later times by the extra mins, up to the END divider (rows with overrides are left alone)
    const skipped = [];
    const delta = progShiftDelta(m);
    if (m.shiftBelow && delta !== 0) {
      let ended = false;
      sections = sections.map((s, i) => {
        if (i <= at || ended) return s;
        if (s.kind === "divider") {
          if (/^END/i.test(norm(s.label))) ended = true;
          if (!norm(s.time)) return s;
          if ((s.overrides || []).length) { skipped.push(s.label || "divider"); return s; }
          return { ...s, time: shiftTimeText(s.time, delta) };
        }
        return { ...s, rows: (s.rows || []).map((r) => {
          if (!norm(r.time)) return r;
          if ((r.overrides || []).length) { skipped.push(r.task || s.program || "row"); return r; }
          return { ...r, time: shiftTimeText(r.time, delta) };
        }) };
      });
    }
    updateProgram({ ...p, sections });
    if (skipped.length) window.alert("Not shifted (they have overrides, please check): " + skipped.join(", "));
    setProgModal(null);
  };
  const renderProgModal = () => {
    const m = progModal;
    const setM = (field, value) => setProgModal((cur) => ({ ...cur, [field]: value }));
    const setTask = (id, field, value) => setProgModal((cur) => ({ ...cur, tasks: cur.tasks.map((t) => (t.id === id ? { ...t, [field]: value } : t)) }));
    const toggleTaskWeek = (t, w) => {
      const cur = t.showWeeks && t.showWeeks.length ? t.showWeeks : WEEKS.slice();
      const next = cur.includes(w) ? cur.filter((x) => x !== w) : [...cur, w].sort((a, b) => a - b);
      if (next.length === 0) return; // at least one week
      setTask(t.id, "showWeeks", next.length === WEEKS.length ? null : next);
    };
    const lbl = { fontSize: 12, fontWeight: 700, color: "var(--t6B6B6B)", marginBottom: 3 };
    const sectionName = (s) => (s.kind === "divider" ? (s.label || "Divider") : (s.program || ((s.rows || [])[0] || {}).task || "Untitled program"));
    return ReactDOM.createPortal(
      <div className="no-print" style={styles.modalOverlay} onMouseDown={(ev) => { if (ev.target === ev.currentTarget) setProgModal(null); }}>
        <div style={{ ...styles.modalCard, maxWidth: 580, maxHeight: "90vh", overflowY: "auto" }}>
          <div style={styles.modalIconRow}>
            <div style={{ ...styles.modalIconBadge, background: "var(--b1F3864)" }}>＋</div>
            <div style={styles.modalTitle}>{m.sectionId ? "Edit program" : "Add program"}</div>
          </div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 12 }}>
            <div style={{ flex: "1 1 130px" }}>
              <div style={lbl}>Start at (optional)</div>
              <input type="time" value={m.startAt} onChange={(ev) => setM("startAt", ev.target.value)}
                style={{ ...styles.roleEditInput, width: "100%", boxSizing: "border-box" }} />
            </div>
            <div style={{ flex: "0 0 84px" }}>
              <div style={lbl}>Mins</div>
              <input value={m.mins} onChange={(ev) => setM("mins", ev.target.value)} inputMode="numeric" placeholder="e.g. 7"
                style={{ ...styles.roleEditInput, width: "100%", boxSizing: "border-box" }} />
            </div>
          </div>
          <div style={{ fontSize: 11.5, color: "var(--t6B6B6B)", marginBottom: 12 }}>
            Times are for the first service slot. Other slots shift automatically.
          </div>
          <div style={{ marginBottom: 14 }}>
            <div style={lbl}>Program</div>
            <input value={m.program} onChange={(ev) => setM("program", ev.target.value)} placeholder="e.g. COMMUNION" autoFocus
              style={{ ...styles.roleEditInput, width: "100%", boxSizing: "border-box", fontWeight: 700 }} />
          </div>
          <div style={{ marginBottom: 14 }}>
            <div style={lbl}>Place after</div>
            <select value={m.afterId} onChange={(ev) => setM("afterId", ev.target.value)}
              style={{ ...styles.roleEditInput, width: "100%", boxSizing: "border-box" }}>
              <option value="">{m.sectionId ? "Keep current position" : "At the end"}</option>
              {program.sections.filter((s) => s.id !== m.sectionId).map((s) => (
                <option key={s.id} value={s.id}>{sectionName(s)}</option>
              ))}
            </select>
          </div>
          <div style={lbl}>Role / Task (linked to a ministry role)</div>
          {m.tasks.map((t) => (
            <div key={t.id} style={{ border: "1px solid var(--lE4DCC6)", borderRadius: 8, padding: 8, marginBottom: 8 }}>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center", marginBottom: 6 }}>
                <input value={t.task} onChange={(ev) => setTask(t.id, "task", ev.target.value)} placeholder="Task (optional — leave blank if same as program)"
                  style={{ ...styles.roleEditInput, flex: "1 1 150px" }} />
                <select value={t.linkedRole} onChange={(ev) => setTask(t.id, "linkedRole", ev.target.value)}
                  style={{ ...styles.roleEditInput, flex: "1 1 170px" }}>
                  <option value="">Linked role: none</option>
                  {allRoleOptions.map((r) => <option key={r.tag} value={r.tag}>{r.label}</option>)}
                </select>
                {!t.linkedRole && (
                  <input value={t.fixedText} onChange={(ev) => setTask(t.id, "fixedText", ev.target.value)} placeholder="Fixed text (optional)"
                    style={{ ...styles.roleEditInput, flex: "1 1 100%" }} />
                )}
                <button onClick={() => setProgModal((cur) => ({ ...cur, tasks: cur.tasks.filter((x) => x.id !== t.id) }))}
                  style={{ ...styles.smallBtn, background: "var(--bA6402F)" }} aria-label="Remove role/task">✕</button>
              </div>
              <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                <span style={{ fontSize: 11.5, color: "var(--t8A7F5E)" }}>Show on weeks:</span>
                {WEEKS.map((w) => (
                  <label key={w} style={{ display: "flex", alignItems: "center", gap: 3, fontSize: 11.5, color: "var(--t8A7F5E)" }}>
                    <input type="checkbox" checked={!t.showWeeks || t.showWeeks.includes(w)} onChange={() => toggleTaskWeek(t, w)} />
                    {w}
                  </label>
                ))}
              </div>
            </div>
          ))}
          <button onClick={() => setProgModal((cur) => ({ ...cur, tasks: [...cur.tasks, blankProgTask()] }))}
            style={{ ...styles.smallBtn, background: "var(--b2F4858)", marginBottom: 14 }}>+ Role / Task</button>
          <div style={lbl}>Extra lines under Program (pulled live from a ministry role, e.g. 1st Song, 2nd Song)</div>
          {m.subRoles.length > 0 && (
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 6 }}>
              {m.subRoles.map((tag) => {
                const opt = allRoleOptions.find((r) => r.tag === tag);
                return (
                  <span key={tag} style={{ background: "var(--bEFE7D3)", borderRadius: 20, padding: "3px 6px 3px 10px", fontSize: 12, display: "flex", alignItems: "center", gap: 6 }}>
                    {opt ? opt.label : tag}
                    <button onClick={() => setM("subRoles", m.subRoles.filter((k) => k !== tag))}
                      style={{ border: "none", background: "none", color: "var(--tA6402F)", cursor: "pointer", fontSize: 14, lineHeight: 1, padding: 0 }} aria-label="Remove">×</button>
                  </span>
                );
              })}
            </div>
          )}
          <select value="" onChange={(ev) => { if (ev.target.value) setM("subRoles", [...m.subRoles, ev.target.value]); }}
            style={{ ...styles.roleEditInput, width: "100%", boxSizing: "border-box", marginBottom: 12 }}>
            <option value="">+ Add a ministry role as an extra line…</option>
            {allRoleOptions.filter((r) => !m.subRoles.includes(r.tag)).map((r) => <option key={r.tag} value={r.tag}>{r.label}</option>)}
          </select>
          {progShiftDelta(m) !== 0 && (
            <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12.5, marginBottom: 12 }}>
              <input type="checkbox" checked={!!m.shiftBelow} onChange={(ev) => setM("shiftBelow", ev.target.checked)} />
              Shift the programs below by {progShiftDelta(m) > 0 ? "+" : ""}{progShiftDelta(m)} mins (until the END divider)
            </label>
          )}
          <div style={{ fontSize: 11.5, color: "var(--t6B6B6B)", marginBottom: 16 }}>
            Different Time/Duration on certain weeks or slots? Use Overrides on the row in the card after saving.
          </div>
          <div style={styles.modalActions}>
            <button onClick={() => setProgModal(null)} style={styles.modalCancelBtn}>Cancel</button>
            <button onClick={saveProgModal} style={{ ...styles.smallBtn, padding: "9px 18px" }}>Save</button>
          </div>
        </div>
      </div>,
      document.body
    );
  };

  // ---- Per-week/slot Time & Duration overrides for a print-program row ----
  const getOverrideDraft = (rowId) => overrideDraft[rowId] || { weeks: [], slots: [], time: "", duration: "" };
  const setOverrideDraftField = (rowId, field, value) => {
    setOverrideDraft((prev) => ({ ...prev, [rowId]: { ...getOverrideDraft(rowId), [field]: value } }));
  };
  const toggleOverrideDraftWeek = (rowId, w) => {
    const cur = getOverrideDraft(rowId);
    const weeks = cur.weeks.includes(w) ? cur.weeks.filter((x) => x !== w) : [...cur.weeks, w].sort((a, b) => a - b);
    setOverrideDraftField(rowId, "weeks", weeks);
  };
  const toggleOverrideDraftSlot = (rowId, s) => {
    const cur = getOverrideDraft(rowId);
    const slots = cur.slots.includes(s) ? cur.slots.filter((x) => x !== s) : [...cur.slots, s];
    setOverrideDraftField(rowId, "slots", slots);
  };
  const addRowOverride = (sectionId, rowId) => {
    const d = getOverrideDraft(rowId);
    if (!norm(d.time) && !norm(d.duration)) return;
    if (d.weeks.length === 0 && d.slots.length === 0) return;
    updateRow(sectionId, rowId, "overrides", [
      ...(program.sections.find((s) => s.id === sectionId).rows.find((r) => r.id === rowId).overrides || []),
      { id: uid(), weeks: d.weeks, slots: d.slots, time: norm(d.time), duration: norm(d.duration) },
    ]);
    setOverrideDraft((prev) => ({ ...prev, [rowId]: { weeks: [], slots: [], time: "", duration: "" } }));
  };
  const removeRowOverride = (sectionId, rowId, overrideId) => {
    const row = program.sections.find((s) => s.id === sectionId).rows.find((r) => r.id === rowId);
    updateRow(sectionId, rowId, "overrides", (row.overrides || []).filter((o) => o.id !== overrideId));
  };

  // ---- Same per-week/slot Time override mechanism, but for a divider's
  // own displayed time (e.g. "END OF 9:00 AM SERVICE — 10:10"), so the
  // printed end time can be pushed later/earlier on weeks where an earlier
  // row's duration was overridden and the service is expected to run long
  // or short. Reuses the same override draft state, keyed by section id
  // instead of row id.
  const addSectionOverride = (sectionId) => {
    const d = getOverrideDraft(sectionId);
    if (!norm(d.time) && !norm(d.duration)) return;
    if (d.weeks.length === 0 && d.slots.length === 0) return;
    const sec = program.sections.find((s) => s.id === sectionId);
    updateSection(sectionId, "overrides", [
      ...(sec.overrides || []),
      { id: uid(), weeks: d.weeks, slots: d.slots, time: norm(d.time), duration: norm(d.duration) },
    ]);
    setOverrideDraft((prev) => ({ ...prev, [sectionId]: { weeks: [], slots: [], time: "", duration: "" } }));
  };
  const removeSectionOverride = (sectionId, overrideId) => {
    const sec = program.sections.find((s) => s.id === sectionId);
    updateSection(sectionId, "overrides", (sec.overrides || []).filter((o) => o.id !== overrideId));
  };

  const addSideBlock = () => { const newId = uid(); markFresh(newId); updateProgram((p) => ({ ...p, sideBlocks: [...(p.sideBlocks || []), { id: newId, title: "NEW SECTION", rows: [{ id: uid(), label: "New row" }] }] })); };
  const removeSideBlock = (id) => updateProgram((p) => ({ ...p, sideBlocks: (p.sideBlocks || []).filter((b) => b.id !== id) }));
  const updateSideBlockTitle = (id, title) => updateProgram((p) => ({ ...p, sideBlocks: (p.sideBlocks || []).map((b) => (b.id === id ? { ...b, title } : b)) }));
  const addSideRow = (blockId) => updateProgram((p) => ({ ...p, sideBlocks: (p.sideBlocks || []).map((b) => (b.id === blockId ? { ...b, rows: [...b.rows, { id: uid(), label: "New row" }] } : b)) }));
  const removeSideRow = (blockId, rowId) => updateProgram((p) => ({ ...p, sideBlocks: (p.sideBlocks || []).map((b) => (b.id === blockId ? { ...b, rows: b.rows.filter((r) => r.id !== rowId) } : b)) }));
  const updateSideRow = (blockId, rowId, field, value) => updateProgram((p) => ({ ...p, sideBlocks: (p.sideBlocks || []).map((b) => (b.id === blockId ? { ...b, rows: b.rows.map((r) => (r.id === rowId ? { ...r, [field]: value } : r)) } : b)) }));

                    </label>
                    {(rowIdx > 0 || (sIdx > 0 && program.sections[sIdx - 1].kind !== "divider")) && (
                      <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11.5, color: "var(--t8A7F5E)" }}>
                        <input type="checkbox" checked={!!row.mergeVolAbove} onChange={() => updateRow(section.id, row.id, "mergeVolAbove", !row.mergeVolAbove)} />
                        Merge the volunteer cell with the row above (only if same name)
                      </label>
                    )}
                    {row.linkedRole && (
                      <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11.5, color: "var(--t8A7F5E)" }}>
                        <input type="checkbox" checked={!!row.showVerse} onChange={() => updateRow(section.id, row.id, "showVerse", !row.showVerse)} />
                        Show the verse on this row (if ticked on any row of this role, only those rows show it)
                      </label>
                    )}
                    <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", paddingTop: 2, borderTop: "1px dashed var(--lE4DCC6)" }}>
                      <span style={{ fontSize: 11.5, color: "var(--t8A7F5E)" }}>Show on weeks:</span>
                      {WEEKS.map((w) => (
                        <label key={w} style={{ display: "flex", alignItems: "center", gap: 3, fontSize: 11.5, color: "var(--t8A7F5E)" }}>
                          <input type="checkbox"
                            checked={!row.showWeeks || row.showWeeks.length === 0 || row.showWeeks.includes(w)}
                            onChange={() => toggleRowWeek(section.id, row.id, row, w)} />
                          {w}
                        </label>
                      ))}
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: 6, paddingTop: 4, borderTop: "1px dashed var(--lE4DCC6)" }}>
                      <span style={{ fontSize: 11.5, color: "var(--t8A7F5E)" }}>
                        Overrides for specific weeks/slots (optional) — different Time or Duration on certain weeks, or a whole separate slot (e.g. future 3:00 PM):
                      </span>
                      {(row.overrides || []).length > 0 && (
                        <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                          {(row.overrides || []).map((ov) => (
                            <div key={ov.id} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, background: "var(--bF6F1E4)", borderRadius: 6, padding: "4px 8px" }}>
                              <span style={{ flex: 1 }}>
                                {(ov.weeks && ov.weeks.length ? `Wk ${ov.weeks.join(",")}` : "All weeks")}
                                {" · "}
                                {(ov.slots && ov.slots.length ? ov.slots.join(", ") : "All slots")}
                                {" → "}
                                {[ov.time, ov.duration].filter((v) => norm(v)).join(" / ") || "—"}
                              </span>
                              <button onClick={() => removeRowOverride(section.id, row.id, ov.id)} style={styles.iconDanger} aria-label="Remove override">×</button>
                            </div>
                          ))}
                        </div>
                      )}
                      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
                        <span style={{ fontSize: 11, color: "var(--t8A7F5E)" }}>Weeks:</span>
                        {WEEKS.map((w) => (
                          <label key={w} style={{ display: "flex", alignItems: "center", gap: 2, fontSize: 11, color: "var(--t8A7F5E)" }}>
                            <input type="checkbox" checked={draft.weeks.includes(w)} onChange={() => toggleOverrideDraftWeek(row.id, w)} />
                            {w}
                          </label>
                        ))}
                        <span style={{ fontSize: 11, color: "var(--t8A7F5E)", marginLeft: 6 }}>Slots:</span>
                        {SLOTS.map((s) => (
                          <label key={s} style={{ display: "flex", alignItems: "center", gap: 2, fontSize: 11, color: "var(--t8A7F5E)" }}>
                            <input type="checkbox" checked={draft.slots.includes(s)} onChange={() => toggleOverrideDraftSlot(row.id, s)} />
                            {s}
                          </label>
                        ))}
                      </div>
                      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                        <input value={draft.time} onChange={(e) => setOverrideDraftField(row.id, "time", e.target.value)}
                          placeholder="Override time (optional)" style={{ ...styles.roleEditInput, fontSize: 11.5, padding: "5px 7px" }} />
                        <input value={draft.duration} onChange={(e) => setOverrideDraftField(row.id, "duration", e.target.value)}
                          placeholder="Override duration (optional)" style={{ ...styles.roleEditInput, fontSize: 11.5, padding: "5px 7px" }} />
                        <button onClick={() => addRowOverride(section.id, row.id)} style={styles.smallBtn}>Add override</button>
                      </div>
                    </div>
                    <div style={{ display: "flex", gap: 6, alignItems: "center", paddingTop: 2, borderTop: "1px dashed var(--lE4DCC6)" }}>
                      <span style={{ fontSize: 11.5, color: "var(--t8A7F5E)" }}>Move to section:</span>
                      <select value="" onChange={(e) => { if (e.target.value) moveRowToSection(section.id, row.id, e.target.value); }}
                        style={{ ...styles.restrictSelect, fontSize: 11.5, padding: "4px 6px" }}>
                        <option value="">— choose a group —</option>
                        {program.sections.filter((s) => s.kind === "group" && s.id !== section.id).map((s) => (
                          <option key={s.id} value={s.id}>{s.program || "(untitled group)"}</option>
                        ))}
                      </select>
                    </div>
                  </div>
                  );
                })}
                <button onClick={() => addRow(section.id)} style={styles.smallBtn}>Add row</button>
                </div>
              </React.Fragment>
            )}
            </div>
          </details>
          );
        })}
        <div style={{ display: "flex", gap: 8, marginTop: 6 }}>
          <button onClick={() => openProgModal(null)} style={styles.smallBtn}>+ Program</button>
          <button onClick={() => addSection("group")} style={styles.smallBtn}>Add program group</button>
          <button onClick={() => addSection("divider")} style={styles.smallBtn}>Add divider</button>
        </div>
        {progModal && renderProgModal()}

        <div style={{ ...styles.sectionLabel, marginTop: 24 }}>Side-by-side sections (e.g. Kids Coaches, Ushering)</div>
        <div style={styles.manageGrid}>
          {(program.sideBlocks || []).map((block) => (
            <details key={block.id} style={styles.teamCard} open={!!freshIds[block.id]}>
              <summary style={styles.teamCardSummary}>{block.title || "Untitled section"}</summary>
              <div style={styles.teamCardBody}>
              <div style={styles.teamCardHead}>
                <input value={block.title} onChange={(e) => updateSideBlockTitle(block.id, e.target.value)} style={styles.teamNameInput} />
                <button onClick={() => removeSideBlock(block.id)} style={styles.linkDanger}>Remove</button>
              </div>
              <div style={styles.roleList}>
                {(block.rows || []).map((row) => (
                  <div key={row.id} style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                    <div style={styles.roleEditRow}>
                      <input value={row.label} onChange={(e) => updateSideRow(block.id, row.id, "label", e.target.value)} style={styles.roleEditInput} />
                      <button onClick={() => removeSideRow(block.id, row.id)} style={styles.iconDanger} aria-label="Remove row">×</button>
                    </div>
                    <select value={row.linkedRole || ""} onChange={(e) => updateSideRow(block.id, row.id, "linkedRole", e.target.value)}
                      style={{ ...styles.restrictSelect, fontSize: 12 }}>
                      <option value="">— free text —</option>
                      {allRoleOptions.map((r) => <option key={r.tag} value={r.tag}>{r.label}</option>)}
                    </select>
                  </div>
                ))}
                <button onClick={() => addSideRow(block.id)} style={styles.smallBtn}>Add row</button>
              </div>
              </div>
            </details>
          ))}
          <div style={styles.newTeamCard}>
            <div style={styles.newTeamLabel}>Add a side-by-side section</div>
            <button onClick={addSideBlock} style={styles.smallBtn}>Add section</button>
          </div>
        </div>

        <div style={{ ...styles.sectionLabel, marginTop: 24 }}>Small label/value rows (e.g. Admin, Tech, Photographer)</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 6, maxWidth: 420 }}>
          {(program.soloRows || []).map((row) => (
            <div key={row.id} style={{ display: "flex", gap: 6, alignItems: "center" }}>
              <input value={row.label} onChange={(e) => updateSoloRow(row.id, "label", e.target.value)} style={{ ...styles.roleEditInput, maxWidth: 140 }} />
              <select value={row.linkedRole || ""} onChange={(e) => updateSoloRow(row.id, "linkedRole", e.target.value)}
                style={{ ...styles.restrictSelect, fontSize: 12, flex: 1 }}>
                <option value="">— free text —</option>
                {allRoleOptions.map((r) => <option key={r.tag} value={r.tag}>{r.label}</option>)}
              </select>
              <button onClick={() => removeSoloRow(row.id)} style={styles.iconDanger} aria-label="Remove row">×</button>
            </div>
          ))}
          <button onClick={addSoloRow} style={styles.smallBtn}>Add row</button>
        </div>
      </div>
      )}

      {manageTab === "editors" && (
      <div style={{ marginTop: 28 }}>
        <div style={styles.sectionLabel}>Editors list</div>
        <div style={styles.pairNote}>
          Type the exact email a person signs in with and check every ministry they're
          allowed to edit — one or several. Editing Service Details also requires the
          Service Lead ministry to be checked, and Manage Teams requires the "can also
          open Manage Teams" box below. Access is matched by login email, not by the
          nickname someone typed at signup — that nickname is only used to match their
          name against the schedule and has no effect on what they can edit. If an entry
          below still looks like a name instead of an email, that's a leftover from
          before this list switched to email-based access — edit it, replace it with
          that person's actual login email, and save so it stays secure. Anyone
          whose email is NOT on this list cannot edit anything, and cannot open Manage
          Teams — the app is view only for them until they're added. Make sure at least
          one email here always has "can manage teams" checked, or no one will be able
          to get back into this screen. The "can add &amp; edit events" box decides who
          can add, change or delete events in the Events tab; everyone else can only
          view them. Until you tick it for at least one person, Service Lead editors
          keep their current access to Events. This applies across every month.
        </div>
        <div style={styles.restrictAddRow}>
          <input value={restrictEmail} onChange={(e) => setRestrictEmail(e.target.value)}
            placeholder="Email (the one they sign in with)" style={styles.roleEditInput}
            type="email"
            onKeyDown={(e) => { if (e.key === "Enter") addRestriction(); }} />
        </div>
        <div style={styles.pairGrid}>
          {config.teams.map((t) => (
            <label key={t.id} style={styles.pairItem}>
              <input type="checkbox" checked={restrictTeamIds.includes(t.id)} onChange={() => toggleRestrictTeamId(t.id)} />
              {t.name}
            </label>
          ))}
        </div>
        <label style={{ ...styles.flexToggle, marginTop: 10 }}>
          <input type="checkbox" checked={restrictCanManage} onChange={() => setRestrictCanManage((v) => !v)} />
          Can also open Manage Teams (add/rename teams and roles, edit this editors list)
        </label>
        <label style={{ ...styles.flexToggle, marginTop: 6 }}>
          <input type="checkbox" checked={restrictCanEditEvents} onChange={() => setRestrictCanEditEvents((v) => !v)} />
          Can add &amp; edit events (Events tab)
        </label>
        <div style={{ marginTop: 10 }}>
          <button onClick={addRestriction} style={styles.smallBtn}>Save editor</button>
        </div>
        {restrictionEntries.length > 0 && (
          <div style={styles.restrictList}>
            {restrictionEntries.map(([key, raw]) => {
              const email = keyToEmail(key);
              const entry = normalizeRestriction(raw);
              const teamNames = entry.teams
                .map((id) => (config.teams.find((t) => t.id === id) || {}).name || "(deleted team)")
                .join(", ");
              return (
                <div key={key} style={styles.restrictRow}>
                  <span style={styles.restrictName}>{email}</span>
                  <span style={styles.restrictTeam}>
                    can edit: {teamNames || "(none yet)"}{entry.canManage ? " · can manage teams" : ""}{entry.canEditEvents ? " · can edit events" : ""}
                  </span>
                  <button onClick={() => editRestriction(email, entry)} style={styles.linkDanger}>Edit</button>
                  <button onClick={() => removeRestriction(key)} style={styles.linkDanger}>Remove</button>
                </div>
              );
            })}
          </div>
        )}
      </div>
      )}
    </div>
  );
}
